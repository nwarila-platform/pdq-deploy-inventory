# =========================================================================================== #
# Repository-local Ansible and shell quality gate.
# =========================================================================================== #
---
name: Quality

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install quality tools
        run: pip install -r requirements-quality.txt

      - name: Lint YAML
        run: yamllint -c .yamllint.yml ansible

      - name: Read framework pin
        id: pins
        run: |
          set -euo pipefail
          mapfile -t lines < .framework-pin
          if [ "${#lines[@]}" -ne 1 ]; then
            echo '.framework-pin must contain exactly one line' >&2
            exit 1
          fi
          pin="${lines[0]}"
          if [[ ! "${pin}" =~ ^[0-9a-f]{40}$ ]]; then
            echo '.framework-pin must contain one lowercase 40-character Git SHA' >&2
            exit 1
          fi
          printf 'ansible=%s\n' "${pin}" >> "${GITHUB_OUTPUT}"

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: nwarila-platform/ansible-framework
          ref: ${{ steps.pins.outputs.ansible }}
          path: .frameworks/ansible-framework
          persist-credentials: false

      - name: Compose application roles
        run: |
          set -euo pipefail
          scripts/materialize-role-scripts.sh
          for role_name in pdq_inventory pdq_deploy; do
            rsync -a --delete "ansible/applications/${role_name}/" \
              ".frameworks/ansible-framework/applications/${role_name}/"
          done

      - name: Lint Ansible
        working-directory: .frameworks/ansible-framework
        run: ansible-lint applications/pdq_inventory applications/pdq_deploy

      - name: Check shell syntax
        run: bash -n scripts/compose-and-run.sh scripts/materialize-role-scripts.sh
