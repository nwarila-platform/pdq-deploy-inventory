# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Config-contract validation executed by the v3.1.0 loader's
# 'INIT | Validating Merged Configuration' hook, with the merged configuration passed
# as 'config'. Holds ONLY load-bearing, module-inexpressible invariants (never a
# precondition a module already fails on — style guide §4b). Runs for every state;
# branch present-specific asserts on 'state'.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

# Load-bearing config invariant: the three data-disk identifiers and their drive letters must be
# DISTINCT. No module/arg-spec expresses deploy/inventory/share or E:/F:/G uniqueness; a collision
# resolves two logical disks to the same physical disk/partition (silent-wrong).
- name: 'BEGIN | Assert Data Disk Identifiers And Drive Letters Are Distinct'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __disk_ids__:
      - "{{ config.deploy_disk_id | default('') | string | trim }}"
      - "{{ config.inventory_disk_id | default('') | string | trim }}"
      - "{{ config.share_disk_id | default('') | string | trim }}"
    __disk_letters__:
      - "{{ config.data_disks.deploy.drive_letter | default('') | string | trim | upper }}"
      - "{{ config.data_disks.inventory.drive_letter | default('') | string | trim | upper }}"
      - "{{ config.data_disks.share.drive_letter | default('') | string | trim | upper }}"
  ansible.builtin.assert:
    that:
      - (__disk_ids__ | select | list | unique | length) == (__disk_ids__ | select | list | length)
      - (__disk_letters__ | select | list | unique | length) == (__disk_letters__ | select | list | length)
    fail_msg: >-
      pdq.deploy_disk_id/inventory_disk_id/share_disk_id must each identify a DIFFERENT disk, and
      data_disks.deploy/inventory/share.drive_letter must each be a DIFFERENT letter. A collision makes
      two logical disks resolve to the same physical disk/partition (silent-wrong). ids={{ __disk_ids__ }}
      letters={{ __disk_letters__ }}.
    quiet: true

# Load-bearing config invariant: PDQ Central Server / integration REQUIRES an Enterprise license key.
# There is no safe default and a missing key fails obscurely deep inside the MSI silent install.
- name: 'BEGIN | Assert PDQ Enterprise License Key Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  no_log: true   # the license key is a secret; never echo it in the assert context
  ansible.builtin.assert:
    that:
      - (config.license_key | default('') | string | trim) | length > 0
    fail_msg: >-
      pdq.license_key is REQUIRED (PDQ Enterprise — Central Server + Deploy/Inventory integration need it)
      but is empty/undefined. Declare license_key in the pdq: override dict (kept no_log).
    quiet: true

# Load-bearing config invariant: the Background Service User NAME must be present. The SAME account
# runs BOTH PDQ Deploy and PDQ Inventory (the integration prerequisite per PDQ docs); it must be a
# local admin with R/W to the App Share. No safe default.
- name: 'BEGIN | Assert Background Service User Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.service_account.name | default('') | string | trim) | length > 0
    fail_msg: >-
      pdq.service_account.name is REQUIRED — one Background Service User runs both PDQ Deploy and PDQ
      Inventory (integration requires a shared service user). Declare service_account.name in the pdq:
      override dict.
    quiet: true

#endregion --- [ Script ] -------------------------------------------------------------------- #
