# =========================================================================================== #
# File: '{{ role_path }}/tasks/absent_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# The inverse of present, region by region: the permissions this role granted are revoked, then
# the account it created is deleted.
#
# The OU is NOT removed. It is a shared directory container this role did not necessarily create,
# and other deployments file machines in it -- removing it would take their computers with it.
# That is a deliberate asymmetry, stated rather than silently skipped.
#
# The permissions come off BEFORE the account goes, so the ACEs are removed while the SID they
# name still resolves. Deleting the account first would leave orphaned SIDs on a shared ACL that
# nothing here could then identify as its own.
#
# =========================================================================================== #
---

#region ------ [ Process: Remove What This Role Created ] ------------------------------------- #

- name: 'PROCESS | Remove The Directory Objects'
  block:

    - name: 'PROCESS | Remove The LAPS Read Permissions From The Declared OUs'
      register: '__pdq_ad_config_permissions__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          AccountIdentity: "{{ pdq_ad_config_running.service_account.name }}"
          OrganizationalUnit: "{{ pdq_ad_config_running.laps_read_ous }}"
          State: 'absent'
        script: "{{ lookup('ansible.builtin.file', 'Set-LapsPermissions.ps1') }}"

    - name: 'PROCESS | Remove The PDQ Service Account'
      microsoft.ad.user:
        identity: "CN={{ pdq_ad_config_running.service_account.name }},{{ pdq_ad_config_running.service_account.ou }}"
        state: 'absent'

#endregion --- [ Process: Remove What This Role Created ] ------------------------------------- #

#region ------ [ End: Prove The Removal ] ----------------------------------------------------- #

- name: 'END | Prove The Account Is Gone And The Shared OUs Remain'
  block:

    - name: 'END | Re-Read The Service Account'
      changed_when: false
      check_mode: false
      failed_when: false
      register: '__pdq_ad_config_final_account__'

      microsoft.ad.object_info:
        identity: "CN={{ pdq_ad_config_running.service_account.name }},{{ pdq_ad_config_running.service_account.ou }}"

    - name: 'END | Re-Read The Shared OUs'
      changed_when: false
      check_mode: false
      failed_when: false
      loop: "{{ pdq_ad_config_running.laps_read_ous }}"
      loop_control:
        label: "{{ item }}"
      register: '__pdq_ad_config_final_ous__'

      microsoft.ad.object_info:
        identity: "{{ item }}"

    - name: 'END | Assert The Account Is Absent And The Shared OUs Survive'
      ansible.builtin.assert:
        fail_msg: >-
          Removal is not complete, or it took something with it. The account must be gone and
          every OU in pdq_ad_config_running.laps_read_ous must still exist -- they are shared containers this role does
          not own and must never delete.
        quiet: true
        that:
          - (__pdq_ad_config_final_account__.objects | default([]) | length) == 0
          - >-
            __pdq_ad_config_final_ous__.results
            | map(attribute='objects') | map('default', [], true)
            | map('length') | select('equalto', 0) | list | length == 0

#endregion --- [ End: Prove The Removal ] ----------------------------------------------------- #
