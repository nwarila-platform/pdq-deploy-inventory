# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Given a password, converges the PDQ computer OU and the declared service accounts, each with
# exactly the group membership its declaration names.
#
# The role sets the state it declares; it does not survey the directory first. Nothing here
# defends against states this role cannot produce.
#
# ============================================================================================= #
---
#region ------ [ Process: Converge The PDQ Directory Configuration ] -------------------------- #

- name: 'PROCESS | Apply The Directory Declaration'
  vars:
    __computer_ou_name__: "{{ pdq_ad_config_running.computer_ou | regex_replace('^OU=([^,]+),.*$', '\\1') }}"
    __computer_ou_path__: "{{ pdq_ad_config_running.computer_ou | regex_replace('^OU=[^,]+,', '') }}"

  # Begin The 'Process' Block
  block:

    #region ------ [ Process: Converge The Computer OU ] -------------------------------------- #

    - name: 'PROCESS | Ensure The PDQ Computer OU Exists'
      microsoft.ad.ou:
        name: "{{ __computer_ou_name__ }}"
        path: "{{ __computer_ou_path__ }}"
        state: 'present'

    #endregion --- [ Process: Converge The Computer OU ] -------------------------------------- #

    #region ------ [ Process: Converge The Service Account ] ---------------------------------- #

    # One task, every declared account. Each is set to exactly what the declaration says -- its
    # group membership included, so an account that gained a group elsewhere loses it here, and
    # a group is granted by naming it rather than by writing an ACE somewhere. no_log
    # because a password crosses on every item; the loop label would be censored with it, so the
    # accounts are named by the report below rather than by the recap.
    - name: 'PROCESS | Ensure The PDQ Service Accounts Are Exact'
      no_log: true
      loop: "{{ pdq_ad_config_running.service_accounts }}"

      microsoft.ad.user:
        attributes:
          set:
            adminCount: null
        enabled: true
        groups:
          lookup_failure_action: 'fail'
          permissions_failure_action: 'fail'
          set: "{{ ['Domain Users'] + (item.groups | default([], true)) }}"
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        password_never_expires: false
        path: "{{ item.ou }}"
        state: 'present'
        update_password: 'when_changed'
        user_cannot_change_password: true

    # The recap says which accounts the run converged, because the task that converged them cannot.
    - name: 'PROCESS | Report The Accounts This Run Declared'
      changed_when: false

      ansible.builtin.debug:
        msg: >-
          Directory accounts declared:
          {{ pdq_ad_config_running.service_accounts | map(attribute='name') | join(', ') }}.

    #endregion --- [ Process: Converge The Service Account ] ---------------------------------- #

#endregion --- [ Process: Converge The PDQ Directory Configuration ] -------------------------- #
