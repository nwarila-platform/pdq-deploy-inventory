# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Given a password, converges the PDQ computer OU, service account and the account's complete
# explicit Windows LAPS read permissions on the declared OUs. BEGIN reads the prerequisites,
# PROCESS applies the declaration, and END proves the resulting directory state.
#
# ============================================================================================= #
---
#region ------ [ Begin: Converge The PDQ Directory Configuration ] ----------------------------- #

- name: 'BEGIN | Read The Directory Prerequisites'
  vars:
    __service_account_dn__: >-
      CN={{ pdq_ad_config_running.service_account.name }},{{ pdq_ad_config_running.service_account.ou }}

  # Begin The 'Begin' Block
  block:

    #region ------ [ Begin: Read The LAPS Schema ] --------------------------------------------- #

    - name: 'BEGIN | Read The Windows LAPS Password Schema Object'
      check_mode: false
      changed_when: false
      register: '__pdq_ad_config_laps_schema__'

      microsoft.ad.object_info:
        ldap_filter: '(name=ms-LAPS-Password)'
        search_base: 'CN=Schema,CN=Configuration,DC=tcn,DC=trinitytechnicalservices,DC=com'

    - name: 'BEGIN | Require The Windows LAPS Password Schema Object'
      ansible.builtin.assert:
        fail_msg: >-
          LAPS schema prerequisite failed: ms-LAPS-Password is not present exactly once in the
          Active Directory schema.
        quiet: true
        that:
          - __pdq_ad_config_laps_schema__.objects | length == 1

    #endregion --- [ Begin: Read The LAPS Schema ] --------------------------------------------- #

    #region ------ [ Begin: Read The Service Account ] ----------------------------------------- #

    - name: 'BEGIN | Read The Service Account Lock State'
      check_mode: false
      changed_when: false
      register: '__pdq_ad_config_initial_account__'

      microsoft.ad.object_info:
        identity: "{{ __service_account_dn__ }}"
        properties:
          - 'userAccountControl'
          - 'msDS-User-Account-Control-Computed'

    - name: 'BEGIN | Refuse A Locked Service Account'
      ansible.builtin.assert:
        fail_msg: >-
          Locked service account failure: {{ pdq_ad_config_running.service_account.name }} is
          locked. This role is not authorised to unlock it.
        quiet: true
        that:
          - >-
            (__pdq_ad_config_initial_account__.objects | length == 0) or
            (((__pdq_ad_config_initial_account__.objects[0]
               ['msDS-User-Account-Control-Computed'] | int) // 16) % 2 == 0)

    #endregion --- [ Begin: Read The Service Account ] ----------------------------------------- #

#endregion --- [ Begin: Converge The PDQ Directory Configuration ] ----------------------------- #


#region ------ [ Process: Converge The PDQ Directory Configuration ] --------------------------- #

- name: 'PROCESS | Apply The Directory Declaration'
  vars:
    __computer_ou_name__: "{{ pdq_ad_config_running.computer_ou | regex_replace('^OU=([^,]+),.*$', '\\1') }}"
    __computer_ou_path__: "{{ pdq_ad_config_running.computer_ou | regex_replace('^OU=[^,]+,', '') }}"

  # Begin The 'Process' Block
  block:

    #region ------ [ Process: Converge The Computer OU ] --------------------------------------- #

    - name: 'PROCESS | Ensure The PDQ Computer OU Exists'
      microsoft.ad.ou:
        name: "{{ __computer_ou_name__ }}"
        path: "{{ __computer_ou_path__ }}"
        state: 'present'

    #endregion --- [ Process: Converge The Computer OU ] --------------------------------------- #

    #region ------ [ Process: Converge The Service Account ] ----------------------------------- #

    - name: 'PROCESS | Ensure The PDQ Service Account Is Exact'
      no_log: true

      microsoft.ad.user:
        # adminCount is cleared, not left alone: a value here marks an account as having held
        # protected-group membership, and AdminSDHolder then overwrites the ACL this role sets.
        attributes:
          set:
            adminCount: null
        enabled: true
        groups:
          lookup_failure_action: 'fail'
          permissions_failure_action: 'fail'
          # 'Domain Users' and nothing else -- which IS the enforcement, because set is exclusive
          # and removes any group added by hand. An empty list cannot be used: every account has a
          # mandatory primary group, so set: [] is unsatisfiable and reports changed on every run.
          set: [ 'Domain Users' ]
        name: "{{ pdq_ad_config_running.service_account.name }}"
        password: "{{ pdq_ad_config_running.service_account.password }}"
        # The password does NOT expire: rotation is a deliberate act performed outside this role,
        # not something domain policy triggers. Without this the account simply stops working one
        # day, and the first symptom is PDQ failing to authenticate to the directory.
        password_never_expires: true
        path: "{{ pdq_ad_config_running.service_account.ou }}"
        state: 'present'
        update_password: 'when_changed'
        # Nobody signs in as this account interactively, so nobody may change its password from
        # under the authoritative copy.
        user_cannot_change_password: true

    #endregion --- [ Process: Converge The Service Account ] ----------------------------------- #

    #region ------ [ Process: Reconcile The Account ACLs ] ------------------------------------- #

    - name: 'PROCESS | Reconcile The Account Explicit LAPS Read ACEs'
      register: '__pdq_ad_config_laps_permissions__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          AccountIdentity: "{{ pdq_ad_config_running.service_account.name }}"
          OrganizationalUnit: "{{ pdq_ad_config_running.laps_read_ous }}"
          State: 'present'
        script: "{{ lookup('ansible.builtin.file', 'Set-LapsPermissions.ps1') }}"

    #endregion --- [ Process: Reconcile The Account ACLs ] ------------------------------------- #

#endregion --- [ Process: Converge The PDQ Directory Configuration ] --------------------------- #
