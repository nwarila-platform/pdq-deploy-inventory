# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# The declaration boundary. Everything this role needs is site-specific -- an account name, the
# OUs of one particular directory, and a password the caller resolved -- so nothing is defaulted
# into working values and a missing input fails here rather than half-way through a directory.
#
# =========================================================================================== #
---

- name: 'VALIDATE | Require The Declared Interface'
  vars:
    __accounts__: "{{ pdq_ad_config_running.service_accounts | default([], true) }}"

  ansible.builtin.assert:
    fail_msg: >-
      pdq_ad_config is missing its declaration. It requires a non-empty
      pdq_ad_config_running.service_accounts, each entry carrying name, ou and password, plus
      pdq_ad_config_running.computer_ou.
      The PASSWORD is supplied by the caller: this role does not source it, generate it or store
      it, so the playbook must resolve it and pass the value.
    quiet: true
    that:
      - __accounts__ | length > 0
      - __accounts__ | rejectattr('name', 'defined') | list | length == 0
      - __accounts__ | rejectattr('ou', 'defined') | list | length == 0
      - __accounts__ | rejectattr('password', 'defined') | list | length == 0
      - __accounts__ | selectattr('name', 'equalto', '') | list | length == 0
      - __accounts__ | selectattr('ou', 'equalto', '') | list | length == 0
      - __accounts__ | selectattr('password', 'equalto', '') | list | length == 0
      # An account declared twice is two declarations of one object, and the second silently wins.
      - >-
        (__accounts__ | map(attribute='name') | list | length)
        == (__accounts__ | map(attribute='name') | unique | list | length)
      - pdq_ad_config_running.computer_ou | default('') | length > 0

- name: 'VALIDATE | Require Distinguished Names Where A Distinguished Name Is Meant'
  vars:
    __accounts__: "{{ pdq_ad_config_running.service_accounts | default([], true) }}"

  ansible.builtin.assert:
    fail_msg: >-
      Every account's ou and pdq_ad_config_running.computer_ou must be full distinguished names.
      A short name silently resolves to the wrong container or to nothing at all.
    quiet: true
    that:
      - >-
        __accounts__ | map(attribute='ou')
        | reject('search', '^(OU|CN)=.*,DC=') | list | length == 0
      - pdq_ad_config_running.computer_ou is search('^OU=.*,DC=')

- name: 'VALIDATE | Require A Declared Group List To Name Groups'
  vars:
    __accounts__: "{{ pdq_ad_config_running.service_accounts | default([], true) }}"

  ansible.builtin.assert:
    fail_msg: >-
      An account declaring groups must name at least one. An empty list says the account is in no
      group beyond Domain Users, which is what omitting the key already says -- omit it instead,
      so a reader cannot mistake an empty declaration for an unfinished one.
    quiet: true
    that:
      - >-
        __accounts__ | rejectattr('groups', 'undefined')
        | rejectattr('groups') | list | length == 0
      - >-
        __accounts__ | rejectattr('groups', 'undefined') | map(attribute='groups') | flatten
        | select('equalto', '') | list | length == 0
