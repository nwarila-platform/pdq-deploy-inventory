# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the PDQ Deploy role. The v3 loader merges the OS overlay
# in vars/ over this map and publishes the result as 'pdq_deploy_running'; tasks read only the
# merged map, never these keys directly.
#
# WHAT BELONGS HERE: values that are universally safe — true for anyone running this role,
# whatever their account, bucket or artifact layout. Product identity, the silent switch, the
# Add/Remove Programs identity the product registers.
#
# WHAT DOES NOT: anything deployment-specific. The artifact bucket carries an account id, and
# the installer and licence paths change with every version and every site. A default for those
# is not universally safe — it is one site's value wearing a default's clothes, and a role that
# ships one will silently reach for the wrong object when someone else runs it. They are supplied
# by the PLAYBOOK, where they are visible and changeable, described in meta/main.yml, and
# enforced by tasks/validate.yml.
#
# =========================================================================================== #
---
pdq_deploy_defaults:

  #region ------ [ Install ] ----------------------------------------------------------------- #

  install:
    # Staging directory on the guest. The installer is removed from here after execution.
    #
    # Genuinely site-specific: application control (AppLocker/WDAC) and endpoint protection are
    # commonly configured to permit execution only from named paths, so a site may have to stage
    # the installer somewhere its security software already trusts. This default suits a host with
    # no such policy; it is expected to be overridden where one exists.
    staging_dir: 'C:\Windows\Temp\pdq-deploy-install'

    # A wrong silent switch can leave the installer waiting on a dialog instead of returning.
    # Bounding it here fails the run inside Ansible rather than hanging the play.
    timeout_seconds: 900

  #endregion --- [ Install ] ----------------------------------------------------------------- #

  #region ------ [ Product identity ] -------------------------------------------------------- #

  # Install state is read from Add/Remove Programs, not from the vendor's own key. Observed on a
  # converged host 2026-08-13: the product key exists but carries no install-path value, while the
  # ARP entry carries the version AND the install location, is a documented Windows contract rather
  # than a vendor implementation detail, and is removed on uninstall by definition. The clean path
  # already reads ARP for its uninstall command, so both directions now agree on one source.
  # Where Windows keeps those entries is a property of Windows, not of this deployment, so the
  # script owns the roots outright rather than offering a setting with one correct value.
  arp:
    display_name: 'PDQ Deploy'

  service_name: 'PDQDeploy'

  # Client consoles reach the background service on this port. The product's own default, measured
  # on a converged host 2026-08-18 -- the 7337 named in older notes here is wrong. A site that must
  # move it overrides this; the MODE itself is not offered, because an all-in-one Central Server is
  # a design invariant of this repository rather than a choice.
  # Whether console users are authorised individually rather than by being administrators. True by
  # default because that is the tighter posture and the one the product's own wizard selects; a
  # deployment that is not ready to model roles sets it false explicitly rather than by accident.
  # Stated as a boolean because that is what an on-or-off setting looks like everywhere else; the
  # dword the registry actually stores is the role's business, not the caller's.
  rbac_enabled: true

  server:
    port: 6336

    # Which addresses the server answers consoles on. Null means every address, which is what a
    # host whose address is assigned at launch needs, and what the wizard chooses by default. A
    # site that must bind explicitly supplies a list instead, and the all-addresses flag is
    # cleared for it.
    listen_addresses: null

  # The product's command line, which is how the role asks the product about itself. Hardcoded
  # rather than read from Add/Remove Programs because the path cannot vary: the vendor stub
  # swallows INSTALLLOCATION, APPLICATIONFOLDER and /p without effect and returns 0 either way,
  # so every silent install lands here (measured 2026-08-18). Deriving it would suggest a
  # flexibility that does not exist.
  cli_path: 'C:\Program Files (x86)\Admin Arsenal\PDQ Deploy\PDQDeploy.exe'

  # The background service executable, which is what the firewall exception is written for. Same
  # fixed location as the command line above, and fixed for the same reason.
  service_path: 'C:\Program Files (x86)\Admin Arsenal\PDQ Deploy\PDQDeployService.exe'

  # Product settings the deployment declares, keyed by the names in the settings script's
  # SETTINGS table -- DeploymentCleanupDays, PerformanceCopyMode, RepositoryPath -- not by the
  # product's own dotted spelling, which the script owns the translation for. A name absent here
  # is unmanaged, which is a different thing from one set to the product's default; a name the
  # table does not carry is a typo and fails the run. Empty by default because a setting is a
  # deployment choice, never a universal one. The table is the inventory: it names every setting,
  # its type, the values an enumerated one allows, and which are inferred rather than proven.
  # Only the families the product's SERVICE reads are offered -- the console-side pages live in a
  # per-user hive no converge can reach.
  settings: {}

  #region ------ [ Installer layout ] -------------------------------------------------------- #

  # The application repository is laid out <product>/<component>/<version>/<file>, so older
  # builds stay addressable for rollback rather than being overwritten in place. The literal
  # token <version> is replaced with installer.version at fetch time, which is why the playbook
  # supplies only a version and a digest. A repository laid out differently overrides this whole
  # path, with or without the token.
  installer:
    path: 'PDQ/Deploy/<version>/PDQ_Deploy_x86-x64.exe'

  #endregion --- [ Installer layout ] -------------------------------------------------------- #

  #region ------ [ Background service user ] ------------------------------------------------- #

  # Deploy and Inventory are co-located and share ONE Background Service User, so the name is
  # product identity rather than a deployment choice. Where its password lives IS deployment
  # specific, so the bucket, object and digest come from the playbook.
  #
  # RENAMING does not retire the old account: present converges what is declared and removes
  # nothing, so the previous name survives as a member of Administrators (measured 2026-08-20).
  # Retirement is a removal, and removals belong to state=absent -- rename in two steps.
  service_account:
    name: 'svc-pdq'

  #endregion --- [ Background service user ] ------------------------------------------------- #

  # The product creates its database here the first time the service starts, so the role sets the
  # path before that happens and never has to stop, copy and restart. The DRIVE comes from the
  # playbook -- this role consumes a letter, it does not provision the disk. The folder is not
  # decoration: an ACL belongs on a directory, where it can be set without touching the volume
  # root and the permissions Windows grants there by default.
  database:
    directory: 'PDQ Deploy'

  # The repository holds the package files a deployment copies to its targets, so it is reached
  # over UNC rather than by local path: the vendor requires that for pull copy mode and for
  # Central Server, where several consoles read the same files. Shared from a folder rather than
  # the volume root for the same reason the database sits in one -- the share and its directory
  # can then be permissioned independently of the disk.
  #
  # RENAMING the share or moving either directory retires nothing: the old share stays published
  # and old data stays where it was (measured 2026-08-20, including a database the product simply
  # recreates empty at a new path). Renames and moves are two-step operations through
  # state=absent, never a silent side effect of present.
  repository:
    directory: 'PDQ Repository'
    share_name: 'AppRepo$'

  #endregion --- [ Product identity ] -------------------------------------------------------- #
