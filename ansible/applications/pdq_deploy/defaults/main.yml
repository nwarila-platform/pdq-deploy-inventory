# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the PDQ Deploy role. The v3 loader merges the OS overlay
# in vars/ over this map and publishes the result as 'pdq_deploy_running'; tasks read only the
# merged map, never these keys directly.
#
# WHAT BELONGS HERE: values that are universally safe — true for anyone running this role,
# whatever their account, bucket or artifact layout. Product identity, the silent switch, the
# Add/Remove Programs identity the product registers.
#
# WHAT DOES NOT: anything deployment-specific. The artifact bucket carries an account id, and
# the installer and licence paths change with every version and every site. A default for those
# is not universally safe — it is one site's value wearing a default's clothes, and a role that
# ships one will silently reach for the wrong object when someone else runs it. They are supplied
# by the PLAYBOOK, where they are visible and changeable, described in meta/main.yml, and
# enforced by tasks/validate.yml.
#
# =========================================================================================== #
---
pdq_deploy_defaults:

  #region ------ [ Install ] ----------------------------------------------------------------- #

  install:
    # Staging directory on the guest. The installer is removed from here after execution.
    #
    # Genuinely site-specific: application control (AppLocker/WDAC) and endpoint protection are
    # commonly configured to permit execution only from named paths, so a site may have to stage
    # the installer somewhere its security software already trusts. This default suits a host with
    # no such policy; it is expected to be overridden where one exists.
    staging_dir: 'C:\Windows\Temp\pdq-deploy-install'

    # A wrong silent switch can leave the installer waiting on a dialog instead of returning.
    # Bounding it here fails the run inside Ansible rather than hanging the play.
    timeout_seconds: 900

  #endregion --- [ Install ] ----------------------------------------------------------------- #

  #region ------ [ Product identity ] -------------------------------------------------------- #

  # Install state is read from Add/Remove Programs, not from the vendor's own key. Observed on a
  # converged host 2026-08-13: the product key exists but carries no install-path value, while the
  # ARP entry carries the version AND the install location, is a documented Windows contract rather
  # than a vendor implementation detail, and is removed on uninstall by definition. The clean path
  # already reads ARP for its uninstall command, so both directions now agree on one source.
  # Where Windows keeps those entries is a property of Windows, not of this deployment, so the
  # script owns the roots outright rather than offering a setting with one correct value.
  arp:
    display_name: 'PDQ Deploy'

  service_name: 'PDQDeploy'

  # Client consoles reach the background service on this port. The product's own default, measured
  # on a converged host 2026-08-18 -- the 7337 named in older notes here is wrong. A site that must
  # move it overrides this; the MODE itself is not offered, because an all-in-one Central Server is
  # a design invariant of this repository rather than a choice.
  # Whether console users are authorised individually (RBAC on) rather than by being an
  # administrator (RBAC off). FALSE by default: with it on and no roles yet modelled the product
  # authorises no one, locking every human out of the console, so off is what lets administrators
  # open it. A site ready to model roles sets it true and defines those users in the console. The
  # input is a boolean; the dword the registry stores is the role's business, not the caller's.
  rbac_enabled: false

  # Who may open the console. A silent install authorises no one, and RBAC being off does not change
  # that -- the product still requires an explicit Console User, not merely local administrator
  # rights. Defaults to the built-in Administrators group so any local administrator can open the
  # console; a site models finer access by naming individual accounts instead. Local accounts take
  # the bare name.
  console_users:
    - 'Administrators'

  server:
    port: 6336

    # Which addresses the server answers consoles on. Null means every address, which is what a
    # host whose address is assigned at launch needs, and what the wizard chooses by default. A
    # site that must bind explicitly supplies a list instead, and the all-addresses flag is
    # cleared for it.
    listen_addresses: null

  # The product's command line, which is how the role asks the product about itself. Hardcoded
  # rather than read from Add/Remove Programs because the path cannot vary: the vendor stub
  # swallows INSTALLLOCATION, APPLICATIONFOLDER and /p without effect and returns 0 either way,
  # so every silent install lands here (measured 2026-08-18). Deriving it would suggest a
  # flexibility that does not exist.
  cli_path: 'C:\Program Files (x86)\Admin Arsenal\PDQ Deploy\PDQDeploy.exe'

  # The background service executable, which is what the firewall exception is written for. Same
  # fixed location as the command line above, and fixed for the same reason.
  service_path: 'C:\Program Files (x86)\Admin Arsenal\PDQ Deploy\PDQDeployService.exe'

  # Every preference the console shows, organised exactly as its Preferences window is: a map
  # of PAGES, each holding that page's settings under the labels the page uses. The reader tunes
  # what they can SEE; the role owns where each value actually lives -- most flow through the
  # product's own command line into its database, the four event-log severities are machine
  # registry values, and the alerts/interface pages are per-user, seeded into the Default profile
  # (and the connection account's own, where the product has never written) so consoles start as
  # declared. Values are the product's own measured defaults (ExportSettings, v20.1.8.0,
  # 2026-08-20) -- which, for the settings the vendor publishes guidance on, ARE its best
  # practices: automatic backups on, ten compressed backups kept, and 30-day deployment cleanup all
  # match PDQ's own recommendations. Settings the vendor gives no published guidance on stay at the
  # measured default rather than an invented preference. Declared in full so a vendor moving one
  # shows up as a reported change instead of silent drift. A playbook overrides keys; loader merges.
  #
  # Two locations follow a declared-or-derived rule: the database backup location and the
  # verbose audit log directory are null by default, meaning the role places them beside the
  # database on its dedicated drive; declaring a path overrides that. Not offered at all:
  # repository.path (derived from the share the role publishes, so folder, share and product
  # cannot disagree) and the five read-only audit-log names (spinner bounds and a fixed label --
  # FIND-18, dropped from the script's table entirely so declaring one fails as an unknown name).
  # The deployments page's Inventory scan profile is accepted but left undefaulted here: it names
  # an object inside PDQ Inventory that only the caller can know.
  preferences:
    alerts:
      auto_update_check_enabled: true
      show_webcast_alerts: true
      # null leaves the product's own channel; the value the console writes is Release or Beta.
      release_channel: null
    interface:
      color_theme: null
      disable_splash_screen: false
      show_dashboard_on_launch: true
      show_missing_package_popup_during_export: true
      include_dependency_packages_in_export: true
    auto_download:
      enable_auto_download: true
      approval: 'Delayed'
      automatic_approval_delay: '7.00:00:00'
      save_copies_of_previous_versions: false
      copies_to_keep: 5
    database:
      enable_automatic_backups: true
      backups_to_keep: 10
      compress_backups: true
      # null means: beside the database, on its dedicated drive (<drive>:\<directory>\Backups).
      # Declare a path only to send backups somewhere else.
      backup_location: null
    deployments:
      run_packages_as: 'Admin'
      timeout_minutes: 60
      cleanup_days: 30
      scan_after_deployment: true
      ping_before_deployment: false
      wake_on_lan: false
      retry_queue_enabled: false
      allowed_retries: 72
      retry_interval: '01:00:00'
    logging:
      # Off by deliberate choice -- data-egress hardening, NOT the product default (true) and not a
      # PDQ recommendation; this deployment minimises what leaves the host. (usage_data.collect is
      # already off by product default.)
      send_anonymous_exception_data: false
      record_error: true
      record_warning: true
      record_informational: true
      record_debug: false
      audit_keep_days: 30
      verbose_log_to_file: true
      # null means: beside the database, on its dedicated drive (<drive>:\<directory>\Logs) --
      # the same rule as the backup location, because logs grow like backups do. Declare a path
      # only to send them somewhere else.
      verbose_log_directory: null
      archive_log_every: 'Monday'
      archived_logs_to_keep: 4
      use_logging_configuration_file: false
      logging_configuration_file: ''
    mail_server:
      # null leaves the product's compiled choice; the console writes OAuth2 or MSGraphAPI when
      # those pages are picked, and the spelling it writes for basic auth is not yet measured.
      authentication_method: null
      smtp_server: ''
      enable_ssl: false
      smtp_user: ''
      sender_address: ''
      oauth2_client_id: ''
      oauth2_tenant_id: ''
      oauth2_redirect_uri: ''
      oauth2_provider: 'Microsoft'
      oauth2_sender: ''
      graph_client_id: ''
      graph_tenant_id: ''
      graph_cloud: 'Azure Public Cloud'
      graph_sender: ''
    performance:
      # Windows-wide client behaviour for remote service-manager connections, stored outside
      # the product (HKLM SCMApiConnectionParam; measured 2026-08-21: absent = Default,
      # high bit = Disabled, otherwise the timeout in milliseconds). The seconds value only
      # applies when the mode is Timeout.
      service_manager_tcp: 'Default'
      service_manager_tcp_timeout_seconds: 21
      concurrent_targets_per_deployment: 8
      total_concurrent_targets: 32
      copy_mode: 'Push'
      bandwidth_limit_percent: 50
      credential_batch_size: 200
      integration_message_timeout_seconds: 30
    printing:
      header_text: ''
      header_alignment: 'Center'
      footer_text: ''
      footer_alignment: 'Center'
      margin_left: 20
      margin_right: 20
      margin_top: 20
      margin_bottom: 20
      in_color: true
    proxy_server:
      use_system_proxy: true
      host_name: ''
      port: 8080
      username: ''
    repository:
      show_unused_files_warning: true
      cleanup_exclusions: ''
    spiceworks:
      host_name: ''
      port: 443
      use_ssl: true
      email: ''
      auto_sync_enabled: true
      sync_interval: '04:00:00'
    target_service:
      unc_path: >-
        ADMIN$\AdminArsenal
      local_path_of_shared_directory: ''
    usage_data:
      collect_usage_data: false
      alert_first_time_analytics_dialog: true

  #region ------ [ Installer layout ] -------------------------------------------------------- #

  # The application repository is laid out <vendor>/<application>/<version>/<file>, using the
  # product's real names -- so older builds stay addressable for rollback rather than being
  # overwritten in place. The literal token <version> is replaced with installer.version at fetch
  # time, which is why the playbook supplies only a version and a digest. A repository laid out
  # differently overrides this whole path, with or without the token.
  installer:
    path: 'PDQ.com/PDQ Deploy/<version>/PDQ_Deploy_x86-x64.exe'

  #endregion --- [ Installer layout ] -------------------------------------------------------- #

  #region ------ [ Background service user ] ------------------------------------------------- #

  # Deploy and Inventory are co-located and share ONE Background Service User, so the name is
  # product identity rather than a deployment choice. Where its password lives IS deployment
  # specific, so the bucket, object and digest come from the playbook.
  #
  # RENAMING does not retire the old account: present converges what is declared and removes
  # nothing, so the previous name survives as a member of Administrators (measured 2026-08-20).
  # Retirement is a removal, and removals belong to state=absent -- rename in two steps.
  service_account:
    name: 'svc-pdq'

  #endregion --- [ Background service user ] ------------------------------------------------- #

  # The product creates its database here the first time the service starts, so the role sets the
  # path before that happens and never has to stop, copy and restart. The DRIVE comes from the
  # playbook -- this role consumes a letter, it does not provision the disk. The folder is not
  # decoration: an ACL belongs on a directory, where it can be set without touching the volume
  # root and the permissions Windows grants there by default.
  database:
    directory: 'PDQ Deploy'

  # The repository holds the package files a deployment copies to its targets, so it is reached
  # over UNC rather than by local path: the vendor requires that for pull copy mode and for
  # Central Server, where several consoles read the same files. Shared from a folder rather than
  # the volume root for the same reason the database sits in one -- the share and its directory
  # can then be permissioned independently of the disk.
  #
  # RENAMING the share or moving either directory retires nothing: the old share stays published
  # and old data stays where it was (measured 2026-08-20, including a database the product simply
  # recreates empty at a new path). Renames and moves are two-step operations through
  # state=absent, never a silent side effect of present.
  repository:
    directory: 'PDQ Repository'
    share_name: 'AppRepo$'

  #endregion --- [ Product identity ] -------------------------------------------------------- #
