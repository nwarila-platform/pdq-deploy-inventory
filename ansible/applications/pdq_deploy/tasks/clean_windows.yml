# ============================================================================================= #
# File: '{{ role_path }}/tasks/clean_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Removes PDQ Deploy from a Windows host.
#
# BEGIN reads the machine, PROCESS removes the product, and END proves it is gone. END is
# deliberately ungated, so a host that was already clean proves the same state as one this run
# emptied.
#
# The ProductCode is READ FROM THE MACHINE rather than hardcoded. It changes with every release,
# so a pinned GUID stops matching after the next version bump and silently turns this path into a
# no-op. The same first-class PowerShell script the install path uses reports it, so both
# directions agree about what is installed and what removes it.
#
# The uninstall runs through the same module that installs the product, which owns MSI silencing
# itself. A hand-run uninstall command does not: PDQ publishes no QuietUninstallString, so
# executing its plain 'MsiExec /X {GUID}' waits on a dialog nobody is there to answer.
#
# The vendor documents that 'License' and 'Secure Key' SURVIVE an uninstall by design, while
# 'InstallDir' is removed. This path therefore removes the product and leaves the licence, which
# is the product's own behaviour — not a stricter one invented here.
#
# ============================================================================================= #
---

#region ------ [ Begin: Remove PDQ Deploy from Windows ] -------------------------------------- #

- name: 'BEGIN | Read The Machine And Decide One Action'
  vars:
    __arp__: "{{ pdq_deploy_running.arp }}"

  # Begin The 'Begin' Block
  block:

    #region ------ [ Begin: Find The Installed Product ] -------------------------------------- #
    # The same read the present path uses, against the same script, so the two directions cannot
    # disagree about what counts as installed. It reports the ProductCode PROCESS removes by.

    - name: 'BEGIN | Find The Installed Product And Its ProductCode'
      register: '__pdq_deploy_installed__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          DisplayName: "{{ __arp__.display_name }}"
          Version: "{{ pdq_deploy_running.installer.version }}"
        remote_src: false
        script: "{{ lookup('ansible.builtin.file', 'Get-InstalledSoftware.ps1') }}"

    #endregion --- [ Begin: Find The Installed Product ] -------------------------------------- #

#endregion --- [ Begin: Remove PDQ Deploy from Windows ] -------------------------------------- #


#region ------ [ Process: Remove PDQ Deploy from Windows ] ------------------------------------ #

- name: 'PROCESS | Remove PDQ Deploy'
  vars:
    __product_id__: >-
      {{ __pdq_deploy_installed__.result.entries
         | map(attribute='product_id') | select | first | default('') }}

  # Begin The 'Process' Block
  block:

    #region ------ [ Process: Remove The Product ] -------------------------------------------- #
    # Uninstalled through the same module that installs it, by the ProductCode the machine
    # reported. The module owns MSI silencing -- its documentation is explicit that /qn and
    # /norestart must NOT be passed for an MSI -- so the uninstall cannot stall on a dialog the
    # way a hand-run command string does.

    - name: 'PROCESS | Remove The Product'
      when: __product_id__ | length > 0

      ansible.windows.win_package:
        checksum_algorithm: 'sha256'
        expected_return_code: [ 0, 3010 ]
        follow_redirects: 'safe'
        force_basic_auth: false
        http_agent: 'ansible-httpget'
        maximum_redirection: 50
        product_id: "{{ __product_id__ }}"
        provider: 'auto'
        proxy_use_default_credential: false
        state: 'absent'
        url_timeout: 30
        use_default_credential: false
        use_proxy: true
        validate_certs: true
        verify_signature: false
        wait_for_children: false

    #endregion --- [ Process: Remove The Product ] -------------------------------------------- #

    #region ------ [ Process: Remove Any Staged Installer ] ----------------------------------- #

    - name: 'PROCESS | Remove Any Staged Installer Left On The Guest'
      ansible.windows.win_file:
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ pdq_deploy_running.install.staging_dir }}"
        state: 'absent'

    #endregion --- [ Process: Remove Any Staged Installer ] ----------------------------------- #

#endregion --- [ Process: Remove PDQ Deploy from Windows ] ------------------------------------ #


#region ------ [ End: Remove PDQ Deploy from Windows ] ---------------------------------------- #

- name: 'END | Prove The Product Is Gone'
  vars:
    __arp__: "{{ pdq_deploy_running.arp }}"

  # Begin The 'End' Block
  block:

    #region ------ [ End: Re-Read Add/Remove Programs ] --------------------------------------- #
    # Ungated, so a host that was already clean proves the same state as one this run emptied.
    # Same source of truth the present path uses, so the two directions cannot disagree.

    - name: 'END | Re-Read Add/Remove Programs'
      register: '__pdq_deploy_clean_arp__'

      ansible.windows.win_powershell:
        # 2 would stringify the objects inside 'entries'; 3 keeps their properties addressable.
        depth: 3
        error_action: 'stop'
        parameters:
          DisplayName: "{{ __arp__.display_name }}"
          Version: "{{ pdq_deploy_running.installer.version }}"
        remote_src: false
        script: "{{ lookup('ansible.builtin.file', 'Get-InstalledSoftware.ps1') }}"

    #endregion --- [ End: Re-Read Add/Remove Programs ] --------------------------------------- #

    #region ------ [ End: Assert The Product Is Absent ] -------------------------------------- #

    - name: 'END | Assert The Product Is Absent'
      vars:
        __still_present__: "{{ __pdq_deploy_clean_arp__.result }}"

      ansible.builtin.assert:
        fail_msg: >-
          '{{ __arp__.display_name }}' is still registered after the clean path ran
          ({{ __still_present__.entries | map(attribute='DisplayVersion') | list }}). The uninstall
          either did not run or did not complete.
        quiet: true
        that:
          - __still_present__.count == 0

    #endregion --- [ End: Assert The Product Is Absent ] -------------------------------------- #

#endregion --- [ End: Remove PDQ Deploy from Windows ] ---------------------------------------- #
