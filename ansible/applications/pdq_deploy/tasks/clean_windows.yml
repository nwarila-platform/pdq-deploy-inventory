# =========================================================================================== #
# File: '{{ role_path }}/tasks/clean_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Removes PDQ Deploy from a Windows host.
#
# The uninstall command is READ FROM THE MACHINE rather than hardcoded. The product's MSI
# ProductCode changes with every release, so a pinned GUID stops matching after the next version
# bump and silently turns this path into a no-op. Reading the ARP QuietUninstallString keeps the
# clean path correct across versions.
#
# The vendor documents that 'License' and 'Secure Key' SURVIVE an uninstall by design, while
# 'InstallDir' is removed. This path therefore removes the product and leaves the licence, which
# is the product's own behaviour — not a stricter one invented here.
#
# =========================================================================================== #
---
#region ------ [ Main ] ---------------------------------------------------------------------- #

- name: 'MAIN | Remove PDQ Deploy'
  vars:
    __arp__: "{{ pdq_deploy_running.arp }}"
    __arp_roots__: "{{ __arp__.uninstall_roots }}"

  block:

    - name: 'CLEAN | Find The Product Uninstall Command'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $roots = @({{ __arp_roots__ | map('regex_replace', '^(.*)$', "'\1'") | join(', ') }})
        $found = foreach ($root in $roots) {
          if (Test-Path -LiteralPath $root) {
            Get-ChildItem -LiteralPath $root |
              ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
              Where-Object { $_.DisplayName -eq {{ __arp__.display_name | quote }} }
          }
        }
        if (-not $found) { '' ; exit 0 }
        $entry = $found | Select-Object -First 1
        if ($entry.QuietUninstallString) { $entry.QuietUninstallString } else { $entry.UninstallString }
      register: '__pdq_deploy_uninstall_command__'
      changed_when: false

    - name: 'CLEAN | Remove The Product When An Uninstall Command Was Found'
      when: (__pdq_deploy_uninstall_command__.stdout | trim) | length > 0
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        & cmd.exe /c {{ (__pdq_deploy_uninstall_command__.stdout | trim) | quote }}
        exit $LASTEXITCODE
      register: '__pdq_deploy_uninstall_result__'
      changed_when: __pdq_deploy_uninstall_result__.rc == 0

    - name: 'CLEAN | Remove Any Staged Installer Left On The Guest'
      ansible.windows.win_file:
        path: "{{ pdq_deploy_running.install.staging_dir }}"
        state: 'absent'

    # Postcondition, outside the conditional removal above so it also runs on a host that was
    # already clean: the Add/Remove Programs entry must be gone. Same source of truth the present
    # path uses to decide the product is installed, so the two directions cannot disagree.
    - name: 'CLEAN | Re-Read Add/Remove Programs'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $roots = @({{ __arp_roots__ | map('regex_replace', '^(.*)$', "'\1'") | join(', ') }})
        $found = foreach ($root in $roots) {
          if (Test-Path -LiteralPath $root) {
            Get-ChildItem -LiteralPath $root |
              ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
              Where-Object { $_.DisplayName -eq {{ __arp__.display_name | quote }} }
          }
        }
        ConvertTo-Json -InputObject @(@($found) | ForEach-Object { [string]$_.DisplayVersion }) -Compress
      register: '__pdq_deploy_clean_arp__'
      changed_when: false

    - name: 'CLEAN | Assert The Product Is Absent'
      vars:
        __still_present__: "{{ __pdq_deploy_clean_arp__.stdout | trim | from_json }}"
      ansible.builtin.assert:
        that:
          - __still_present__ | length == 0
        fail_msg: >-
          '{{ __arp__.display_name }}' is still registered after the clean path ran
          ({{ __still_present__ }}). The uninstall command either did not run or did not complete.
        quiet: true

#endregion --- [ Main ] ---------------------------------------------------------------------- #
