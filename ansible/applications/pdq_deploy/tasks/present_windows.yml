# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Installs PDQ Deploy at the pinned version.
#
# BEGIN reads the machine and decides ONE action — install, upgrade, or none. Every later block
# is gated on that decision, so the state is read once and acted on once, and a converged host
# does no work at all.
#
# Everything moves through the runner: the controller fetches the installer and hands it to the
# target, so the guest never receives cloud credentials or any other reach into S3. The digest is
# verified on the guest, because that is the copy that executes.
#
# Install state keys on 'InstallDir', which the vendor removes at uninstall, paired with the
# console version. Not the MSI ProductCode, which changes every release.
#
# Licensing is a separate capability and a separate region.
#
# =========================================================================================== #
---
#region ------ [ Begin ] --------------------------------------------------------------------- #

# Add/Remove Programs is the source of truth for install state: it carries the version and the
# install location together, and Windows removes the entry on uninstall. The vendor's own product
# key survives with no install-path value, so it cannot answer "is this installed, and at what
# version".
- name: 'BEGIN | Read The Installed Product From Add/Remove Programs'
  vars:
    __arp__: "{{ pdq_deploy_running.arp }}"
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $roots = @({{ __arp__.uninstall_roots | map('regex_replace', '^(.*)$', "'\1'") | join(', ') }})
    $found = foreach ($root in $roots) {
      if (Test-Path -LiteralPath $root) {
        Get-ChildItem -LiteralPath $root |
          ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
          Where-Object { $_.DisplayName -eq {{ __arp__.display_name | quote }} }
      }
    }
    $entries = @($found | ForEach-Object {
      [pscustomobject]@{
        version  = [string]$_.DisplayVersion
        location = [string]$_.InstallLocation
      }
    })
    ConvertTo-Json -InputObject @($entries) -Depth 3 -Compress
  register: '__pdq_deploy_arp__'
  changed_when: false

- name: 'BEGIN | Refuse An Ambiguous Product State'
  vars:
    __entries__: "{{ __pdq_deploy_arp__.stdout | trim | from_json }}"
  ansible.builtin.assert:
    that:
      - __entries__ | length <= 1
    fail_msg: >-
      This machine carries {{ __entries__ | length }} entries named
      '{{ pdq_deploy_running.arp.display_name }}' in Add/Remove Programs
      ({{ __entries__ | map(attribute='version') | list }}). Two registrations of one product
      cannot both own the install, and choosing one would be a guess.
    quiet: true

#endregion --- [ Begin ] --------------------------------------------------------------------- #

#region ------ [ Main ] ---------------------------------------------------------------------- #

- name: 'MAIN | Install PDQ Deploy At The Pinned Version'
  vars:
    __install__: "{{ pdq_deploy_running.install }}"
    __installer_name__: "{{ pdq_deploy_running.installer.path | basename }}"
    __guest_installer__: "{{ __install__.staging_dir }}\\{{ __installer_name__ }}"
    __installed__: "{{ __pdq_deploy_arp__.stdout | trim | from_json }}"
    # One decision, made in BEGIN, gating everything below: absent, or older than the pin.
    __action_required__: >-
      {{ __installed__ | length == 0
         or (__installed__ | first).version | default('0.0.0.0')
            is version(pdq_deploy_running.installer.version, '<') }}

  block:

    - name: 'MAIN | Deliver And Install'
      when: __action_required__ | bool
      block:

        - name: 'MAIN | Create The Controller Staging Directory'
          delegate_to: 'localhost'
          ansible.builtin.tempfile:
            state: 'directory'
            prefix: 'pdq-deploy-'
          register: '__pdq_deploy_stage__'
          changed_when: false

        # The module probes the BUCKET before the object, and that probe is authorized by a
        # bucket-level grant this deployment deliberately does not hold: reading one pinned
        # prefix must not imply the right to see the bucket. Skipping the probe is the module's
        # documented answer for exactly that policy shape. A missing object still fails loudly —
        # the key check uses head_object, which the object-level grant does authorize.
        - name: 'MAIN | Fetch The Installer To The Controller'
          delegate_to: 'localhost'
          amazon.aws.s3_object:
            bucket: "{{ pdq_deploy_running.artifact_bucket }}"
            object: "{{ pdq_deploy_running.installer.path }}"
            dest: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"
            mode: 'get'
            overwrite: 'different'
            ignore_nonexistent_bucket: true

        - name: 'MAIN | Ensure The Guest Staging Directory Exists'
          ansible.windows.win_file:
            path: "{{ __install__.staging_dir }}"
            state: 'directory'

        - name: 'MAIN | Copy The Installer To The Guest'
          ansible.windows.win_copy:
            src: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"
            dest: "{{ __guest_installer__ }}"
          register: '__pdq_deploy_copied__'

        # A wrong silent switch can leave the installer waiting on a dialog rather than
        # returning, so the run is bounded and fails inside Ansible while cleanup can still run.
        - name: 'MAIN | Install Silently From The Verified Copy'
          ansible.windows.win_package:
            path: "{{ __guest_installer__ }}"
            arguments: "{{ __install__.silent_argument }}"
            checksum: "{{ pdq_deploy_running.installer.sha256 }}"
            checksum_algorithm: 'sha256'
            expected_return_code: "{{ __install__.success_exit_codes }}"
            state: 'present'
          async: "{{ __install__.timeout_seconds }}"
          poll: 15

    #region ------ [ Main: Postconditions ] ------------------------------------------------ #

    # Outside the action gate, so a converged host proves the same state as a freshly built one.
    - name: 'MAIN | Re-Read The Installed Product From Add/Remove Programs'
      vars:
        __arp__: "{{ pdq_deploy_running.arp }}"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $roots = @({{ __arp__.uninstall_roots | map('regex_replace', '^(.*)$', "'\1'") | join(', ') }})
        $found = foreach ($root in $roots) {
          if (Test-Path -LiteralPath $root) {
            Get-ChildItem -LiteralPath $root |
              ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
              Where-Object { $_.DisplayName -eq {{ __arp__.display_name | quote }} }
          }
        }
        $entries = @($found | ForEach-Object {
          [pscustomobject]@{
            version  = [string]$_.DisplayVersion
            location = [string]$_.InstallLocation
          }
        })
        ConvertTo-Json -InputObject @($entries) -Depth 3 -Compress
      register: '__pdq_deploy_final_arp__'
      changed_when: false

    # Only when the product is not registered as expected. A postcondition that fails without
    # saying what the machine actually looks like costs a whole deployment to learn one fact.
    # Costs nothing on a healthy converge.
    - name: 'MAIN | Gather Product Evidence When The Product Is Not Registered'
      vars:
        __final__: "{{ __pdq_deploy_final_arp__.stdout | trim | from_json }}"
      when: __final__ | length != 1
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        'REGISTRY KEYS AND THEIR VALUES:'
        foreach ($root in 'HKLM:\SOFTWARE', 'HKLM:\SOFTWARE\Wow6432Node') {
          Get-ChildItem -LiteralPath $root |
            Where-Object { $_.PSChildName -match 'PDQ|Admin Arsenal' } |
            ForEach-Object {
              $_.Name
              Get-ChildItem -LiteralPath $_.PSPath -Recurse -Depth 1 | ForEach-Object {
                '  ' + $_.Name
                $props = Get-ItemProperty -LiteralPath $_.PSPath
                $props.PSObject.Properties |
                  Where-Object { $_.Name -notmatch '^PS' } |
                  ForEach-Object { '      ' + $_.Name + ' = ' + $_.Value }
              }
            }
        }
        'SERVICES:'
        Get-Service | Where-Object { $_.Name -match 'PDQ' } |
          ForEach-Object { '  ' + $_.Name + ' = ' + $_.Status }
        'INSTALLED PROGRAMS:'
        foreach ($u in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                       'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
          Get-ChildItem -LiteralPath $u |
            ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
            Where-Object { $_.DisplayName -match 'PDQ' } |
            ForEach-Object { '  ' + $_.DisplayName + ' | ver ' + $_.DisplayVersion + ' | at ' + $_.InstallLocation }
        }
      register: '__pdq_deploy_evidence__'
      changed_when: false

    - name: 'MAIN | Assert The Product Is Registered Exactly Once At Or Above The Pin'
      vars:
        __final__: "{{ __pdq_deploy_final_arp__.stdout | trim | from_json }}"
      ansible.builtin.assert:
        that:
          - __final__ | length == 1
          - not ((__final__ | first).version | default('0.0.0.0')
                 is version(pdq_deploy_running.installer.version, '<'))
        fail_msg: >-
          Expected exactly one '{{ pdq_deploy_running.arp.display_name }}' registered at
          {{ pdq_deploy_running.installer.version }} or above; found {{ __final__ | length }}
          entries {{ __final__ | map(attribute='version') | list }}. Zero means the installer
          reported success without registering the product.
          {{ __pdq_deploy_evidence__.stdout | default('') }}
        quiet: true

    - name: 'MAIN | Assert The Background Service Exists'
      ansible.windows.win_service_info:
        name: "{{ pdq_deploy_running.service_name }}"
      register: '__pdq_deploy_service__'
      changed_when: false
      failed_when: (__pdq_deploy_service__.services | default([]) | length) != 1

    #endregion --- [ Main: Postconditions ] ------------------------------------------------ #

  always:

    # Gated on the copy having been attempted, so a run that never staged deletes nothing while a
    # partial copy is still cleaned up.
    - name: 'CLEANUP | Remove The Staged Installer From The Guest'
      when: __pdq_deploy_copied__ is defined and not (__pdq_deploy_copied__ is skipped)
      ansible.windows.win_file:
        path: "{{ __install__.staging_dir }}"
        state: 'absent'

    - name: 'CLEANUP | Remove The Controller Staging Directory'
      when: __pdq_deploy_stage__ is defined and not (__pdq_deploy_stage__ is skipped)
      delegate_to: 'localhost'
      ansible.builtin.file:
        path: "{{ __pdq_deploy_stage__.path }}"
        state: 'absent'
      changed_when: false

#endregion --- [ Main ] ---------------------------------------------------------------------- #
