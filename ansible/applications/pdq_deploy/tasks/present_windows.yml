# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Installs PDQ Deploy at the pinned version.
#
# BEGIN reads the machine and decides ONE action — install, upgrade, or none. PROCESS acts on that
# decision, and END proves the result and cleans up. Every PROCESS task carries the decision
# individually rather than the stage carrying it once, so a run always lists the same steps in the
# same order: a converged host reads as a column of skips, not a stage that vanished.
#
# END is deliberately ungated, so a converged host proves the same state as a freshly built one.
#
# Install state comes from Add/Remove Programs, read by a first-class PowerShell script rather than
# an inline block: the guest-side logic is developed and Pester-tested once under scripts/, and the
# role executes a materialized copy. ARP carries the version and the install location together and
# Windows removes the entry on uninstall, which the vendor's own product key cannot answer because
# it survives uninstall. Not the MSI ProductCode, which changes every release.
#
# Everything moves through the runner: the controller fetches the installer and hands it to the
# target, so the guest never receives cloud credentials or any other reach into S3. The digest is
# verified on the guest, because that is the copy that executes.
#
# Return code 3010 is a success: it means the product installed and wants a restart. The role
# restarts when the installer asks for one, and only then.
#
# Cleanup lives under END's 'always', which means it does NOT run after an unrescued PROCESS
# failure. That is the accepted trade of the three-stage shape: the residue is a controller temp
# directory and an installer on the guest, and the proof bed is rebuilt for every run.
#
# Licensing is a separate capability and a separate region.
#
# ============================================================================================= #
---
#region ------ [ Begin: Install PDQ Deploy on Windows ] --------------------------------------- #

- name: 'BEGIN | Read The Machine And Decide One Action'

  # Begin The 'Begin' Block
  block:

    #region ------ [ Begin: Read The Installed Product ] -------------------------------------- #
    # Add/Remove Programs is the source of truth for install state: it carries the version and
    # the install location together, and Windows removes the entry on uninstall. The vendor's own
    # product key survives with no install-path value, so it cannot answer "is this installed,
    # and at what version". Parameters cross as typed module options, never Jinja spliced into
    # the script source, which is what keeps the injection surface at zero. No changed_when: the
    # script's $Ansible.Changed is the change report, and a read never changes anything. The
    # referenced .ps1 is MATERIALIZED from scripts/ by scripts/materialize-role-scripts.sh (the
    # role tracks only files/Get-InstalledSoftware.ps1.stub); run it before this role.

    - name: 'BEGIN | Read The Installed Product From Add/Remove Programs'
      register: '__pdq_deploy_arp__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          DisplayName: "{{ pdq_deploy_running.arp.display_name }}"
          Version: "{{ pdq_deploy_running.installer.version }}"
        remote_src: false
        script: "{{ lookup('ansible.builtin.file', 'Get-InstalledSoftware.ps1') }}"

    #endregion --- [ Begin: Read The Installed Product ] -------------------------------------- #

#endregion --- [ Begin: Install PDQ Deploy on Windows ] --------------------------------------- #


#region ------ [ Process: Install PDQ Deploy on Windows ] ------------------------------------- #

- name: 'PROCESS | Install And Licence PDQ Deploy At The Pinned Version'
  vars:
    __installer_name__: "{{ pdq_deploy_running.installer.path | basename }}"
    __guest_installer__: "{{ pdq_deploy_running.install.staging_dir }}\\{{ __installer_name__ }}"
    __action_required__: "{{ __pdq_deploy_arp__.result.action_required }}"
    __repository_dir__: >-
      {{ pdq_deploy_running.repository.drive }}:\{{ pdq_deploy_running.repository.directory }}

  # Begin The 'Process' Block
  block:

    #region ------ [ Process: Fetch The Service Account Password ] ---------------------------- #
    # Pulled as a STRING and never written to disk on either machine, exactly like the licence.
    # The object holds the password with no trailing newline, so it is used verbatim; the digest
    # pins that byte-for-byte, and a re-upload that adds whitespace fails the next task loudly.

    - name: 'PROCESS | Fetch The Service Account Password'
      delegate_to: 'localhost'
      no_log: true
      register: '__pdq_deploy_secret__'

      amazon.aws.s3_object:
        bucket: "{{ pdq_deploy_running.service_account.bucket }}"
        ceph: false
        debug_botocore_endpoint_logs: false
        dualstack: false
        encrypt: true
        encryption_mode: 'AES256'
        expiry: 600
        ignore_nonexistent_bucket: true
        mode: 'getstr'
        object: "{{ pdq_deploy_running.service_account.object }}"
        overwrite: 'different'
        permission: [ 'private' ]
        prefix: ''
        purge_tags: true
        retries: 0
        sig_v4: true
        validate_bucket_name: true
        validate_certs: true

    #endregion --- [ Process: Fetch The Service Account Password ] ---------------------------- #

    #region ------ [ Process: Verify The Service Account Password Digest ] -------------------- #
    # Same contract the installer and licence get: an object is trusted only once it matches the
    # digest pinned in the playbook. Deliberately NOT no_log -- assert reports the expression text
    # and our message, never the value, so a mismatch stays diagnosable without exposing a secret.

    - name: 'PROCESS | Verify The Service Account Password Digest'
      ansible.builtin.assert:
        fail_msg: >-
          The service account password object
          '{{ pdq_deploy_running.service_account.object }}' does not match the sha256 pinned in
          the playbook. Refusing to create an account from an unverified secret.
        quiet: true
        that: [ __pdq_deploy_secret__.contents | hash('sha256') == pdq_deploy_running.service_account.sha256 ]

    #endregion --- [ Process: Verify The Service Account Password Digest ] -------------------- #

    #region ------ [ Process: Ensure The Background Service User ] ---------------------------- #
    # One Background Service User is shared by Deploy and Inventory, so this role ensures it
    # rather than owning it. Membership is enforced EXACTLY: replace adds every listed group and
    # removes the account from all others, so a membership widened by hand is pulled back to the
    # single group the vendor requires instead of persisting unnoticed. Both roles name the same
    # one group, so neither strips the other's work. update_password on_create means an existing
    # account keeps its password and the task stays idempotent instead of resetting it every
    # converge.

    - name: 'PROCESS | Ensure The Background Service User'
      no_log: true

      ansible.windows.win_user:
        groups: [ 'Administrators' ]
        groups_action: 'replace'
        name: "{{ pdq_deploy_running.service_account.name }}"
        password: "{{ __pdq_deploy_secret__.contents }}"
        password_never_expires: false
        state: 'present'
        update_password: 'on_create'
        user_cannot_change_password: false

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Enforce The Service Account Password'
      changed_when: false
      no_log: true

      ansible.windows.win_user:
        groups_action: 'replace'
        name: "{{ pdq_deploy_running.service_account.name }}"
        password: "{{ __pdq_deploy_secret__.contents }}"
        state: 'present'
        update_password: 'always'

    #endregion --- [ Process: Ensure The Background Service User ] ---------------------------- #

    #region ------ [ Process: Grant Log On As A Service ] ------------------------------------- #
    # A service account that cannot log on as a service fails at service start with an error that
    # names neither the right nor the account. action adds rather than sets, so other holders of
    # the right keep it.

    - name: 'PROCESS | Grant Log On As A Service'
      ansible.windows.win_user_right:
        action: 'add'
        name: 'SeServiceLogonRight'
        users: [ ".\\{{ pdq_deploy_running.service_account.name }}" ]

    #endregion --- [ Process: Grant Log On As A Service ] ------------------------------------- #

    #region ------ [ Process: Deny Interactive Logon To The Service Account ] ----------------- #
    # STIG: a service account must not be usable to sign in at the console. Denying the right
    # outright beats relying on nobody knowing the password, and a service logon is unaffected
    # because it is a different right. action adds, so other denied principals keep their entry.

    - name: 'PROCESS | Deny Interactive Logon To The Service Account'
      ansible.windows.win_user_right:
        action: 'add'
        name: 'SeDenyInteractiveLogonRight'
        users: [ ".\\{{ pdq_deploy_running.service_account.name }}" ]

    #endregion --- [ Process: Deny Interactive Logon To The Service Account ] ----------------- #

    #region ------ [ Process: Deny Remote Interactive Logon To The Service Account ] ---------- #
    # The same rule for the remote desktop path, which is a separate right: denying console logon
    # alone would still leave the account able to sign in over RDP.

    - name: 'PROCESS | Deny Remote Interactive Logon To The Service Account'
      ansible.windows.win_user_right:
        action: 'add'
        name: 'SeDenyRemoteInteractiveLogonRight'
        users: [ ".\\{{ pdq_deploy_running.service_account.name }}" ]

    #endregion --- [ Process: Deny Remote Interactive Logon To The Service Account ] ---------- #

    #region ------ [ Process: Create The Controller Staging Directory ] ----------------------- #

    - name: 'PROCESS | Create The Controller Staging Directory'
      changed_when: false
      delegate_to: 'localhost'
      register: '__pdq_deploy_stage__'
      when: __action_required__ | bool

      ansible.builtin.tempfile:
        path: '/tmp'
        prefix: 'pdq-deploy-'
        state: 'directory'
        suffix: ''

    #endregion --- [ Process: Create The Controller Staging Directory ] ----------------------- #

    #region ------ [ Process: Fetch The Installer To The Controller ] ------------------------- #
    # The module probes the BUCKET before the object, and that probe is authorized by a bucket-
    # level grant this deployment deliberately does not hold: reading one pinned prefix must not
    # imply the right to see the bucket. Skipping the probe is the module's documented answer for
    # exactly that policy shape. A missing object still fails loudly — the key check uses
    # head_object, which the object-level grant does authorize.

    - name: 'PROCESS | Fetch The Installer To The Controller'
      delegate_to: 'localhost'
      vars:
        __installer_key__: >-
          {{ pdq_deploy_running.installer.path
             | replace('<version>', pdq_deploy_running.installer.version) }}
      when: __action_required__ | bool

      amazon.aws.s3_object:
        bucket: "{{ pdq_deploy_running.installer.bucket }}"
        ceph: false
        debug_botocore_endpoint_logs: false
        dest: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"
        dualstack: false
        encrypt: true
        encryption_mode: 'AES256'
        expiry: 600
        ignore_nonexistent_bucket: true
        mode: 'get'
        object: "{{ __installer_key__ }}"
        overwrite: 'different'
        permission: [ 'private' ]
        prefix: ''
        purge_tags: true
        retries: 0
        sig_v4: true
        validate_bucket_name: true
        validate_certs: true

    #endregion --- [ Process: Fetch The Installer To The Controller ] ------------------------- #

    #region ------ [ Process: Ensure The Guest Staging Directory Exists ] --------------------- #
    # Everything moves through the runner: the controller holds the S3 credentials and hands the
    # file to the guest, so the guest never receives any reach into S3.

    - name: 'PROCESS | Ensure The Guest Staging Directory Exists'
      when: __action_required__ | bool

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ pdq_deploy_running.install.staging_dir }}"
        state: 'directory'

    #endregion --- [ Process: Ensure The Guest Staging Directory Exists ] --------------------- #

    #region ------ [ Process: Copy The Installer To The Guest ] ------------------------------- #
    # remote_src stays false because the source is the controller copy fetched above, and force
    # stays true so a partial or stale staged file is replaced rather than trusted.

    - name: 'PROCESS | Copy The Installer To The Guest'
      register: '__pdq_deploy_copied__'
      when: __action_required__ | bool

      ansible.windows.win_copy:
        backup: false
        decrypt: true
        dest: "{{ __guest_installer__ }}"
        force: true
        local_follow: true
        remote_src: false
        src: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"

    #endregion --- [ Process: Copy The Installer To The Guest ] ------------------------------- #

    #region ------ [ Process: Install Silently From The Verified Copy ] ----------------------- #
    # The vendor's silent switch and success code are properties of this binary, not operator
    # choices, so they live beside the package invocation. The digest is verified on the guest,
    # because that is the copy that executes. A wrong silent switch can leave the installer
    # waiting on a dialog rather than returning, so the run is bounded and fails inside Ansible.
    # 3010 is accepted alongside 0 because it is not a failure: it means the product installed
    # and wants a restart to finalise. The module turns that exact code into reboot_required,
    # which the next region acts on, so the install is only reported complete once the machine is
    # in the state the installer asked for.

    - name: 'PROCESS | Install Silently From The Verified Copy'
      async: "{{ pdq_deploy_running.install.timeout_seconds }}"
      poll: 15
      register: '__pdq_deploy_installed__'
      when: __action_required__ | bool

      ansible.windows.win_package:
        arguments: '/s'
        checksum_algorithm: 'sha256'
        checksum: "{{ pdq_deploy_running.installer.sha256 }}"
        expected_return_code: [ 0, 3010 ]
        follow_redirects: 'safe'
        force_basic_auth: false
        http_agent: 'ansible-httpget'
        maximum_redirection: 50
        path: "{{ __guest_installer__ }}"
        provider: 'auto'
        proxy_use_default_credential: false
        state: 'present'
        url_timeout: 30
        use_default_credential: false
        use_proxy: true
        validate_certs: true
        verify_signature: false
        wait_for_children: false

    #endregion --- [ Process: Install Silently From The Verified Copy ] ----------------------- #

    #region ------ [ Process: Reboot When The Installer Requires It ] ------------------------- #
    # reboot_required is set by the module for return code 3010 and nothing else, so this acts
    # on the installer's own request rather than on a guess. It is the only condition needed: a
    # run that never installed leaves no reboot_required to be true.

    - name: 'PROCESS | Reboot When The Installer Requires It'
      when: __pdq_deploy_installed__.reboot_required | default(false) | bool

      ansible.windows.win_reboot:
        boot_time_command: >-
          (Get-CimInstance -ClassName Win32_OperatingSystem -Property
          LastBootUpTime).LastBootUpTime.ToFileTime()
        connect_timeout: 5
        msg: 'Restarting to finalise the PDQ Deploy installation.'
        post_reboot_delay: 0
        pre_reboot_delay: 2
        reboot_timeout: 600

    #endregion --- [ Process: Reboot When The Installer Requires It ] ------------------------- #

    #region ------ [ Process: Fetch The Product Licence ] ------------------------------------- #
    # The licence is secret material, so it is pulled as a STRING and never written to disk on
    # either machine: getstr hands the content straight to the next task. no_log covers the
    # task because the value is the secret itself, not merely a parameter that touches one.

    - name: 'PROCESS | Fetch The Product Licence'
      delegate_to: 'localhost'
      no_log: true
      register: '__pdq_deploy_license__'

      amazon.aws.s3_object:
        bucket: "{{ pdq_deploy_running.license.bucket }}"
        ceph: false
        debug_botocore_endpoint_logs: false
        dualstack: false
        encrypt: true
        encryption_mode: 'AES256'
        expiry: 600
        ignore_nonexistent_bucket: true
        mode: 'getstr'
        object: "{{ pdq_deploy_running.license.object }}"
        overwrite: 'different'
        permission: [ 'private' ]
        prefix: ''
        purge_tags: true
        retries: 0
        sig_v4: true
        validate_bucket_name: true
        validate_certs: true

    #endregion --- [ Process: Fetch The Product Licence ] ------------------------------------- #

    #region ------ [ Process: Verify The Licence Digest ] ------------------------------------- #
    # The same contract the installer gets: an object is trusted only after it matches a digest
    # pinned in the playbook, so a replaced or truncated licence stops the deployment instead
    # of reaching the registry. Verified at the point of USE -- this is the content the next task
    # writes. Deliberately NOT no_log: assert reports the expression text and our message, never
    # the evaluated value, so the failure stays readable without exposing the licence.

    - name: 'PROCESS | Verify The Licence Digest'
      ansible.builtin.assert:
        fail_msg: >-
          The licence object '{{ pdq_deploy_running.license.object }}' does not match the sha256
          pinned in the playbook. Refusing to write an unverified licence to the registry: the
          object in the bucket has changed, or the pin is stale.
        quiet: true
        that: [ __pdq_deploy_license__.contents | hash('sha256') == pdq_deploy_running.license.sha256 ]

    #endregion --- [ Process: Verify The Licence Digest ] ------------------------------------- #

    #region ------ [ Process: Apply The Product Licence ] ------------------------------------- #
    # The product accepts the marker block and nothing else: the object carries trailing lines past
    # the end marker and LF endings, and written verbatim it leaves the console in Free mode --
    # measured on a converged host 2026-08-18. The slice keeps both markers because the vendor
    # requires them, and the two replacements normalise every ending to CRLF whatever the object
    # used. No guard on an empty match is needed, because the digest above pins the exact bytes.
    #
    # The product REWRITES what it is given: measured 2026-08-18, a 17-line CRLF block came back
    # as one 620-character line with every break stripped, the same characters in a different
    # shape. Comparing literally would therefore report a change on every converge and bounce the
    # service with it, so the comparison ignores whitespace and asks only whether the licence
    # itself differs. A licence removed or replaced by hand is still restored.

    - name: 'PROCESS | Read The Licence Already Stored'
      no_log: true
      register: '__pdq_deploy_license_current__'

      ansible.windows.win_reg_stat:
        name: 'License'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Apply The Product Licence'
      no_log: true
      register: '__pdq_deploy_license_applied__'
      when: >-
        __pdq_deploy_license_current__.value | default('') | regex_replace('\s', '')
        != __licence__ | regex_replace('\s', '')
      vars:
        __licence__: >-
          {{ __pdq_deploy_license__.contents
             | regex_search('--- START LICENSE ---[\s\S]*--- END LICENSE ---')
             | regex_replace('\r\n', '\n')
             | regex_replace('\n', '\r\n') }}

      ansible.windows.win_regedit:
        data: "{{ __licence__ }}"
        delete_key: true
        name: 'License'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy'
        state: 'present'
        type: 'string'

    #endregion --- [ Process: Apply The Product Licence ] ------------------------------------- #

    #region ------ [ Process: Place The Database On The Dedicated Drive ] --------------------- #
    # The database is the one part of this product that grows without bound, so it lives on the
    # drive provisioned for it rather than on the system volume. Set BEFORE the service is first
    # started, which is why this sits above the service region: the product creates the database
    # wherever this points on that first start, so there is nothing to stop, copy and restart.
    # A host whose database already exists elsewhere is not migrated by this -- it would be left
    # behind, and moving it is a different job from building a server. It goes in a FOLDER on that
    # drive rather than at the root, because an ACL set on a directory can be tightened without
    # disturbing the permissions Windows grants on a volume root.

    - name: 'PROCESS | Create The Database Directory On The Dedicated Drive'
      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: >-
          {{ pdq_deploy_running.database.drive }}:\{{ pdq_deploy_running.database.directory }}
        state: 'directory'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Point The Product At The Database On The Dedicated Drive'
      register: '__pdq_deploy_database__'
      vars:
        __database_file__: >-
          {{ pdq_deploy_running.database.drive }}:\{{ pdq_deploy_running.database.directory
             }}\Database.db

      ansible.windows.win_regedit:
        data: "{{ __database_file__ }}"
        delete_key: true
        name: 'FileName'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Settings\Database'
        state: 'present'
        type: 'string'

    #endregion --- [ Process: Place The Database On The Dedicated Drive ] --------------------- #

    #region ------ [ Process: Prepare The Repository Directory ] ------------------------------ #
    # The directory is created and locked down BEFORE it is published: a share that exists
    # ahead of its ACL is readable by whoever the volume root lets in, for as long as the gap
    # lasts. Inheritance is broken first and the inherited entries discarded rather than copied,
    # because they come from that root -- copying them would preserve underneath every rule set
    # here exactly what breaking inheritance is meant to remove. Users get read and write since
    # administrators curate packages by hand; Administrators and SYSTEM keep full control so the
    # directory stays manageable and backupable. The service account is named nowhere: it is an
    # Administrator by vendor requirement, and repeating that would be a second place to
    # maintain one fact.

    - name: 'PROCESS | Create The Repository Directory On Its Dedicated Drive'
      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ __repository_dir__ }}"
        state: 'directory'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Break Inherited Permissions On The Repository Directory'
      ansible.windows.win_acl_inheritance:
        path: "{{ __repository_dir__ }}"
        reorganize: false
        state: 'absent'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Grant Read And Write On The Repository Directory'
      ansible.windows.win_acl:
        follow: false
        inherit: 'ContainerInherit, ObjectInherit'
        path: "{{ __repository_dir__ }}"
        propagation: 'None'
        rights: 'Modify'
        state: 'present'
        type: 'allow'
        user: 'BUILTIN\Users'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Grant Full Control To Administrators On The Repository Directory'
      ansible.windows.win_acl:
        follow: false
        inherit: 'ContainerInherit, ObjectInherit'
        path: "{{ __repository_dir__ }}"
        propagation: 'None'
        rights: 'FullControl'
        state: 'present'
        type: 'allow'
        user: 'BUILTIN\Administrators'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Grant Full Control To The System Account On The Repository Directory'
      ansible.windows.win_acl:
        follow: false
        inherit: 'ContainerInherit, ObjectInherit'
        path: "{{ __repository_dir__ }}"
        propagation: 'None'
        rights: 'FullControl'
        state: 'present'
        type: 'allow'
        user: 'NT AUTHORITY\SYSTEM'

    #endregion --- [ Process: Prepare The Repository Directory ] ------------------------------ #

    #region ------ [ Process: Share The Repository Over The Network ] ------------------------- #
    # Published only once the directory beneath it is permissioned. The share is READ ONLY, to
    # everyone: targets in pull copy mode fetch package files over it themselves, so read is the
    # whole job, and Windows applies the more restrictive of share and NTFS -- making this the
    # binding gate whoever the caller turns out to be. Writing happens locally against the
    # directory, never across the wire. rule_action is 'set' so the list is exactly what is
    # named here; an access another run granted is removed rather than accumulating.

    - name: 'PROCESS | Share The Repository Over The Network'
      ansible.windows.win_share:
        caching_mode: 'Manual'
        description: 'PDQ Deploy package repository'
        encrypt: false
        list: false
        name: "{{ pdq_deploy_running.repository.share_name }}"
        path: "{{ __repository_dir__ }}"
        read: 'Everyone'
        rule_action: 'set'
        state: 'present'

    #endregion --- [ Process: Share The Repository Over The Network ] ------------------------- #


    #region ------ [ Process: Put The Console In Central Server Mode ] ------------------------ #
    # PDQ Deploy and PDQ Inventory integrate only co-located and in the same operating mode, so
    # an all-in-one Central Server is an invariant of this repository rather than a value to
    # offer -- the mode is written literally, because an input here would be a knob that must
    # never be turned. A silent install leaves it Local, which is why a console opened on an
    # otherwise converged host still walks the Initialize wizard. Written before the service
    # region because the product reads its protocol at start, and registered so the restart
    # below picks a change up. Read back from a host configured by that wizard, 2026-08-18.

    - name: 'PROCESS | Put The Console In Central Server Mode'
      register: '__pdq_deploy_mode__'

      ansible.windows.win_regedit:
        data: 'Server'
        delete_key: true
        name: 'Mode'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'string'

    #endregion --- [ Process: Put The Console In Central Server Mode ] ------------------------ #

    #region ------ [ Process: Set The Central Server Port ] ----------------------------------- #
    # The port client consoles connect to. 6336 is the product's own default, measured; the
    # 7337 recorded in this repository's older notes is wrong. Deliberately NOT written beside
    # it: LocalTcpPort, which the product assigns per host from the dynamic range, and
    # ServicePrincipalName, which the wizard leaves as 'PDQDeploy/' with nothing after it and
    # whose contract is not understood -- pinning a value we cannot explain is worse than
    # leaving the product's own.

    - name: 'PROCESS | Set The Central Server Port'
      register: '__pdq_deploy_port__'

      ansible.windows.win_regedit:
        data: "{{ pdq_deploy_running.server.port }}"
        delete_key: true
        name: 'ServerPort'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'dword'

    #endregion --- [ Process: Set The Central Server Port ] ----------------------------------- #

    #region ------ [ Process: Choose The Addresses The Server Answers On ] -------------------- #
    # Two halves of one decision, so they live together: name no addresses and the server
    # answers on all of them, name some and it answers only there. A server bound to one
    # address stops answering when that address changes, and this host's is assigned at launch,
    # so every-address is the default. The flag is written on BOTH paths rather than only the
    # first -- left at 1 it would outrank a named list, and a host moved from all-addresses to
    # a list would keep answering everywhere while appearing not to.

    - name: 'PROCESS | Answer Consoles On Every Address Unless Addresses Are Named'
      register: '__pdq_deploy_listen__'

      ansible.windows.win_regedit:
        data: >-
          {{ 0 if pdq_deploy_running.server.listen_addresses | default([], true) | length > 0
             else 1 }}
        delete_key: true
        name: 'ServerListenAllAddresses'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'dword'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Answer Consoles On The Named Addresses'
      register: '__pdq_deploy_listen_addresses__'
      when: pdq_deploy_running.server.listen_addresses | default([], true) | length > 0

      ansible.windows.win_regedit:
        data: "{{ pdq_deploy_running.server.listen_addresses }}"
        delete_key: true
        name: 'ServerListenAddresses'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'multistring'

    #endregion --- [ Process: Choose The Addresses The Server Answers On ] -------------------- #

    #region ------ [ Process: Enable Role-Based Access Control ] ------------------------------ #
    # Role-Based Access Control decides whether console users are authorised individually or
    # simply by being administrators. Written from an input rather than fixed, because a
    # deployment that has not yet modelled roles needs it off, and turning it on before then
    # authorises nobody for anything. Lives at the product root rather than under Protocol, and
    # is read at service start like the rest, so a change joins the restart below. The input is a
    # boolean and the stored value a dword, so the filter is the whole translation between them.

    - name: 'PROCESS | Enable Role-Based Access Control'
      register: '__pdq_deploy_rbac__'

      ansible.windows.win_regedit:
        data: "{{ pdq_deploy_running.rbac_enabled | int }}"
        delete_key: true
        name: 'RBAC Enabled'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy'
        state: 'present'
        type: 'dword'

    #endregion --- [ Process: Enable Role-Based Access Control ] ------------------------------ #

    #region ------ [ Process: Open The Firewall For Client Consoles ] ------------------------- #
    # Opening the port on the cloud side reaches the host and stops there: Windows Firewall is
    # on for every profile on this image, so without this rule the service listens and nothing
    # arrives. Scoped BOTH ways, as the product's own wizard scopes it -- to the service
    # executable and to the port -- so the exception admits that one program on that one port
    # rather than opening the port to whatever else may bind it later. The wizard names its
    # rule by GUID and shows 'PDQ Deploy'; this names it directly, which is also what makes it
    # idempotent and removable.

    - name: 'PROCESS | Open The Firewall For Client Consoles'
      community.windows.win_firewall_rule:
        action: 'allow'
        description: 'Inbound access to the PDQ Deploy background service for client consoles'
        direction: 'in'
        enabled: true
        localport: "{{ pdq_deploy_running.server.port }}"
        name: 'PDQ Deploy'
        profiles: [ 'domain', 'private', 'public' ]
        program: "{{ pdq_deploy_running.service_path }}"
        protocol: 'tcp'
        state: 'present'

    #endregion --- [ Process: Open The Firewall For Client Consoles ] ------------------------- #

    #region ------ [ Process: Run The Background Service As The Service Account ] ------------- #
    # The product is installed and licensed by this point, so the service it registered exists
    # and can be pointed at the account the previous regions built. The vendor requires an
    # administrator on the console machine and the SeServiceLogonRight, both of which are already
    # in place. A local account carries the '.\' prefix -- the same convention the product's own
    # console uses when the domain field is left blank. The silent installer leaves the service
    # DISABLED and never started -- observed on a converged host 2026-08-18 -- so the start mode
    # and running state are set here as well, or nothing downstream can restart it and the
    # product never reaches a working state. update_password is on_create so a settled
    # host reports ok rather than rewriting the credential every converge; the module sets the
    # password regardless whenever the account itself changes, so the first converge is complete.

    - name: 'PROCESS | Run The Background Service As The Service Account'
      no_log: true
      register: '__pdq_deploy_identity__'

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: false
        name: "{{ pdq_deploy_running.service_name }}"
        password: "{{ __pdq_deploy_secret__.contents }}"
        start_mode: 'auto'
        state: 'started'
        update_password: 'on_create'
        username: ".\\{{ pdq_deploy_running.service_account.name }}"

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Enforce The Background Service Credential'
      changed_when: false
      no_log: true

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: false
        name: "{{ pdq_deploy_running.service_name }}"
        password: "{{ __pdq_deploy_secret__.contents }}"
        update_password: 'always'
        username: ".\\{{ pdq_deploy_running.service_account.name }}"

    #endregion --- [ Process: Run The Background Service As The Service Account ] ------------- #

    #region ------ [ Process: Restart The Background Service ] -------------------------------- #
    # Both of the previous regions are inert until this bounce: Windows applies a new logon
    # account only at next start, and the product reads its licence from the registry when the
    # service starts. Gated rather than unconditional because 'restarted' always bounces, and
    # this is a deployment server -- restarting it on every converge would drop whatever was in
    # flight. The credential enforcement above cannot trigger it, since changed_when false means
    # it never reports changed; that is right, because a rotated password only takes effect at
    # the next start anyway.

    - name: 'PROCESS | Restart The Background Service'
      when: >-
        __pdq_deploy_identity__ is changed or __pdq_deploy_license_applied__ is changed
        or __pdq_deploy_database__ is changed or __pdq_deploy_mode__ is changed
        or __pdq_deploy_port__ is changed or __pdq_deploy_listen__ is changed
        or __pdq_deploy_listen_addresses__ is changed or __pdq_deploy_rbac__ is changed

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: false
        name: "{{ pdq_deploy_running.service_name }}"
        state: 'restarted'

    #endregion --- [ Process: Restart The Background Service ] -------------------------------- #

    #region ------ [ Process: Apply The Declared Product Settings ] --------------------------- #
    # The product answers its own command line only for the account its service runs as: an
    # administrator and even SYSTEM are refused, because authorisation is a list of console
    # users and a fresh install has none. Measured 2026-08-18. So every setting is applied AS
    # the background service user, which needs no seeding because the product already trusts
    # it. The credential crosses as a become secret rather than on the command line, which the
    # vendor warns is visible in process listings.
    #
    # logon_type=batch is not decoration: become defaults to an INTERACTIVE logon, and this role
    # denies the service account exactly that (STIG). A batch logon is the one a scheduled task
    # uses, is granted through Administrators, and leaves the two deny rights intact.
    #
    # Read once, write only what differs: 'Settings' with no argument lists every name and
    # value, so a converged host reports no change instead of rewriting the whole declaration.
    # A null value is skipped, so a name can be declared without being managed. A name the
    # product has never stored simply fails to match and is written -- '-Set' inserts a setting
    # that does not yet exist rather than refusing it, so absent and wrong behave alike.
    # This runs last because the CLI needs the service up, which the regions above guarantee.

    - name: 'PROCESS | Read The Current Product Settings'
      become: true
      become_method: 'ansible.builtin.runas'
      become_user: "{{ pdq_deploy_running.service_account.name }}"
      changed_when: false
      no_log: true
      register: '__pdq_deploy_settings__'
      vars:
        ansible_become_flags: 'logon_type=batch'
        ansible_become_password: "{{ __pdq_deploy_secret__.contents }}"

      ansible.windows.win_command:
        argv:
          - "{{ pdq_deploy_running.cli_path }}"
          - 'Settings'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Apply The Declared Product Settings'
      become: true
      become_method: 'ansible.builtin.runas'
      become_user: "{{ pdq_deploy_running.service_account.name }}"
      loop: "{{ pdq_deploy_running.settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      vars:
        ansible_become_flags: 'logon_type=batch'
        ansible_become_password: "{{ __pdq_deploy_secret__.contents }}"
      when: >-
        item.value is not none
        and not (__pdq_deploy_settings__.stdout is search('^' ~ (item.key | regex_escape)
                 ~ '\s*:\s*' ~ (item.value | string | regex_escape) ~ '\s*$', multiline=True))

      ansible.windows.win_command:
        argv:
          - "{{ pdq_deploy_running.cli_path }}"
          - 'Settings'
          - '-Name'
          - "{{ item.key }}"
          - '-Set'
          - "{{ item.value }}"

    #endregion --- [ Process: Apply The Declared Product Settings ] --------------------------- #

#endregion --- [ Process: Install PDQ Deploy on Windows ] ------------------------------------- #


#region ------ [ End: Install PDQ Deploy on Windows ] ----------------------------------------- #

- name: 'END | Prove The Result And Clean Up'

  # Begin The 'End' Block
  block:

    #region ------ [ End: Re-Read The Installed Product ] ------------------------------------- #
    # Ungated, so a converged host proves the same state as a freshly built one. This is the same
    # read BEGIN performed, against the same script, so the two cannot disagree about what counts
    # as installed.

    - name: 'END | Re-Read The Installed Product From Add/Remove Programs'
      register: '__pdq_deploy_final_arp__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          DisplayName: "{{ pdq_deploy_running.arp.display_name }}"
          Version: "{{ pdq_deploy_running.installer.version }}"
        remote_src: false
        script: "{{ lookup('ansible.builtin.file', 'Get-InstalledSoftware.ps1') }}"

    #endregion --- [ End: Re-Read The Installed Product ] ------------------------------------- #

    #region ------ [ End: Prove The Product Is Registered ] ----------------------------------- #
    # Zero entries means the installer reported success without registering the product, which is
    # the failure this postcondition exists to catch: an exit code is the installer's opinion,
    # Add/Remove Programs is the machine's.

    - name: 'END | Prove The Product Is Registered Exactly Once At Or Above The Pin'
      ansible.builtin.assert:
        fail_msg: >-
          Expected '{{ pdq_deploy_running.arp.display_name }}' registered at
          {{ pdq_deploy_running.installer.version }} or above; found
          '{{ __pdq_deploy_final_arp__.result.installed_version }}'. An empty version means
          the installer reported success without registering the product.
        quiet: true
        that: [ not __pdq_deploy_final_arp__.result.action_required ]

    #endregion --- [ End: Prove The Product Is Registered ] ----------------------------------- #

    #region ------ [ End: Prove The Server Is Licensed For Enterprise ] ----------------------- #
    # The registry write is a means, not the goal -- the product either accepts the payload or
    # stays in Free mode, and only the product can say which. SystemInfo is a local read that
    # needs no console authorisation, unlike the commands that talk to the background service.
    # Enterprise also gates Server mode and deployments, so a console silently left in Free mode
    # is a broken build, not a lesser one.

    - name: 'END | Read The Licence Mode From The Product'
      changed_when: false
      register: '__pdq_deploy_systeminfo__'

      ansible.windows.win_command:
        argv:
          - "{{ pdq_deploy_running.cli_path }}"
          - 'SystemInfo'

    # ----------------------------------------------------------------------------------------- #

    - name: 'END | Prove The Server Is Licensed For Enterprise'
      ansible.builtin.assert:
        fail_msg: >-
          The console is not licensed for Enterprise. SystemInfo reported:
          {{ __pdq_deploy_systeminfo__.stdout | trim }}
        quiet: true
        that: [ __pdq_deploy_systeminfo__.stdout is search('LicenseMode\s*:\s*Enterprise') ]

    #endregion --- [ End: Prove The Server Is Licensed For Enterprise ] ----------------------- #

    #region ------ [ End: Prove The Background Service Exists ] ------------------------------- #
    # The product registers, then its service must exist: a registration without the service is a
    # broken install that would otherwise pass unnoticed until the console failed to start.

    - name: 'END | Prove The Background Service Exists'
      failed_when: (__pdq_deploy_service__.services | default([]) | length) != 1
      register: '__pdq_deploy_service__'

      ansible.windows.win_service_info:
        name: "{{ pdq_deploy_running.service_name }}"

    #endregion --- [ End: Prove The Background Service Exists ] ------------------------------- #

    #region ------ [ End: Prove The Service Runs As The Service Account ] --------------------- #
    # Existing is not enough: the identity is what reads the licence and what reaches the
    # targets, so a service left on its installation default is both unlicensed and unable to
    # deploy while looking perfectly healthy. SCM reports the account in resolved form,
    # MACHINE\name, so the machine half is dropped and the account compared -- that is the half
    # this role sets, and it is what separates svc-pdq from the SYSTEM the installer chose.

    - name: 'END | Prove The Background Service Runs As The Service Account'
      ansible.builtin.assert:
        fail_msg: >-
          '{{ pdq_deploy_running.service_name }}' is running as
          '{{ __pdq_deploy_service__.services[0].username }}', not
          '{{ pdq_deploy_running.service_account.name }}'. The service picks up a new logon
          account only when it restarts, so either the restart was skipped or the account was
          rejected at start.
        quiet: true
        that:
          - __pdq_deploy_service__.services[0].username | lower | split('\\') | last
            == pdq_deploy_running.service_account.name | lower

    #endregion --- [ End: Prove The Service Runs As The Service Account ] --------------------- #

#endregion --- [ End: Install PDQ Deploy on Windows ] ----------------------------------------- #


#region ------ [ Always: Install PDQ Deploy on Windows ] -------------------------------------- #

  # Begin the 'Always' block
  always:

    #region ------ [ Always: Remove The Staged Installer From The Guest ] --------------------- #
    # Gated on the copy having been attempted, so a run that never staged deletes nothing while a
    # partial copy is still cleaned up.

    - name: 'END | Remove The Staged Installer From The Guest'
      when: __pdq_deploy_copied__ is defined and not (__pdq_deploy_copied__ is skipped)

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ pdq_deploy_running.install.staging_dir }}"
        state: 'absent'

    #endregion --- [ Always: Remove The Staged Installer From The Guest ] --------------------- #

    #region ------ [ Always: Remove The Controller Staging Directory ] ------------------------ #

    - name: 'END | Remove The Controller Staging Directory'
      changed_when: false
      delegate_to: 'localhost'
      when: __pdq_deploy_stage__ is defined and not (__pdq_deploy_stage__ is skipped)

      ansible.builtin.file:
        access_time_format: '%Y%m%d%H%M.%S'
        follow: true
        force: false
        modification_time_format: '%Y%m%d%H%M.%S'
        path: "{{ __pdq_deploy_stage__.path }}"
        recurse: false
        state: 'absent'
        unsafe_writes: false

    #endregion --- [ Always: Remove The Controller Staging Directory ] ------------------------ #

#endregion --- [ Always: Install PDQ Deploy on Windows ] -------------------------------------- #
