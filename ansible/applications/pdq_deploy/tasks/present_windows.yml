# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Installs PDQ Deploy at the pinned version.
#
# BEGIN reads the machine and decides ONE action — install, upgrade, or none. PROCESS acts on that
# decision, and END proves the result and cleans up. Every PROCESS task carries the decision
# individually rather than the stage carrying it once, so a run always lists the same steps in the
# same order: a converged host reads as a column of skips, not a stage that vanished.
#
# END is deliberately ungated, so a converged host proves the same state as a freshly built one.
#
# Install state comes from Add/Remove Programs, read by a first-class PowerShell script rather than
# an inline block: the guest-side logic is developed and Pester-tested once under scripts/, and the
# role executes a materialized copy. ARP carries the version and the install location together and
# Windows removes the entry on uninstall, which the vendor's own product key cannot answer because
# it survives uninstall. Not the MSI ProductCode, which changes every release.
#
# Everything moves through the runner: the controller fetches the installer and hands it to the
# target, so the guest never receives cloud credentials or any other reach into S3. The digest is
# verified on the guest, because that is the copy that executes.
#
# Return code 3010 is a success: it means the product installed and wants a restart. The role
# restarts when the installer asks for one, and only then.
#
# Cleanup lives under END's 'always', which means it does NOT run after an unrescued PROCESS
# failure. That is the accepted trade of the three-stage shape: the residue is controller temp
# directories and an installer on the guest, and the proof bed is rebuilt for every run. PROCESS
# carries an 'always' of its own for one thing only -- flushing a notified restart -- because a
# service left running configuration that was already written is not residue to tidy up later,
# it is a wrong state no later converge would ever correct.
#
# Licensing is a separate capability and a separate region.
#
# ============================================================================================= #
---
#region ------ [ Begin: Install PDQ Deploy on Windows ] --------------------------------------- #

# The service account is declared as the account it logs on as, '.\name'. Windows wants a bare
# name in some places and the qualified form in others, so the bare one is taken from it once,
# here, and added alongside. no_log because the declaration carries the secret.

- name: 'BEGIN | Read The Service Account Declaration'
  no_log: true
  ansible.builtin.set_fact:
    pdq_deploy_running: >-
      {{ pdq_deploy_running | combine({'service_account': pdq_deploy_running.service_account
           | combine({'name': pdq_deploy_running.service_account.username
                              | default('', true) | regex_replace('^\.\\', '')})}) }}

- name: 'BEGIN | Read The Machine And Decide One Action'

  # Begin The 'Begin' Block
  block:

    #region ------ [ Begin: Read The Installed Product ] -------------------------------------- #
    # Add/Remove Programs is the source of truth for install state: it carries the version and
    # the install location together, and Windows removes the entry on uninstall. The vendor's own
    # product key survives with no install-path value, so it cannot answer "is this installed,
    # and at what version". Parameters cross as typed module options, never Jinja spliced into
    # the script source, which is what keeps the injection surface at zero. No changed_when: the
    # script's $Ansible.Changed is the change report, and a read never changes anything. The
    # referenced .ps1 is MATERIALIZED from scripts/ by scripts/materialize-role-scripts.sh (the
    # role tracks only files/Get-InstalledSoftware.ps1.stub); run it before this role.

    - name: 'BEGIN | Read The Installed Product From Add/Remove Programs'
      register: '__pdq_deploy_arp__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          DisplayName: "{{ pdq_deploy_running.arp.display_name }}"
          Version: "{{ pdq_deploy_running.installer.version }}"
        script: "{{ lookup('ansible.builtin.file', 'Get-InstalledSoftware.ps1') }}"

    #endregion --- [ Begin: Read The Installed Product ] -------------------------------------- #

#endregion --- [ Begin: Install PDQ Deploy on Windows ] --------------------------------------- #


#region ------ [ Process: Install PDQ Deploy on Windows ] ------------------------------------- #

- name: 'PROCESS | Install And Licence PDQ Deploy At The Pinned Version'
  vars:
    __installer_name__: >-
      {{ pdq_deploy_running.installer.path
         | replace('<version>', pdq_deploy_running.installer.version) | basename }}
    __guest_installer__: "{{ pdq_deploy_running.install.staging_dir }}\\{{ __installer_name__ }}"
    __action_required__: "{{ __pdq_deploy_arp__.result.action_required }}"
    __repository_dir__: >-
      {{ pdq_deploy_running.repository.drive }}:\{{ pdq_deploy_running.repository.directory }}
    # The repository sync: its scheduled task, the limit Task Scheduler holds one run to -- which
    # also bounds the converge's wait for it -- and the directory holding its script, launcher
    # and log, beside the repository rather than in it, so neither the sync nor the share reaches
    # them.
    __sync_task__: 'PDQ Repository Sync'
    __sync_limit_days__: 1
    __sync_dir__: "{{ pdq_deploy_running.repository.drive }}:\\Sync-Repository"
    __sync_script__: "{{ __sync_dir__ }}\\Set-RepositoryContent.ps1"
    __sync_launcher__: "{{ __sync_dir__ }}\\Sync-Repository.bat"
    __sync_log__: "{{ __sync_dir__ }}\\Sync-Repository.log"
    # Anchored on THIS role. A bare 'packages/*.xml' is resolved against the whole search path, so
    # a role whose own files/ did not arrive silently matches another tree's -- measured 2026-08-25,
    # it returned a file from the playbook's files/ directory.
    __package_glob__: "{{ role_path }}/files/packages/*.xml"
    # The helper scripts a package step calls by path. Named rather than discovered, because the
    # grant that publishes them names the same two keys: a script added to a package without being
    # added here, and to that policy, fails at deploy time rather than at converge.
    __repository_helper_scripts__:
      - 'Get-InstalledSoftware.ps1'
      - 'Start-Uninstaller.ps1'

  # Begin The 'Process' Block
  block:

    #region ------ [ Process: Ensure The Background Service User ] ---------------------------- #
    # One Background Service User is shared by Deploy and Inventory, so this role ensures it
    # rather than owning it. Membership is enforced EXACTLY: replace adds every listed group and
    # removes the account from all others, so a membership widened by hand is pulled back to the
    # single group the vendor requires instead of persisting unnoticed. Both roles name the same
    # one group, so neither strips the other's work. update_password always enforces the password
    # to match the secret, but win_user validates the current one first (a logon attempt), so an
    # unchanged password reports no change and a genuine rotation is reported honestly, not hidden.

    - name: 'PROCESS | Ensure The Background Service User'
      no_log: true

      ansible.windows.win_user:
        groups: [ 'Administrators' ]
        groups_action: 'replace'
        name: "{{ pdq_deploy_running.service_account.name }}"
        password: "{{ pdq_deploy_running.service_account.password }}"
        password_never_expires: false
        state: 'present'
        update_password: 'always'
        user_cannot_change_password: false

    #endregion --- [ Process: Ensure The Background Service User ] ---------------------------- #

    #region ------ [ Process: Grant Log On As A Service ] ------------------------------------- #
    # A service account that cannot log on as a service fails at service start with an error that
    # names neither the right nor the account. action adds rather than sets, so other holders of
    # the right keep it.

    - name: 'PROCESS | Grant Log On As A Service'
      ansible.windows.win_user_right:
        action: 'add'
        name: 'SeServiceLogonRight'
        users: [ ".\\{{ pdq_deploy_running.service_account.name }}" ]

    #endregion --- [ Process: Grant Log On As A Service ] ------------------------------------- #

    #region ------ [ Process: Deny Interactive Logon To The Service Account ] ----------------- #
    # STIG: a service account must not be usable to sign in at the console. Denying the right
    # outright beats relying on nobody knowing the password, and a service logon is unaffected
    # because it is a different right. action adds, so other denied principals keep their entry.

    - name: 'PROCESS | Deny Interactive Logon To The Service Account'
      ansible.windows.win_user_right:
        action: 'add'
        name: 'SeDenyInteractiveLogonRight'
        users: [ ".\\{{ pdq_deploy_running.service_account.name }}" ]

    #endregion --- [ Process: Deny Interactive Logon To The Service Account ] ----------------- #

    #region ------ [ Process: Deny Remote Interactive Logon To The Service Account ] ---------- #
    # The same rule for the remote desktop path, which is a separate right: denying console logon
    # alone would still leave the account able to sign in over RDP.

    - name: 'PROCESS | Deny Remote Interactive Logon To The Service Account'
      ansible.windows.win_user_right:
        action: 'add'
        name: 'SeDenyRemoteInteractiveLogonRight'
        users: [ ".\\{{ pdq_deploy_running.service_account.name }}" ]

    #endregion --- [ Process: Deny Remote Interactive Logon To The Service Account ] ---------- #

    #region ------ [ Process: Create The Controller Staging Directory ] ----------------------- #

    - name: 'PROCESS | Create The Controller Staging Directory'
      changed_when: false
      check_mode: false
      delegate_to: 'localhost'
      register: '__pdq_deploy_stage__'

      ansible.builtin.tempfile:
        path: '/tmp'
        prefix: 'pdq-deploy-'
        state: 'directory'
        suffix: ''

    #endregion --- [ Process: Create The Controller Staging Directory ] ----------------------- #

    #region ------ [ Process: Fetch The Installer To The Controller ] ------------------------- #
    # The module probes the BUCKET before the object, and that probe is authorized by a bucket-
    # level grant this deployment deliberately does not hold: reading one pinned prefix must not
    # imply the right to see the bucket. Skipping the probe is the module's documented answer for
    # exactly that policy shape. A missing object still fails loudly — the key check uses
    # head_object, which the object-level grant does authorize.

    - name: 'PROCESS | Fetch The Installer To The Controller'
      delegate_to: 'localhost'
      vars:
        __installer_key__: >-
          {{ pdq_deploy_running.installer.path
             | replace('<version>', pdq_deploy_running.installer.version) }}
      when: __action_required__ | bool

      amazon.aws.s3_object:
        bucket: "{{ pdq_deploy_running.installer.bucket }}"
        ceph: false
        debug_botocore_endpoint_logs: false
        dest: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"
        dualstack: false
        encrypt: true
        encryption_mode: 'AES256'
        expiry: 600
        ignore_nonexistent_bucket: true
        mode: 'get'
        object: "{{ __installer_key__ }}"
        overwrite: 'different'
        permission: [ 'private' ]
        prefix: ''
        purge_tags: true
        retries: 0
        sig_v4: true
        validate_bucket_name: true
        validate_certs: true

    #endregion --- [ Process: Fetch The Installer To The Controller ] ------------------------- #

    #region ------ [ Process: Ensure The Guest Staging Directory Exists ] --------------------- #
    # Everything moves through the runner: the controller holds the S3 credentials and hands the
    # file to the guest, so the guest never receives any reach into S3.

    - name: 'PROCESS | Ensure The Guest Staging Directory Exists'
      when: __action_required__ | bool

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ pdq_deploy_running.install.staging_dir }}"
        state: 'directory'

    #endregion --- [ Process: Ensure The Guest Staging Directory Exists ] --------------------- #

    #region ------ [ Process: Copy The Installer To The Guest ] ------------------------------- #
    # remote_src stays false because the source is the controller copy fetched above, and force
    # stays true so a partial or stale staged file is replaced rather than trusted.

    - name: 'PROCESS | Copy The Installer To The Guest'
      register: '__pdq_deploy_copied__'
      when: __action_required__ | bool

      ansible.windows.win_copy:
        backup: false
        decrypt: true
        dest: "{{ __guest_installer__ }}"
        force: true
        local_follow: true
        remote_src: false
        src: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"

    #endregion --- [ Process: Copy The Installer To The Guest ] ------------------------------- #

    #region ------ [ Process: Install Silently From The Verified Copy ] ----------------------- #
    # The vendor's silent switch and success code are properties of this binary, not operator
    # choices, so they live beside the package invocation. The digest is verified on the guest,
    # because that is the copy that executes. A wrong silent switch can leave the installer
    # waiting on a dialog rather than returning, so the run is bounded and fails inside Ansible.
    # 3010 is accepted alongside 0 because it is not a failure: it means the product installed
    # and wants a restart to finalise. The module turns that exact code into reboot_required,
    # which the next region acts on, so the install is only reported complete once the machine is
    # in the state the installer asked for.

    - name: 'PROCESS | Install Silently From The Verified Copy'
      async: "{{ pdq_deploy_running.install.timeout_seconds }}"
      poll: 15
      register: '__pdq_deploy_installed__'
      when: __action_required__ | bool

      ansible.windows.win_package:
        arguments: '/s'
        checksum_algorithm: 'sha256'
        checksum: "{{ pdq_deploy_running.installer.sha256 }}"
        expected_return_code: [ 0, 3010 ]
        follow_redirects: 'safe'
        force_basic_auth: false
        http_agent: 'ansible-httpget'
        maximum_redirection: 50
        path: "{{ __guest_installer__ }}"
        provider: 'auto'
        proxy_use_default_credential: false
        state: 'present'
        url_timeout: 30
        use_default_credential: false
        use_proxy: true
        validate_certs: true
        verify_signature: false
        wait_for_children: false

    #endregion --- [ Process: Install Silently From The Verified Copy ] ----------------------- #

    #region ------ [ Process: Reboot When The Installer Requires It ] ------------------------- #
    # reboot_required is set by the module for return code 3010 and nothing else, so this acts
    # on the installer's own request rather than on a guess. It is the only condition needed: a
    # run that never installed leaves no reboot_required to be true.

    - name: 'PROCESS | Reboot When The Installer Requires It'
      when: __pdq_deploy_installed__.reboot_required | default(false) | bool

      ansible.windows.win_reboot:
        boot_time_command: >-
          (Get-CimInstance -ClassName Win32_OperatingSystem -Property
          LastBootUpTime).LastBootUpTime.ToFileTime()
        connect_timeout: 5
        msg: 'Restarting to finalise the PDQ Deploy installation.'
        post_reboot_delay: 0
        pre_reboot_delay: 2
        reboot_timeout: 600

    #endregion --- [ Process: Reboot When The Installer Requires It ] ------------------------- #

    #region ------ [ Process: Apply The Product Licence ] ------------------------------------- #
    # The product accepts the marker block and nothing else: the object carries trailing lines past
    # the end marker and LF endings, and written verbatim it leaves the console in Free mode. The
    # slice keeps both markers because the vendor requires them, and the two replacements normalise
    # every ending to CRLF whatever the object used. The controller lookup has already rejected
    # empty content and verified the stored bytes against the pinned digest.
    #
    # The product REWRITES what it is given: a multi-line licence block comes back as one line with
    # every break stripped (measured on PDQ Deploy, seventeen lines to one 620-character line),
    # the same characters in a different shape. Comparing literally would therefore report a
    # change on every converge and bounce the service with it, so the comparison ignores
    # whitespace and asks only whether the licence itself differs. A licence removed or replaced
    # by hand is still restored.

    - name: 'PROCESS | Read The Licence Already Stored'
      no_log: true
      register: '__pdq_deploy_license_current__'

      ansible.windows.win_reg_stat:
        name: 'License'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Apply The Product Licence'
      no_log: true
      notify: 'pdq-deploy-restart-required'
      vars:
        __licence__: >-
          {{ pdq_deploy_running.license_key
             | regex_search('--- START LICENSE ---[\s\S]*--- END LICENSE ---')
             | regex_replace('\r\n', '\n')
             | regex_replace('\n', '\r\n') }}
      when: >-
        __pdq_deploy_license_current__.value | default('') | regex_replace('\s', '')
        != __licence__ | regex_replace('\s', '')

      ansible.windows.win_regedit:
        data: "{{ __licence__ }}"
        name: 'License'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy'
        state: 'present'
        type: 'string'

    #endregion --- [ Process: Apply The Product Licence ] ------------------------------------- #

    #region ------ [ Process: Place The Database On The Dedicated Drive ] --------------------- #
    # The database is the one part of this product that grows without bound, so it lives on the
    # drive provisioned for it rather than on the system volume. Set BEFORE the service is first
    # started, which is why this sits above the service region: the product creates the database
    # wherever this points on that first start, so there is nothing to stop, copy and restart.
    # A host whose database already exists elsewhere is not migrated by this -- it would be left
    # behind, and moving it is a different job from building a server. It goes in a FOLDER on that
    # drive rather than at the root, because an ACL set on a directory can be tightened without
    # disturbing the permissions Windows grants on a volume root.

    - name: 'PROCESS | Create The Database Directory On The Dedicated Drive'
      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: >-
          {{ pdq_deploy_running.database.drive }}:\{{ pdq_deploy_running.database.directory }}
        state: 'directory'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Point The Product At The Database On The Dedicated Drive'
      notify: 'pdq-deploy-restart-required'
      vars:
        __database_file__: >-
          {{ pdq_deploy_running.database.drive }}:\{{ pdq_deploy_running.database.directory
             }}\Database.db
      ansible.windows.win_regedit:
        data: "{{ __database_file__ }}"
        name: 'FileName'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Settings\Database'
        state: 'present'
        type: 'string'

    #endregion --- [ Process: Place The Database On The Dedicated Drive ] --------------------- #

    #region ------ [ Process: Prepare The Repository Directory ] ------------------------------ #
    # The directory is created and locked down BEFORE it is published: a share that exists
    # ahead of its ACL is readable by whoever the volume root lets in, for as long as the gap
    # lasts. The DACL is ENFORCED wholesale by a first-class script rather than granted entry
    # by entry: the native module never removes an entry it did not write, so a hand-added
    # grant -- Everyone at full control -- survived every
    # converge. The script owns the whole list: inheritance from the volume root severed,
    # SYSTEM and Administrators full control, Users read and execute, and ANY other entry removed. The
    # service account is named nowhere: it is an Administrator by vendor requirement, and
    # repeating that would be a second place to maintain one fact. The referenced .ps1 is
    # MATERIALIZED from scripts/ by scripts/materialize-role-scripts.sh (the role tracks only
    # files/Set-RepositoryAcl.ps1.stub); run it before this role.
    #
    # The sync directory takes the same list, before its script, launcher and log are written
    # into it: the volume root lets any authenticated user modify what it holds, and those are
    # files an administrator's elevated token runs.

    - name: 'PROCESS | Create The Repository And Sync Directories On Their Dedicated Drive'
      loop:
        - "{{ __repository_dir__ }}"
        - "{{ __sync_dir__ }}"
      loop_control:
        label: "{{ item }}"

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ item }}"
        state: 'directory'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Enforce The Repository And Sync Directory Permissions'
      loop:
        - "{{ __repository_dir__ }}"
        - "{{ __sync_dir__ }}"
      loop_control:
        label: "{{ item }}"

      ansible.windows.win_powershell:
        depth: 2
        error_action: 'stop'
        parameters:
          Path: "{{ item }}"
          # SYSTEM and Administrators full, Users read-and-execute so privileged operators
          # can navigate but never alter packages the product runs as SYSTEM; inheritance off.
          Sddl: 'D:PAI(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)(A;OICI;0x1200a9;;;BU)'
        script: "{{ lookup('ansible.builtin.file', 'Set-RepositoryAcl.ps1') }}"

    # ----------------------------------------------------------------------------------------- #
    # The repository holds what deployments copy to their targets, and those files arrive from S3
    # rather than from this role -- an installer is vendor content, not configuration, and pinning
    # every one of them here would make a converge the only way to publish software.
    #
    # The host reads the bucket itself, through the instance profile it was launched with. The
    # repository is measured in gigabytes, and handing every byte through the deployment runner
    # would be the wrong shape for content the host is already entitled to read.
    #
    # The pull is DETERMINISTIC and compares before it copies, so a converge that finds the repository
    # current fetches nothing and reports no change.

    # ----------------------------------------------------------------------------------------- #
    # The helper scripts a package step calls by path, published to the bucket before the sync
    # runs. Packages reference them as $(Repository)\~resources\<name>, and the sync is
    # deterministic -- so a copy placed on a volume by hand is removed on the next converge and the
    # bucket is the only place these can live.
    #
    # Uploaded from the controller, which holds the write grant; the host's own access to the
    # bucket is read-only. Replaced when the content differs rather than written once, because a corrected
    # script reaching the fleet is the point: these objects are identified by name and not by
    # version, and the grant permits replacing exactly these two keys and nothing else.
    #
    # The difference is judged here, by SHA-256, and not by the module: its own comparison hashes
    # with MD5, which a FIPS-mode controller refuses. The published copies are read back into a
    # controller staging directory and both sides hashed, so the upload runs, and reports a
    # change, exactly when a copy differs. The staging directory and the read-back run in check
    # mode too, because a check run must still compare; they write nowhere but the controller.
    # Without the bucket-level grant this role is deliberately not given, S3 answers a missing
    # key and a denied one alike, and the module reports both as the key not existing: either way
    # the published copy is unreadable and the upload below replaces it. Any other failure stops
    # the run.

    - name: 'PROCESS | Read The Published Helper Scripts Back'
      changed_when: false
      check_mode: false
      delegate_to: 'localhost'
      failed_when: >-
        __pdq_deploy_published_helper__ is failed
        and __pdq_deploy_published_helper__.msg
            != 'Key ~resources/%s does not exist.' | format(item)
      loop: "{{ __repository_helper_scripts__ }}"
      loop_control:
        label: "{{ item }}"
      register: '__pdq_deploy_published_helper__'

      amazon.aws.s3_object:
        bucket: "{{ pdq_deploy_running.repository.bucket }}"
        ceph: false
        debug_botocore_endpoint_logs: false
        dest: "{{ __pdq_deploy_stage__.path }}/{{ item }}"
        dualstack: false
        encrypt: true
        encryption_mode: 'AES256'
        expiry: 600
        ignore_nonexistent_bucket: true
        mode: 'get'
        object: "~resources/{{ item }}"
        overwrite: 'always'
        permission: [ 'private' ]
        prefix: ''
        purge_tags: true
        region: "{{ pdq_deploy_running.repository.region }}"
        retries: 0
        sig_v4: true
        validate_bucket_name: true
        validate_certs: true

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Hash The Published Helper Scripts'
      delegate_to: 'localhost'
      loop: "{{ __repository_helper_scripts__ }}"
      loop_control:
        label: "{{ item }}"
      register: '__pdq_deploy_published_digest__'

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        follow: false
        get_attributes: false
        get_checksum: true
        get_mime: false
        get_selinux_context: false
        path: "{{ __pdq_deploy_stage__.path }}/{{ item }}"

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Hash The Helper Scripts This Role Ships'
      delegate_to: 'localhost'
      loop: "{{ __repository_helper_scripts__ }}"
      loop_control:
        label: "{{ item }}"
      register: '__pdq_deploy_shipped_digest__'

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        follow: false
        get_attributes: false
        get_checksum: true
        get_mime: false
        get_selinux_context: false
        path: "{{ role_path }}/files/{{ item }}"

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Publish The Helper Scripts Packages Call'
      delegate_to: 'localhost'
      loop: "{{ __repository_helper_scripts__ }}"
      loop_control:
        label: "{{ item }}"
      vars:
        __published__: >-
          {{ __pdq_deploy_published_digest__.results
             | items2dict(key_name='item', value_name='stat') }}
        __shipped__: >-
          {{ __pdq_deploy_shipped_digest__.results
             | items2dict(key_name='item', value_name='stat') }}
      when: >-
        not __published__[item].exists
        or __published__[item].checksum != __shipped__[item].checksum

      amazon.aws.s3_object:
        bucket: "{{ pdq_deploy_running.repository.bucket }}"
        ceph: false
        debug_botocore_endpoint_logs: false
        dualstack: false
        encrypt: true
        encryption_mode: 'AES256'
        expiry: 600
        # True for the same reason the installer fetch above sets it: the probe it skips is a
        # HeadBucket, which needs s3:ListBucket on the whole bucket -- a grant this role is
        # deliberately not given. Left false, every run dies on the probe rather than on anything
        # to do with the object.
        ignore_nonexistent_bucket: true
        mode: 'put'
        object: "~resources/{{ item }}"
        overwrite: 'always'
        # Empty, not 'private'. The bucket enforces bucket-owner ownership, so ACLs are disabled on
        # it and a PUT carrying any canned ACL is refused outright. The module cannot detect that
        # here -- reading the ownership setting needs a permission this role does not have, and it
        # treats the denial as "ACLs are enabled".
        permission: []
        prefix: ''
        purge_tags: true
        region: "{{ pdq_deploy_running.repository.region }}"
        retries: 0
        sig_v4: true
        src: "{{ role_path }}/files/{{ item }}"
        validate_bucket_name: true
        validate_certs: true

    # ----------------------------------------------------------------------------------------- #
    # The sync runs in the background, as a scheduled task: a first fill takes hours, longer than
    # the controller's AWS session lasts, and nothing else in the installation needs the
    # repository filled, so the rest proceeds while it runs and the end of this block waits for
    # it. The task is the sync's only runner: every converge and every operator start the same
    # one.

    - name: 'PROCESS | Place The Repository Sync Script'
      ansible.windows.win_copy:
        backup: false
        decrypt: true
        dest: "{{ __sync_script__ }}"
        force: true
        local_follow: true
        remote_src: false
        src: "{{ role_path }}/files/Set-RepositoryContent.ps1"

    # ----------------------------------------------------------------------------------------- #
    # The task runs as the Background Service User rather than SYSTEM, which the job does not
    # need. That account is an Administrator by vendor requirement and the repository admits it
    # only through that membership, so it runs with its elevated token. S4U logs it on without
    # storing a password: Administrators hold the batch-logon right, which the STIG restricts to
    # them, so no grant names the account. S4U carries no network credential, and the sync needs
    # none -- it reads the bucket over HTTPS through the instance profile, which AWS keys set
    # machine-wide or in the account's own profile would outrank.
    #
    # The module refuses S4U without the password, so the current one is presented under no_log;
    # with update_password off it reaches Task Scheduler only when the definition changes, and a
    # rotation cannot break a task that stores none.
    #
    # A start while a run is in progress is ignored, so a run is never stopped mid-transfer and
    # nothing races the running one for its log; hard termination is what lets the time limit
    # end the process. Priority 5 is normal: the module's default of 7 would run a ten-hour first
    # fill at below-normal CPU and low I/O. A failed run is not restarted: it fails the converge
    # that awaits it. The script runs as a script block, as the converge runs every script it
    # carries, so an execution policy that refuses unsigned files cannot stop the task when it
    # does not stop the converge; every stream it writes goes to the log.
    #
    # The module compares every argument it is given with the stored task, so what is left unset
    # is left unset on purpose: the display name, author, date, source and version are
    # informational, and a stored form differing from the stated one would re-register the task
    # every converge; delete_expired_task_after and restart_interval mean nothing without a
    # trigger end or a restart count; the working directory, because the action names every path
    # absolutely; and group, which cannot be combined with a user. The limit is stated in days
    # for the same reason: Task Scheduler stores a whole-day limit as days, however it is stated.

    - name: 'PROCESS | Register The Repository Sync Task'
      no_log: true

      community.windows.win_scheduled_task:
        actions:
          - arguments: >-
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "&
              ([ScriptBlock]::Create((Get-Content -LiteralPath '{{ __sync_script__ }}' -Raw)))
              -Bucket '{{ pdq_deploy_running.repository.bucket }}'
              -Path '{{ __repository_dir__ }}'
              -Region '{{ pdq_deploy_running.repository.region }}' *> '{{ __sync_log__ }}'"
            path: 'powershell.exe'
        allow_demand_start: true
        allow_hard_terminate: true
        compatibility: 4
        description: >-
          Mirrors the application repository bucket into {{ __repository_dir__ }}. Started on
          demand, by every deployment and by {{ __sync_launcher__ }}; it has no schedule.
        disallow_start_if_on_batteries: false
        enabled: true
        execution_time_limit: "P{{ __sync_limit_days__ }}D"
        hidden: false
        logon_type: 's4u'
        multiple_instances: 2
        name: "{{ __sync_task__ }}"
        password: "{{ pdq_deploy_running.service_account.password }}"
        path: '\'
        priority: 5
        restart_count: 0
        run_level: 'highest'
        run_only_if_idle: false
        run_only_if_network_available: false
        start_when_available: false
        state: 'present'
        stop_if_going_on_batteries: false
        triggers: []
        update_password: false
        username: "{{ pdq_deploy_running.service_account.name }}"
        wake_to_run: false

    # ----------------------------------------------------------------------------------------- #
    # The same start for an administrator publishing new content between deployments: the
    # launcher asks Task Scheduler to run the task above, and the log says how the run went.

    - name: 'PROCESS | Write The Repository Sync Launcher'
      ansible.windows.win_template:
        dest: "{{ __sync_launcher__ }}"
        newline_sequence: '\r\n'
        src: 'Sync-Repository.bat.j2'

    # ----------------------------------------------------------------------------------------- #
    # Started the way the launcher starts it, because neither scheduled-task module starts a
    # task, and only once no run is in progress: a start during one is ignored. The state read
    # last is what the wait at the end of this block compares against. No change is reported
    # here: the change, if any, is the sync's own, and it is reported where the run is awaited.
    # Nothing after this point needs the repository filled or restarts the machine. A converge
    # that fails before the wait, or loses its connection during it, leaves its sync running
    # unattended, and the next converge waits for that run to finish before starting its own --
    # as it does for a run an operator started. A check run only validates the task's
    # definition, so it has nothing to start or await.

    - name: 'PROCESS | Wait Until No Repository Sync Is Running'
      delay: 30
      register: '__pdq_deploy_sync_before__'
      retries: "{{ __sync_limit_days__ * 2880 + 10 }}"
      until: >-
        __pdq_deploy_sync_before__.state.status
            not in ['TASK_STATE_RUNNING', 'TASK_STATE_QUEUED']
      when: not ansible_check_mode

      community.windows.win_scheduled_task_stat:
        name: "{{ __sync_task__ }}"
        path: '\'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Start The Repository Sync In The Background'
      changed_when: false
      when: not ansible_check_mode

      ansible.windows.win_command:
        argv:
          - 'schtasks.exe'
          - '/Run'
          - '/TN'
          - "{{ __sync_task__ }}"

    # ----------------------------------------------------------------------------------------- #
    # A run whose account cannot log on is never launched and leaves the last run time as it was.
    # The converge would then fail at the next logon as that account, where no_log hides the
    # reason, so the launch is confirmed here to name the cause at the sync's own step.

    - name: 'PROCESS | Wait For The Repository Sync To Start'
      delay: 10
      failed_when: false
      register: '__pdq_deploy_sync_started__'
      retries: 30
      until: >-
        __pdq_deploy_sync_started__.state.last_run_time
            != __pdq_deploy_sync_before__.state.last_run_time
      when: not ansible_check_mode

      community.windows.win_scheduled_task_stat:
        name: "{{ __sync_task__ }}"
        path: '\'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Require The Repository Sync To Have Started'
      when: not ansible_check_mode

      ansible.builtin.assert:
        fail_msg: >-
          Task Scheduler did not start the repository sync within five minutes (its last run time
          is unchanged), which is what happens when the service account cannot log on -- for
          example, when it is disabled.
        quiet: true
        that:
          - __pdq_deploy_sync_started__.state.last_run_time
            != __pdq_deploy_sync_before__.state.last_run_time

    # ----------------------------------------------------------------------------------------- #
    # The launcher's earlier forms, in the drive root. Hosts converged before it moved carry them
    # there, where any authenticated user can modify a file an administrator runs elevated; the
    # .cmd cannot work at all, calling an AWS command line this image does not ship.

    - name: 'PROCESS | Remove The Superseded Repository Sync Scripts'
      loop:
        - 'Sync-Repository.bat'
        - 'Sync-Repository.cmd'
      loop_control:
        label: "{{ item }}"

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ pdq_deploy_running.repository.drive }}:\\{{ item }}"
        state: 'absent'

    #endregion --- [ Process: Prepare The Repository Directory ] ------------------------------ #

    #region ------ [ Process: Share The Repository Over The Network ] ------------------------- #
    # Published only once the directory beneath it is permissioned. Share access is exactly the
    # service account whose credential pull-mode targets present, plus Administrators for operator
    # navigation; Everyone is removed and traffic is SMB3-encrypted. The share remains READ ONLY,
    # with writes made locally rather than across the wire. The NTFS ACL remains the binding gate:
    # SYSTEM and Administrators have full access, while Users have read-and-execute. rule_action is
    # 'set' so stale grants are removed rather than accumulating.

    # A share admits the identity that READS from it, and that is not only the account the service
    # runs as. A deployment fetches the package's installer from this share over UNC as the
    # credential the product deploys with -- a DOMAIN account that shares a NAME with the local
    # service account and is a different principal entirely, which is why granting one grants
    # nothing to the other. Read on the share, because NTFS already admits it through Users; the
    # effective right is the lesser of the two, so the share was the half that refused. Every
    # declared account is admitted.
    - name: 'PROCESS | Share The Repository Over The Network'
      vars:
        __repository_readers__: >-
          {{ (([pdq_deploy_running.service_account.name, 'Administrators']
               + (pdq_deploy_running.credentials | default([], true)
                  | map(attribute='username') | select('defined') | list))
              | reject('equalto', '') | list | unique | join(',')) }}

      ansible.windows.win_share:
        caching_mode: 'Manual'
        description: 'PDQ Deploy package repository'
        encrypt: true
        list: false
        name: "{{ pdq_deploy_running.repository.share_name }}"
        path: "{{ __repository_dir__ }}"
        read: "{{ __repository_readers__ }}"
        rule_action: 'set'
        state: 'present'

    #endregion --- [ Process: Share The Repository Over The Network ] ------------------------- #

    #region ------ [ Process: Put The Console In Central Server Mode ] ------------------------ #
    # PDQ Deploy and PDQ Inventory integrate only co-located and in the same operating mode, so
    # an all-in-one Central Server is an invariant of this repository rather than a value to
    # offer -- the mode is written literally, because an input here would be a knob that must
    # never be turned. A silent install leaves it Local, which is why a console opened on an
    # otherwise converged host still walks the Initialize wizard. Written through the REGISTRY,
    # not the SetServiceMode command line: that command refuses while the service is running
    # ("close the Console and Background Service"), whereas the registry value is read at start,
    # so the restart below picks it up -- registry Mode=Server flips SystemInfo's ServiceMode to
    # Server. Written before the service region for the same reason.

    - name: 'PROCESS | Put The Console In Central Server Mode'
      notify: 'pdq-deploy-restart-required'

      ansible.windows.win_regedit:
        data: 'Server'
        name: 'Mode'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'string'

    #endregion --- [ Process: Put The Console In Central Server Mode ] ------------------------ #

    #region ------ [ Process: Set The Central Server Port ] ----------------------------------- #
    # The port client consoles connect to. 6336 is the product's own default, measured
    # (Protocol\ServerPort). Deliberately NOT written beside it: LocalTcpPort, which the product
    # assigns per host from the dynamic range, and ServicePrincipalName, which the wizard leaves at
    # a value whose contract is not understood -- pinning a value we cannot explain is worse than
    # leaving the product's own.

    - name: 'PROCESS | Set The Central Server Port'
      notify: 'pdq-deploy-restart-required'

      ansible.windows.win_regedit:
        data: "{{ pdq_deploy_running.server.port }}"
        name: 'ServerPort'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'dword'

    #endregion --- [ Process: Set The Central Server Port ] ----------------------------------- #

    #region ------ [ Process: Choose The Addresses The Server Answers On ] -------------------- #
    # Two halves of one decision, so they live together: name no addresses and the server
    # answers on all of them, name some and it answers only there. A server bound to one
    # address stops answering when that address changes, and this host's is assigned at launch,
    # so every-address is the default. The flag is written on BOTH paths rather than only the
    # first -- left at 1 it would outrank a named list, and a host moved from all-addresses to
    # a list would keep answering everywhere while appearing not to.

    - name: 'PROCESS | Answer Consoles On Every Address Unless Addresses Are Named'
      notify: 'pdq-deploy-restart-required'

      ansible.windows.win_regedit:
        data: >-
          {{ 0 if pdq_deploy_running.server.listen_addresses | default([], true) | length > 0
             else 1 }}
        name: 'ServerListenAllAddresses'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'dword'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Answer Consoles On The Named Addresses'
      notify: 'pdq-deploy-restart-required'
      when: pdq_deploy_running.server.listen_addresses | default([], true) | length > 0

      ansible.windows.win_regedit:
        data: "{{ pdq_deploy_running.server.listen_addresses }}"
        name: 'ServerListenAddresses'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy\Protocol'
        state: 'present'
        type: 'multistring'

    #endregion --- [ Process: Choose The Addresses The Server Answers On ] -------------------- #

    #region ------ [ Process: Enable Role-Based Access Control ] ------------------------------ #
    # Role-Based Access Control decides whether console users are authorised individually or
    # simply by being administrators. Written from an input rather than fixed, because a
    # deployment that has not yet modelled roles needs it off, and turning it on before then
    # authorises nobody for anything. Lives at the product root rather than under Protocol, and
    # is read at service start like the rest, so a change joins the restart below. The input is a
    # boolean and the stored value a dword, so the filter is the whole translation between them.

    - name: 'PROCESS | Enable Role-Based Access Control'
      notify: 'pdq-deploy-restart-required'

      ansible.windows.win_regedit:
        data: "{{ pdq_deploy_running.rbac_enabled | int }}"
        name: 'RBAC Enabled'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy'
        state: 'present'
        type: 'dword'

    #endregion --- [ Process: Enable Role-Based Access Control ] ------------------------------ #

    #region ------ [ Process: Open The Firewall For Client Consoles ] ------------------------- #
    # Opening the port on the cloud side reaches the host and stops there: Windows Firewall is
    # on for every profile on this image, so without this rule the service listens and nothing
    # arrives. Scoped BOTH ways, as the product's own wizard scopes it -- to the service
    # executable and to the port -- so the exception admits that one program on that one port
    # rather than opening the port to whatever else may bind it later. The wizard names its
    # rule by GUID (measured on PDQ Deploy); this names it directly, which is also what makes
    # it idempotent and removable.

    - name: 'PROCESS | Open The Firewall For Client Consoles'
      community.windows.win_firewall_rule:
        action: 'allow'
        description: 'Inbound access to the PDQ Deploy background service for client consoles'
        direction: 'in'
        enabled: true
        localport: "{{ pdq_deploy_running.server.port }}"
        name: 'PDQ Deploy'
        profiles: [ 'domain', 'private', 'public' ]
        program: "{{ pdq_deploy_running.service_path }}"
        protocol: 'tcp'
        state: 'present'

    #endregion --- [ Process: Open The Firewall For Client Consoles ] ------------------------- #

    #region ------ [ Process: Run The Background Service As The Service Account ] ------------- #
    # The product is installed and licensed by this point, so the service it registered exists
    # and can be pointed at the account the previous regions built. The vendor requires an
    # administrator on the console machine and the SeServiceLogonRight, both of which are already
    # in place. A local account carries the '.\' prefix -- the same convention the product's own
    # console uses when the domain field is left blank. The silent installer leaves the service
    # DISABLED and never started, so the start mode
    # and running state are set here as well, or nothing downstream can restart it and the
    # product never reaches a working state. DELAYED auto-start, not plain auto, because that is
    # what the product's own SetServiceCredentials silently configures (via
    # sc qc; WMI hides the distinction): declaring anything else made every credential recording
    # poison the next converge's comparison, which then "corrected" the mode back and bounced the
    # service once per fresh build. update_password is on_create so a settled
    # host reports ok rather than rewriting the credential every converge; the module sets the
    # password regardless whenever the account itself changes, so the first converge is complete.

    - name: 'PROCESS | Run The Background Service As The Service Account'
      no_log: true
      notify: 'pdq-deploy-restart-required'

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: false
        name: "{{ pdq_deploy_running.service_name }}"
        password: "{{ pdq_deploy_running.service_account.password }}"
        start_mode: 'delayed'
        state: 'started'
        update_password: 'on_create'
        username: ".\\{{ pdq_deploy_running.service_account.name }}"

    # ----------------------------------------------------------------------------------------- #

    # ansible.windows.win_service cannot read a password back to compare, so update_password: always
    # re-asserts the credential every converge and the task honestly reports changed each run. The
    # deploy pipeline's idempotency gate expects exactly these two credential-task changes.
    - name: 'PROCESS | Enforce The Background Service Credential'
      no_log: true

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: false
        name: "{{ pdq_deploy_running.service_name }}"
        password: "{{ pdq_deploy_running.service_account.password }}"
        update_password: 'always'
        username: ".\\{{ pdq_deploy_running.service_account.name }}"

    #endregion --- [ Process: Run The Background Service As The Service Account ] ------------- #

    #region ------ [ Process: Record The Service Credential With The Product ] ---------------- #
    # Setting the account on the Windows service is not enough: the product keeps its OWN record
    # of that credential, and a console finding it absent runs its initialisation wizard even
    # though everything else is configured. On a host built entirely by this
    # role -- the service ran as svc-pdq and the product still had no idea. Only the vendor's
    # command can write it: the value is an encrypted blob, and this is the command whose job
    # that is.
    #
    # The password is fed on STDIN and never appears in an argument. That matters more than it
    # looks: this image audits process creation WITH command lines, so a password passed as
    # -Password is written into Security event 4688 and persists in a log that is usually shipped
    # off the host -- a durable copy of the credential, not a transient one. The tool's own
    # -SecurePassword reads the console directly and fails when input is redirected, so stdin is
    # the only headless path that keeps the secret out of both the process table and the log.
    #
    # -NoRestart because restarting is the next region's job, not this one's; written only when
    # the recorded account differs, because the command always writes and always reports success.

    - name: 'PROCESS | Read The Credential The Product Has Recorded'
      no_log: true
      register: '__pdq_deploy_recorded_account__'

      ansible.windows.win_reg_stat:
        name: 'Background Service Username'
        path: 'HKLM:\SOFTWARE\Admin Arsenal\PDQ Deploy'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Record The Service Credential With The Product'
      no_log: true
      notify: 'pdq-deploy-restart-required'
      when: >-
        __pdq_deploy_recorded_account__.value | default('') | lower | split('\\') | last
        != pdq_deploy_running.service_account.name | lower

      ansible.windows.win_command:
        argv:
          - "{{ pdq_deploy_running.cli_path }}"
          - 'SetServiceCredentials'
          - '-Username'
          - ".\\{{ pdq_deploy_running.service_account.name }}"
          - '-NoRestart'
        stdin: "{{ pdq_deploy_running.service_account.password }}"

    #endregion --- [ Process: Record The Service Credential With The Product ] ---------------- #

    #region ------ [ Process: Apply Any Pending Restart ] ------------------------------------- #
    # Handlers would otherwise run at the very END of the play, after this role's own proofs.
    # Flushing here means the product has already restarted by the time END asks it whether it
    # is licensed and which account it runs as -- so those proofs describe the converged host
    # rather than the one that existed before the bounce.

    - name: 'PROCESS | Apply Any Pending Restart'
      ansible.builtin.meta: 'flush_handlers'

    #endregion --- [ Process: Apply Any Pending Restart ] ------------------------------------- #

    #region ------ [ Process: Authorize The Console Users ] ----------------------------------- #
    # Who may open the console. A silent install authorises no one, and RBAC being off leaves it
    # that way -- the product requires each account or group to be an explicit Console User, not
    # merely a local administrator (PDQ documents this, and it is why an un-listed host opens to no
    # one). Applied through the command line as the service account, the only identity the product
    # answers. -Add reports success whether or not the name was already authorised, so the current
    # list is read first and only missing names are added, keeping the run idempotent. Runs in the
    # command-line zone because the service must be up -- the same reason the settings below do.

    - name: 'PROCESS | Authorize The Console Users'
      become: true
      become_method: 'ansible.builtin.runas'
      become_user: "{{ pdq_deploy_running.service_account.name }}"
      no_log: true
      vars:
        ansible_become_flags: 'logon_type=batch'
        ansible_become_password: "{{ pdq_deploy_running.service_account.password }}"

      block:
        - name: 'PROCESS | Read The Authorized Console Users'
          ansible.windows.win_command:
            argv:
              - "{{ pdq_deploy_running.cli_path }}"
              - 'ConsoleUsers'
          changed_when: false
          check_mode: false
          register: '__pdq_deploy_console_users__'

        - name: 'PROCESS | Add The Console Users The Product Does Not Yet Carry'
          ansible.windows.win_command:
            argv:
              - "{{ pdq_deploy_running.cli_path }}"
              - 'ConsoleUsers'
              - '-Add'
              - "{{ item }}"
          loop: "{{ pdq_deploy_running.console_users }}"
          loop_control:
            label: "{{ item }}"
          # The product lists console users in qualified, cased form -- 'BUILTIN\Administrators'
          # so the bare declared name is compared against each line's
          # last backslash-segment, case-insensitively. Per line, never a substring of the blob, so
          # 'Administrator' is not treated as present just because 'Administrators' is. Without this
          # the qualified echo never matches the bare name and -Add re-runs every converge.
          when: (item | regex_replace('^.*\\\\', '') | lower)
            not in (__pdq_deploy_console_users__.stdout_lines
                    | map('trim') | map('regex_replace', '^.*\\\\', '') | map('lower') | list)
          changed_when: true

    #endregion --- [ Process: Authorize The Console Users ] ----------------------------------- #

    #region ------ [ Process: Apply The Product Settings ] ------------------------------------ #
    # The whole preference tree crosses as ONE parameter, shaped exactly as the console's
    # Preferences window is, and the script owns the routing and the arithmetic: it sets aside
    # the pages other tasks write (the per-user alerts and interface pages, the event-log
    # switches), composes the repository path from this machine's own name and the share the role
    # publishes, and places the backup and verbose-log locations beside the database unless the
    # caller named somewhere else. What the product accepts and drops is still caught by the
    # script's export-verify pass, and censoring is still off because every value here is
    # playbook-tracked.
    #
    # The product answers its own command line only for the account its service runs as -- an
    # administrator and even SYSTEM are refused -- so this runs AS the background service user,
    # whose batch logon the STIG deny rights deliberately leave open. Runs last because the
    # command line needs the service up, which the regions above guarantee. The referenced .ps1
    # is MATERIALIZED from scripts/ by scripts/materialize-role-scripts.sh (the role tracks only
    # files/Set-PdqSetting.ps1.stub); run it before this role.

    - name: 'PROCESS | Apply The Product Settings'
      become: true
      become_method: 'ansible.builtin.runas'
      become_user: "{{ pdq_deploy_running.service_account.name }}"
      no_log: true
      vars:
        ansible_become_flags: 'logon_type=batch'
        ansible_become_password: "{{ pdq_deploy_running.service_account.password }}"

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          Product: 'Deploy'
          CliPath: "{{ pdq_deploy_running.cli_path }}"
          Preference: "{{ pdq_deploy_running.preferences }}"
          DatabaseDrive: "{{ pdq_deploy_running.database.drive }}"
          DatabaseDirectory: "{{ pdq_deploy_running.database.directory }}"
          RepositoryShareName: "{{ pdq_deploy_running.repository.share_name }}"
        script: "{{ lookup('ansible.builtin.file', 'Set-PdqSetting.ps1') }}"

    #endregion --- [ Process: Apply The Product Settings ] ------------------------------------ #

    #region ------ [ Process: Declare The Credentials ] --------------------------------------- #
    # The list is the whole credential store: one invocation writes every declared row, removes
    # every other row, settles its one default, and proves the complete read-back. It runs for an
    # empty list because empty means Deploy holds no credential and takes each target's scan
    # credential from Inventory.
    #
    # Runs AS the background service user for the same reason the settings do -- the product
    # answers its own command line only for the account its service runs as. Passwords reach the
    # script as values and no further: no_log keeps them out of the recap, and the command line
    # takes each on stdin rather than as an argument. The .ps1 is MATERIALIZED from scripts/ by
    # scripts/materialize-role-scripts.sh (the role tracks only files/Set-PdqCredential.ps1.stub).

    - name: 'PROCESS | Declare The Credentials'

      block:

        - name: 'PROCESS | Make The Declared Credentials The Complete Set'
          become: true
          become_method: 'ansible.builtin.runas'
          become_user: "{{ pdq_deploy_running.service_account.name }}"
          no_log: true
          register: '__pdq_deploy_credential__'
          vars:
            ansible_become_flags: 'logon_type=batch'
            ansible_become_password: "{{ pdq_deploy_running.service_account.password }}"

          ansible.windows.win_powershell:
            depth: 3
            error_action: 'stop'
            parameters:
              CliPath: "{{ pdq_deploy_running.cli_path }}"
              CredentialDeclarations: "{{ pdq_deploy_running.credentials | default([], true) }}"
              DatabaseDrive: "{{ pdq_deploy_running.database.drive }}"
              DatabaseDirectory: "{{ pdq_deploy_running.database.directory }}"
              Product: 'Deploy'
            script: "{{ lookup('ansible.builtin.file', 'Set-PdqCredential.ps1') }}"

      rescue:

        - name: 'PROCESS | Stop And Name Why The Credential Set Could Not Be Declared'
          vars:
            __raw__: >-
              {{ (((__pdq_deploy_credential__.error | default([]) | first | default({})).exception
                   | default({})).message | default('', true))
                 | default(ansible_failed_result.msg | default('the credential task failed', true), true) }}
            __secrets__: >-
              {{ ([pdq_deploy_running.service_account.password]
                  + (pdq_deploy_running.credentials | default([], true)
                     | map(attribute='password') | select('defined') | list))
                 | reject('equalto', '') | list | unique(case_sensitive=true) }}

          ansible.builtin.fail:
            msg: >-
              PDQ Deploy could not make the declared credentials authoritative:
              {{ __raw__ | regex_replace('(' ~ (__secrets__ | map('regex_escape') | join('|')) ~ ')', '<redacted>')
                 if __secrets__ | length > 0 else __raw__ }}

    #endregion --- [ Process: Declare The Credentials ] --------------------------------------- #

    #region ------ [ Process: Make The Declared Packages Authoritative ] --------------------- #
    # The XML files are the complete package set. One script reads every declared name in one
    # ExportPackages launch, imports only differing definitions, removes every undeclared package,
    # then reads the set back after mutation. Its result names every applied or removed package.
    # A definition also carries two ids that belong to the console it was exported from -- the
    # collection a condition gates on and the profile a scan step runs -- so the script resolves
    # both from their names on arrival, which is why it is given the scan profile declaration and
    # the other product's command line.
    # The authoritative variable pass follows because an exported package carries variable
    # snapshots; the variable store must have the last word. The .ps1 is materialized from scripts/
    # by scripts/materialize-role-scripts.sh.

    - name: 'PROCESS | Require Every Declared Definition To Be Present'
      vars:
        __found__: "{{ query('ansible.builtin.fileglob', __package_glob__) | map('basename') | sort }}"

      ansible.builtin.assert:
        fail_msg: >-
          The package definitions on disk are not the ones this role declares.
          Declared: {{ pdq_deploy_running.packages | sort | join(', ') | default('(none)', true) }}.
          Found: {{ __found__ | join(', ') | default('(none)', true) }}.
          Because a package the product holds that no definition names is removed, a definition
          that did not arrive would be read as an instruction to delete that package.
        quiet: true
        that:
          - __found__ == (pdq_deploy_running.packages | sort)

    - name: 'PROCESS | Make The Declared Packages Authoritative'
      become: true
      become_method: 'ansible.builtin.runas'
      become_user: "{{ pdq_deploy_running.service_account.name }}"
      no_log: true
      vars:
        ansible_become_flags: 'logon_type=batch'
        ansible_become_password: "{{ pdq_deploy_running.service_account.password }}"

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          Definition: >-
            {{ query('ansible.builtin.file',
                     *(query('ansible.builtin.fileglob', __package_glob__) | sort)) }}
          CliPath: "{{ pdq_deploy_running.cli_path }}"
          InventoryCliPath: "{{ pdq_deploy_running.inventory_cli_path }}"
          ScanProfile: "{{ pdq_deploy_running.scan_profiles }}"
        script: "{{ lookup('ansible.builtin.file', 'Set-PdqPackage.ps1') }}"

    #endregion --- [ Process: Make The Declared Packages Authoritative ] --------------------- #

    #region ------ [ Process: Make The Pinned Variables Authoritative ] ----------------------- #
    # The pinned versions cross as one complete map. One export reads the whole store; the script
    # writes only differing variables, removes undeclared ones, and re-exports after mutation to
    # prove the final values and names. It runs after packages because their exported definitions
    # carry variable snapshots, so this task must have the last word. An empty map means no custom
    # variables. The .ps1 is materialized from scripts/ by scripts/materialize-role-scripts.sh.

    - name: 'PROCESS | Make The Pinned Variables Authoritative'
      become: true
      become_method: 'ansible.builtin.runas'
      become_user: "{{ pdq_deploy_running.service_account.name }}"
      no_log: true
      vars:
        ansible_become_flags: 'logon_type=batch'
        ansible_become_password: "{{ pdq_deploy_running.service_account.password }}"

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          Variable: "{{ pdq_deploy_running.variables }}"
          CliPath: "{{ pdq_deploy_running.cli_path }}"
        script: "{{ lookup('ansible.builtin.file', 'Set-PdqVariable.ps1') }}"

    #endregion --- [ Process: Make The Pinned Variables Authoritative ] ----------------------- #

    #region ------ [ Process: Choose The Event Log Severities ] ------------------------------- #
    # Which severities reach the Windows Application event log. A silent install writes no
    # PDQ Deploy registry at all, so the product's Logging key does not exist until a console
    # first saves the preferences page -- without this, what a server records would depend on
    # whether anyone ever opened a console. All four are written to
    # HKLM:\SOFTWARE\Admin Arsenal\Logging\PDQ Deploy and read back after the converge, so the
    # state is the playbook's whatever the console did or did not do. One action -- choose the
    # severities -- split over a loop because each is its own value.

    - name: 'PROCESS | Choose The Event Log Severities'
      loop:
        - { name: 'Error Enabled', value: "{{ pdq_deploy_running.preferences.logging.record_error }}" }
        - { name: 'Warning Enabled', value: "{{ pdq_deploy_running.preferences.logging.record_warning }}" }
        - { name: 'Info Enabled', value: "{{ pdq_deploy_running.preferences.logging.record_informational }}" }
        - { name: 'Debug Enabled', value: "{{ pdq_deploy_running.preferences.logging.record_debug }}" }
      loop_control:
        label: "{{ item.name }} = {{ item.value }}"
      notify: 'pdq-deploy-restart-required'

      ansible.windows.win_regedit:
        data: "{{ item.value | int }}"
        name: "{{ item.name }}"
        path: 'HKLM:\SOFTWARE\Admin Arsenal\Logging\PDQ Deploy'
        state: 'present'
        type: 'dword'

    #endregion --- [ Process: Choose The Event Log Severities ] ------------------------------- #

    #region ------ [ Process: Choose The Service Manager TCP Behaviour ] ---------------------- #
    # The console's Performance page carries one control that is not the product's at all: how
    # WINDOWS connects to remote service managers, machine-wide. Flipping the radio live shows:
    # Default leaves the value absent, Disabled sets the high bit, and Timeout
    # stores the chosen seconds as milliseconds. Managed here as registry state like the
    # event-log severities, because that is what it is.

    - name: 'PROCESS | Choose The Service Manager TCP Behaviour'
      vars:
        __scm_mode__: "{{ pdq_deploy_running.preferences.performance.service_manager_tcp }}"

      ansible.windows.win_regedit:
        data: >-
          {{ 2147483648 if __scm_mode__ == 'Disabled'
             else pdq_deploy_running.preferences.performance.service_manager_tcp_timeout_seconds
                  | int * 1000 }}
        delete_key: false
        name: 'SCMApiConnectionParam'
        path: 'HKLM:\SYSTEM\CurrentControlSet\Control'
        state: "{{ 'absent' if __scm_mode__ == 'Default' else 'present' }}"
        type: 'dword'

    #endregion --- [ Process: Choose The Service Manager TCP Behaviour ] ----------------------- #

    #region ------ [ Process: Seed The Console Defaults For New Users ] ----------------------- #
    # A few console preferences are per-user: the product writes them to the signed-in user's own
    # hive and nowhere else. A new profile is built from the Default
    # profile, so its hive is seeded through win_regedit's own hive loader -- which loads, writes
    # type-aware and idempotent, and unloads under its own finally, with none of the hand-rolled
    # lifecycle a script would carry. The connection account's profile already exists and cannot
    # inherit the Default, so its own hive is seeded too, but only where the product has never
    # written: a preference someone saved is theirs. The string values (theme, release channel)
    # are seeded only when declared -- an undeclared one is dropped by the reject filter, leaving
    # the product's own first-run choice.
    #
    # The seed rows are composed once below; each of the three tasks derives from that one list,
    # dropping the string rows left undeclared so the product's own first-run choice stands.

    - name: 'PROCESS | Compose The Per-User Console Seed'
      ansible.builtin.set_fact:
        __pdq_deploy_console_seed__:
          - name: 'Disable Splash Screen'
            subkey: 'PDQ Deploy Console\Settings\Startup'
            data: "{{ pdq_deploy_running.preferences.interface.disable_splash_screen | int }}"
            type: 'dword'
          - name: 'Auto Check Enabled'
            subkey: 'PDQ Deploy\AutoUpdateChecker'
            data: "{{ pdq_deploy_running.preferences.alerts.auto_update_check_enabled | int }}"
            type: 'dword'
          - name: 'Show Webcast Alerts'
            subkey: 'PDQ Deploy\AutoUpdateChecker'
            data: "{{ pdq_deploy_running.preferences.alerts.show_webcast_alerts | int }}"
            type: 'dword'
          - name: 'Color Theme'
            subkey: 'PDQ Deploy Console\Settings\Startup'
            data: "{{ pdq_deploy_running.preferences.interface.color_theme | default('', true) }}"
            type: 'string'
          - name: 'ReleaseChannel'
            subkey: 'PDQ Deploy\AutoUpdateChecker'
            data: "{{ pdq_deploy_running.preferences.alerts.release_channel | default('', true) }}"
            type: 'string'

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Seed The Console Defaults For New Users'
      vars:
        __pdq_deploy_console_declared__: "{{ __pdq_deploy_console_seed__ | rejectattr('data', 'equalto', '') | list }}"

      ansible.windows.win_regedit:
        data: "{{ item.data }}"
        hive: 'C:\Users\Default\NTUSER.DAT'
        name: "{{ item.name }}"
        path: 'HKLM:\ANSIBLE\Software\Admin Arsenal\{{ item.subkey }}'
        state: 'present'
        type: "{{ item.type }}"
      loop: "{{ __pdq_deploy_console_declared__ }}"
      loop_control:
        label: "{{ item.subkey }} :: {{ item.name }}"

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Read The Connection Account Console Defaults'
      vars:
        __pdq_deploy_console_declared__: "{{ __pdq_deploy_console_seed__ | rejectattr('data', 'equalto', '') | list }}"
      register: '__pdq_deploy_own_console__'

      ansible.windows.win_reg_stat:
        name: "{{ item.name }}"
        path: 'HKCU:\Software\Admin Arsenal\{{ item.subkey }}'
      loop: "{{ __pdq_deploy_console_declared__ }}"
      loop_control:
        label: "{{ item.subkey }} :: {{ item.name }}"

    # ----------------------------------------------------------------------------------------- #

    - name: 'PROCESS | Seed The Connection Account Where The Product Has Not Written'
      when: not item.exists
      loop: "{{ __pdq_deploy_own_console__.results }}"
      loop_control:
        label: "{{ item.item.subkey }} :: {{ item.item.name }}"

      ansible.windows.win_regedit:
        data: "{{ item.item.data }}"
        name: "{{ item.item.name }}"
        path: 'HKCU:\Software\Admin Arsenal\{{ item.item.subkey }}'
        state: 'present'
        type: "{{ item.item.type }}"

    #endregion --- [ Process: Seed The Console Defaults For New Users ] ------------------------ #

    #region ------ [ Process: Record The Product Registration ] ------------------------------- #
    # A licensed server still greets the first console with a registration popup asking for an
    # email address, and stores the answer as three database rows. This records them ahead of any
    # console, from the address the playbook declares -- which the script proves EQUALS the one
    # inside the licence blob, so the input cannot drift from what the vendor issued. Runs after
    # the settings region for the same reason that region runs last: the database this writes is
    # only guaranteed once the service has started. No become: the row write is a file write and
    # the one command-line call is SystemInfo, a local read needing no console authorisation. The
    # referenced .ps1 is MATERIALIZED from scripts/ by scripts/materialize-role-scripts.sh (the
    # role tracks only files/Set-PdqRegistration.ps1.stub); run it before this role.

    - name: 'PROCESS | Record The Product Registration'
      no_log: true
      ansible.windows.win_powershell:
        depth: 2
        error_action: 'stop'
        parameters:
          Email: "{{ pdq_deploy_running.license_email }}"
          CliPath: "{{ pdq_deploy_running.cli_path }}"
        script: "{{ lookup('ansible.builtin.file', 'Set-PdqRegistration.ps1') }}"

    #endregion --- [ Process: Record The Product Registration ] ------------------------------- #

    #region ------ [ Process: Await The Repository Sync ] ------------------------------------- #
    # The sync started where the repository is prepared has run in the background since; the
    # installation ends when it does, and fails with the sync's own reason when it failed.
    # This role is the playbook's last: every task needing the controller's AWS session has run.
    #
    # Handlers are flushed first, so a restart notified late in this block is applied now rather
    # than after a wait measured in hours.

    - name: 'PROCESS | Apply Any Pending Restart Before Waiting'
      ansible.builtin.meta: 'flush_handlers'

    # ----------------------------------------------------------------------------------------- #
    # The start assertion above has already proved the requested run began after the baseline.
    # Finished means: neither running nor queued and a result other than 0x41301, which Task
    # Scheduler reports while a run is still in progress.
    # Polled every 30 seconds, inside the SSH connection's 60-second persistence, so the polls
    # share one connection; bounded by the task's own time limit, plus five minutes to observe
    # Task Scheduler ending a run that reaches it.

    - name: 'PROCESS | Wait For The Repository Sync To Finish'
      delay: 30
      register: '__pdq_deploy_sync__'
      retries: "{{ __sync_limit_days__ * 2880 + 10 }}"
      until: >-
        __pdq_deploy_sync__.state.status not in ['TASK_STATE_RUNNING', 'TASK_STATE_QUEUED']
        and __pdq_deploy_sync__.state.last_task_result != 0x41301
      when: not ansible_check_mode

      community.windows.win_scheduled_task_stat:
        name: "{{ __sync_task__ }}"
        path: '\'

    # ----------------------------------------------------------------------------------------- #
    # A run that never launched writes no log, and the report must still name its result.

    - name: 'PROCESS | Read The Repository Sync Log'
      failed_when: false
      register: '__pdq_deploy_sync_log__'
      when: not ansible_check_mode

      ansible.builtin.slurp:
        src: "{{ __sync_log__ }}"

    # ----------------------------------------------------------------------------------------- #
    # The result is Task Scheduler's: the process's exit code, or why it never launched as a
    # negative HRESULT, shown here the way Windows prints one. The log is UTF-16, as Windows
    # PowerShell writes a redirect, and is quoted as last written: a run that never launched
    # leaves the previous run's in place. On success its last line is the script's own result, so
    # the change reported is the sync's, and a success whose last line does not parse fails.

    - name: 'PROCESS | Report The Repository Sync Result'
      changed_when: >-
        __pdq_deploy_sync__.state.last_task_result == 0
        and ((__log__ | trim).splitlines() | last | from_json).changed
      vars:
        __log__: >-
          {{ __pdq_deploy_sync_log__.content | default('')
             | b64decode(encoding='utf-16') }}
      when: not ansible_check_mode

      ansible.builtin.assert:
        fail_msg: >-
          The repository sync failed with result
          {{ '0x%08X' | format(__pdq_deploy_sync__.state.last_task_result % 4294967296) }}.
          {{ 'The log as last written: ' ~ (__log__ | trim)
             if __pdq_deploy_sync_log__.content is defined
             else 'No log exists at ' ~ __sync_log__ ~ '.' }}
        quiet: true
        that: [ __pdq_deploy_sync__.state.last_task_result == 0 ]

    #endregion --- [ Process: Await The Repository Sync ] ------------------------------------- #

#endregion --- [ Process: Install PDQ Deploy on Windows ] ------------------------------------- #


#region ------ [ Always: Apply Any Pending Restart ] ------------------------------------------ #
# The flush above is reached only when PROCESS runs to completion. A converge that changed the
# service's configuration and then failed before it would leave the product running its old
# settings -- and the NEXT converge would write nothing, because the values are already correct,
# so it would notify nothing and never restart either. The service would stay stale for good,
# under a run that reports success. This closes that: an 'always' runs even when the block above
# failed, and a handler that already ran is not run again, so a successful converge still
# restarts exactly once. Restart only -- cleanup stays under END.

  # Begin the 'Always' block
  always:

    - name: 'PROCESS | Apply Any Pending Restart Even After A Failure'
      ansible.builtin.meta: 'flush_handlers'

#endregion --- [ Always: Apply Any Pending Restart ] ------------------------------------------ #


#region ------ [ End: Install PDQ Deploy on Windows ] ----------------------------------------- #

- name: 'END | Prove The Result And Clean Up'

  # Begin The 'End' Block
  block:

    #region ------ [ End: Re-Read The Installed Product ] ------------------------------------- #
    # Ungated, so a converged host proves the same state as a freshly built one. This is the same
    # read BEGIN performed, against the same script, so the two cannot disagree about what counts
    # as installed.

    - name: 'END | Re-Read The Installed Product From Add/Remove Programs'
      register: '__pdq_deploy_final_arp__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          DisplayName: "{{ pdq_deploy_running.arp.display_name }}"
          Version: "{{ pdq_deploy_running.installer.version }}"
        script: "{{ lookup('ansible.builtin.file', 'Get-InstalledSoftware.ps1') }}"

    #endregion --- [ End: Re-Read The Installed Product ] ------------------------------------- #

    #region ------ [ End: Prove The Product Is Registered ] ----------------------------------- #
    # Zero entries means the installer reported success without registering the product, which is
    # the failure this postcondition exists to catch: an exit code is the installer's opinion,
    # Add/Remove Programs is the machine's.

    - name: 'END | Prove The Product Is Registered Exactly Once At Or Above The Pin'
      ansible.builtin.assert:
        fail_msg: >-
          Expected '{{ pdq_deploy_running.arp.display_name }}' registered at
          {{ pdq_deploy_running.installer.version }} or above; found
          '{{ __pdq_deploy_final_arp__.result.installed_version }}'. An empty version means
          the installer reported success without registering the product.
        quiet: true
        that: [ not __pdq_deploy_final_arp__.result.action_required ]

    #endregion --- [ End: Prove The Product Is Registered ] ----------------------------------- #

    #region ------ [ End: Prove The Server Is Licensed For Enterprise ] ----------------------- #
    # The registry write is a means, not the goal -- the product either accepts the payload or
    # stays in Free mode, and only the product can say which. SystemInfo is a local read that
    # needs no console authorisation, unlike the commands that talk to the background service.
    # Enterprise also gates Server mode, so a console silently left in Free mode is a broken
    # build, not a lesser one.

    - name: 'END | Read The Licence Mode From The Product'
      changed_when: false
      check_mode: false
      register: '__pdq_deploy_systeminfo__'

      ansible.windows.win_command:
        argv:
          - "{{ pdq_deploy_running.cli_path }}"
          - 'SystemInfo'

    # ----------------------------------------------------------------------------------------- #

    - name: 'END | Prove The Server Is Licensed For Enterprise'
      ansible.builtin.assert:
        fail_msg: >-
          The console is not licensed for Enterprise. SystemInfo reported:
          {{ __pdq_deploy_systeminfo__.stdout | trim }}
        quiet: true
        that: [ __pdq_deploy_systeminfo__.stdout is search('LicenseMode\s*:\s*Enterprise') ]

    #endregion --- [ End: Prove The Server Is Licensed For Enterprise ] ----------------------- #

    #region ------ [ End: Prove The Background Service Exists ] ------------------------------- #
    # The product registers, then its service must exist: a registration without the service is a
    # broken install that would otherwise pass unnoticed until the console failed to start.

    - name: 'END | Prove The Background Service Exists'
      failed_when: (__pdq_deploy_service__.services | default([]) | length) != 1
      register: '__pdq_deploy_service__'

      ansible.windows.win_service_info:
        name: "{{ pdq_deploy_running.service_name }}"

    #endregion --- [ End: Prove The Background Service Exists ] ------------------------------- #

    #region ------ [ End: Prove The Service Runs As The Service Account ] --------------------- #
    # Existing is not enough: the identity is what reads the licence and what reaches the targets,
    # so a service left on its installation default is both unlicensed and unable to deploy
    # while looking perfectly healthy. SCM reports the account in resolved form, MACHINE\name,
    # so the machine half is dropped and the account compared -- that is the half this role
    # sets, and it is what separates svc-pdq from the SYSTEM the installer chose.

    - name: 'END | Prove The Background Service Runs As The Service Account'
      ansible.builtin.assert:
        fail_msg: >-
          '{{ pdq_deploy_running.service_name }}' is running as
          '{{ __pdq_deploy_service__.services[0].username }}', not
          '{{ pdq_deploy_running.service_account.name }}'. The service picks up a new logon
          account only when it restarts, so either the restart was skipped or the account was
          rejected at start.
        quiet: true
        that:
          - __pdq_deploy_service__.services[0].username | lower | split('\\') | last
            == pdq_deploy_running.service_account.name | lower

    #endregion --- [ End: Prove The Service Runs As The Service Account ] --------------------- #

    #region ------ [ End: Prove The Firewall Admits The Running Binary ] ---------------------- #
    # The firewall exception is scoped to the executable service_path names, and nothing else
    # ties that input to reality: point it at the wrong binary and the rule is still written,
    # the service keeps listening, and every console is refused with no error anywhere. The
    # service's own record of its binary is already fetched above, so the input is proven
    # against what is actually running.

    - name: 'END | Prove The Firewall Admits The Running Binary'
      ansible.builtin.assert:
        fail_msg: >-
          The firewall exception admits '{{ pdq_deploy_running.service_path }}' but the
          service runs '{{ __pdq_deploy_service__.services[0].path }}'. Consoles would be
          silently refused: the rule matches a binary that is not the one listening.
        quiet: true
        that:
          - pdq_deploy_running.service_path | lower
            in __pdq_deploy_service__.services[0].path | lower

    #endregion --- [ End: Prove The Firewall Admits The Running Binary ] ---------------------- #

#endregion --- [ End: Install PDQ Deploy on Windows ] ----------------------------------------- #


#region ------ [ Always: Install PDQ Deploy on Windows ] -------------------------------------- #

  # Begin the 'Always' block
  always:

    #region ------ [ Always: Remove The Staged Installer From The Guest ] --------------------- #
    # Gated on the copy having been attempted, so a run that never staged deletes nothing while a
    # partial copy is still cleaned up.

    - name: 'END | Remove The Staged Installer From The Guest'
      when: __pdq_deploy_copied__ is defined and not (__pdq_deploy_copied__ is skipped)

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ pdq_deploy_running.install.staging_dir }}"
        state: 'absent'

    #endregion --- [ Always: Remove The Staged Installer From The Guest ] --------------------- #

    #region ------ [ Always: Remove The Controller Staging Directory ] ------------------------ #

    - name: 'END | Remove The Controller Staging Directory'
      changed_when: false
      check_mode: false
      delegate_to: 'localhost'

      ansible.builtin.file:
        access_time_format: '%Y%m%d%H%M.%S'
        follow: true
        force: false
        modification_time_format: '%Y%m%d%H%M.%S'
        path: "{{ __pdq_deploy_stage__.path }}"
        recurse: false
        state: 'absent'
        unsafe_writes: false

    #endregion --- [ Always: Remove The Controller Staging Directory ] ------------------------ #

#endregion --- [ Always: Install PDQ Deploy on Windows ] -------------------------------------- #
