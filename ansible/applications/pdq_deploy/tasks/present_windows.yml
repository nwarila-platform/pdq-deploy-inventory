# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Installs PDQ Deploy at the pinned version.
#
# BEGIN reads the machine and decides ONE action — install, upgrade, or none. Every later block
# is gated on that decision, so the state is read once and acted on once, and a converged host
# does no work at all.
#
# Everything moves through the runner: the controller fetches the installer and hands it to the
# target, so the guest never receives cloud credentials or any other reach into S3. The digest is
# verified on the guest, because that is the copy that executes.
#
# Install state keys on 'InstallDir', which the vendor removes at uninstall, paired with the
# console version. Not the MSI ProductCode, which changes every release.
#
# Licensing is a separate capability and a separate region.
#
# =========================================================================================== #
---
#region ------ [ Begin ] --------------------------------------------------------------------- #

# Two vendor pages disagree on whether a 64-bit host uses the Wow6432Node path, so both are read.
- name: 'BEGIN | Read Each Candidate Product Key'
  ansible.windows.win_reg_stat:
    path: "{{ __probe_path__ }}"
    name: "{{ pdq_deploy_running.registry.install_marker_value }}"
  loop: "{{ pdq_deploy_running.registry.candidate_paths }}"
  loop_control:
    loop_var: '__probe_path__'
    label: "{{ __probe_path__ }}"
  register: '__pdq_deploy_probe__'
  changed_when: false

- name: 'BEGIN | Refuse An Ambiguous Product State'
  vars:
    __owning__: >-
      {{ __pdq_deploy_probe__.results | selectattr('exists', 'defined')
         | selectattr('exists') | list }}
  ansible.builtin.assert:
    that:
      - __owning__ | length <= 1
    fail_msg: >-
      This machine carries '{{ pdq_deploy_running.registry.install_marker_value }}' under both
      {{ __owning__ | map(attribute='item') | list }}. A native and a redirected product key
      cannot both own the install, and choosing one would be a guess.
    quiet: true

- name: 'BEGIN | Read The Installed Console Version'
  vars:
    __install_dir__: >-
      {{ __pdq_deploy_probe__.results | selectattr('exists', 'defined') | selectattr('exists')
         | map(attribute='value') | list | first | default('') }}
  ansible.windows.win_stat:
    path: "{{ __install_dir__ }}\\{{ pdq_deploy_running.console_executable }}"
  when: __install_dir__ | length > 0
  register: '__pdq_deploy_console__'
  changed_when: false

#endregion --- [ Begin ] --------------------------------------------------------------------- #

#region ------ [ Main ] ---------------------------------------------------------------------- #

- name: 'MAIN | Install PDQ Deploy At The Pinned Version'
  vars:
    __install__: "{{ pdq_deploy_running.install }}"
    __installer_name__: "{{ pdq_deploy_running.installer.path | basename }}"
    __guest_installer__: "{{ __install__.staging_dir }}\\{{ __installer_name__ }}"
    # One decision, made in BEGIN, gating everything below.
    __action_required__: >-
      {{ not (__pdq_deploy_console__.stat.exists | default(false))
         or (__pdq_deploy_console__.stat.version | default('0.0.0.0'))
            is version(pdq_deploy_running.installer.version, '<') }}

  block:

    - name: 'MAIN | Deliver And Install'
      when: __action_required__ | bool
      block:

        - name: 'MAIN | Create The Controller Staging Directory'
          delegate_to: 'localhost'
          ansible.builtin.tempfile:
            state: 'directory'
            prefix: 'pdq-deploy-'
          register: '__pdq_deploy_stage__'
          changed_when: false

        - name: 'MAIN | Fetch The Installer To The Controller'
          delegate_to: 'localhost'
          amazon.aws.s3_object:
            bucket: "{{ pdq_deploy_running.artifact_bucket }}"
            object: "{{ pdq_deploy_running.installer.path }}"
            dest: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"
            mode: 'get'
            overwrite: 'different'

        - name: 'MAIN | Ensure The Guest Staging Directory Exists'
          ansible.windows.win_file:
            path: "{{ __install__.staging_dir }}"
            state: 'directory'

        - name: 'MAIN | Copy The Installer To The Guest'
          ansible.windows.win_copy:
            src: "{{ __pdq_deploy_stage__.path }}/{{ __installer_name__ }}"
            dest: "{{ __guest_installer__ }}"
          register: '__pdq_deploy_copied__'

        # A wrong silent switch can leave the installer waiting on a dialog rather than
        # returning, so the run is bounded and fails inside Ansible while cleanup can still run.
        - name: 'MAIN | Install Silently From The Verified Copy'
          ansible.windows.win_package:
            path: "{{ __guest_installer__ }}"
            arguments: "{{ __install__.silent_argument }}"
            checksum: "{{ pdq_deploy_running.installer.sha256 }}"
            checksum_algorithm: 'sha256'
            expected_return_code: "{{ __install__.success_exit_codes }}"
            state: 'present'
          async: "{{ __install__.timeout_seconds }}"
          poll: 15

    #region ------ [ Main: Postconditions ] ------------------------------------------------ #

    # Outside the action gate, so a converged host proves the same state as a freshly built one.
    - name: 'MAIN | Re-Read Each Candidate Product Key'
      ansible.windows.win_reg_stat:
        path: "{{ __probe_path__ }}"
        name: "{{ pdq_deploy_running.registry.install_marker_value }}"
      loop: "{{ pdq_deploy_running.registry.candidate_paths }}"
      loop_control:
        loop_var: '__probe_path__'
        label: "{{ __probe_path__ }}"
      register: '__pdq_deploy_marker__'
      changed_when: false

    - name: 'MAIN | Assert Exactly One Product Key Owns The Install'
      vars:
        __owning__: >-
          {{ __pdq_deploy_marker__.results | selectattr('exists', 'defined')
             | selectattr('exists') | list }}
      ansible.builtin.assert:
        that:
          - __owning__ | length == 1
        fail_msg: >-
          Expected '{{ pdq_deploy_running.registry.install_marker_value }}' under exactly one of
          {{ pdq_deploy_running.registry.candidate_paths }}; found {{ __owning__ | length }}.
          Zero means the installer reported success without registering the product.
        quiet: true

    - name: 'MAIN | Assert The Installed Version Matches The Pin'
      vars:
        __install_dir__: >-
          {{ __pdq_deploy_marker__.results | selectattr('exists', 'defined')
             | selectattr('exists') | map(attribute='value') | list | first }}
      ansible.windows.win_stat:
        path: "{{ __install_dir__ }}\\{{ pdq_deploy_running.console_executable }}"
      register: '__pdq_deploy_final_console__'
      changed_when: false
      failed_when: >-
        not (__pdq_deploy_final_console__.stat.exists | default(false))
        or (__pdq_deploy_final_console__.stat.version | default(''))
           is version(pdq_deploy_running.installer.version, '<')

    - name: 'MAIN | Assert The Background Service Exists'
      ansible.windows.win_service_info:
        name: "{{ pdq_deploy_running.service_name }}"
      register: '__pdq_deploy_service__'
      changed_when: false
      failed_when: (__pdq_deploy_service__.services | default([]) | length) != 1

    #endregion --- [ Main: Postconditions ] ------------------------------------------------ #

  always:

    # Gated on the copy having been attempted, so a run that never staged deletes nothing while a
    # partial copy is still cleaned up.
    - name: 'CLEANUP | Remove The Staged Installer From The Guest'
      when: __pdq_deploy_copied__ is defined and not (__pdq_deploy_copied__ is skipped)
      ansible.windows.win_file:
        path: "{{ __install__.staging_dir }}"
        state: 'absent'

    - name: 'CLEANUP | Remove The Controller Staging Directory'
      when: __pdq_deploy_stage__ is defined and not (__pdq_deploy_stage__ is skipped)
      delegate_to: 'localhost'
      ansible.builtin.file:
        path: "{{ __pdq_deploy_stage__.path }}"
        state: 'absent'
      changed_when: false

#endregion --- [ Main ] ---------------------------------------------------------------------- #
