# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Validates load-bearing PDQ Deploy configuration after the v3 loader merge.
#
# =========================================================================================== #
---
- name: 'BEGIN | Assert PDQ Deploy Background Service User Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.service_account.name | default('') | string | trim) | length > 0
    fail_msg: >-
      pdq_deploy.service_account.name is REQUIRED. Declare service_account.name in the
      pdq_deploy override dict.
    quiet: true

- name: 'BEGIN | Assert PDQ Deploy Background Service User Password Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  no_log: true
  ansible.builtin.assert:
    that:
      - (config.service_account.password | default(none)) is string
      - (config.service_account.password | default('') | string) | length > 0
    fail_msg: >-
      pdq_deploy.service_account.password is REQUIRED. Declare service_account.password in the
      pdq_deploy override dict.
    quiet: true

- name: 'BEGIN | Assert PDQ Deploy Artifact Bucket Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.deploy_installer.artifact_bucket | default(none)) is string
      - >-
        (config.deploy_installer.artifact_bucket | default('', true) | string | trim)
        | length > 0
    fail_msg: >-
      pdq_deploy.deploy_installer.artifact_bucket is REQUIRED. Declare it in the
      pdq_deploy override dict.
    quiet: true

- name: 'BEGIN | Assert PDQ Deploy License Valid'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __deploy_license_start_marker__: '--- START LICENSE ---'
    __deploy_license_end_marker__: '--- END LICENSE ---'
    __deploy_license_crlf__: "\r\n"
    __deploy_license_cr__: "\r"
    __deploy_license_lf__: "\n"
    __deploy_license_lines__: >-
      {{
        (config.license | default('', true) | string)
        .replace(__deploy_license_crlf__, __deploy_license_lf__)
        .replace(__deploy_license_cr__, __deploy_license_lf__)
        .split(__deploy_license_lf__)
      }}
    __deploy_license_valid__: >-
      {{
        (config.license | default(none)) is string
        and (__deploy_license_lines__
        | select('equalto', __deploy_license_start_marker__) | list | length) == 1
        and (__deploy_license_lines__
        | select('equalto', __deploy_license_end_marker__) | list | length) == 1
        and (__deploy_license_lines__ + [__deploy_license_end_marker__]
        ).index(__deploy_license_end_marker__)
        > (__deploy_license_lines__ + [__deploy_license_start_marker__]
        ).index(__deploy_license_start_marker__) + 1
        and ((__deploy_license_lines__ | list)[
          (((__deploy_license_lines__ | list)
          + [__deploy_license_start_marker__]).index(
          __deploy_license_start_marker__) | int) + 1:
          (((__deploy_license_lines__ | list)
          + [__deploy_license_end_marker__]).index(
          __deploy_license_end_marker__) | int)
        ] | join('') | regex_search('[A-Za-z0-9]')) is not none
      }}
  ansible.builtin.assert:
    that:
      - __deploy_license_valid__
    fail_msg: >-
      pdq_deploy.license is required and must be a string containing exactly one whole-line
      --- START LICENSE --- marker, body content with at least one alphanumeric character, and
      exactly one later whole-line --- END LICENSE --- marker.
    quiet: true
