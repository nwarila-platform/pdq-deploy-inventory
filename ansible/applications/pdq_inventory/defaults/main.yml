# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the PDQ Inventory role. The v3 loader merges the OS overlay
# in vars/ over this map and publishes the result as 'pdq_inventory_running'; tasks read only the
# merged map, never these keys directly.
#
# WHAT BELONGS HERE: values that are universally safe — true for anyone running this role,
# whatever their account, bucket or artifact layout. Product identity, the silent switch, the
# Add/Remove Programs identity the product registers.
#
# WHAT DOES NOT: anything deployment-specific. Artifact locations and secret values change with
# every site. A concrete default for those is not universally safe — it is one site's value wearing
# a default's clothes. The interface declares empty values here; the PLAYBOOK supplies the real
# values where they are visible and changeable. See meta/main.yml and tasks/validate.yml.
#
# =========================================================================================== #
---
pdq_inventory_defaults:

  #region ------ [ Install ] ----------------------------------------------------------------- #

  install:
    # Staging directory on the guest. The installer is removed from here after execution.
    #
    # Genuinely site-specific: application control (AppLocker/WDAC) and endpoint protection are
    # commonly configured to permit execution only from named paths, so a site may have to stage
    # the installer somewhere its security software already trusts. This default suits a host with
    # no such policy; it is expected to be overridden where one exists.
    staging_dir: 'C:\Windows\Temp\pdq-inventory-install'

    # A wrong silent switch can leave the installer waiting on a dialog instead of returning.
    # Bounding it here fails the run inside Ansible rather than hanging the play.
    timeout_seconds: 900

  #endregion --- [ Install ] ----------------------------------------------------------------- #

  #region ------ [ Product identity ] -------------------------------------------------------- #

  # Install state is read from Add/Remove Programs, not from the vendor's own key. The ARP entry
  # carries the version AND the install location, is a documented Windows contract rather than a
  # vendor implementation detail, and is removed on uninstall by definition. The state=absent path
  # reads ARP for its uninstall command, so both directions agree on one source. Where
  # Windows keeps those entries is a property of Windows, not of this deployment, so the script
  # owns the roots outright rather than offering a setting with one correct value.
  # Measured on a converged host 2026-08-22.
  arp:
    display_name: 'PDQ Inventory'

  service_name: 'PDQInventory'

  # Whether console users are authorised individually (RBAC on) rather than by being an
  # administrator (RBAC off). FALSE by default: with it on and no roles yet modelled the product
  # authorises no one, locking every human out of the console, so off is what lets administrators
  # open it. PDQ RBAC is defined in the Inventory console, so a site ready to model roles sets it
  # true and defines those users there. The input is a boolean; the dword the registry stores is
  # the role's business, not the caller's.
  rbac_enabled: false

  # Who may open the console. A silent install authorises no one, and RBAC being off does not change
  # that -- the product still requires an explicit Console User, not merely local administrator
  # rights (measured 2026-08-22: ConsoleUsers empty on a fresh licensed host). Defaults to the
  # built-in Administrators group so any local administrator can open the console; a site models
  # finer access by naming individual accounts instead. Local accounts take the bare name.
  console_users:
    - 'Administrators'

  server:
    # Client consoles reach the background service on this port. The product's own default, measured
    # on a converged host 2026-08-22 (Protocol\ServerPort). A site that must move it overrides this;
    # the MODE itself is not offered, because an all-in-one Central Server is a design invariant of
    # this repository rather than a choice.
    port: 7337

    # Which addresses the server answers consoles on. Null means every address, which is what a
    # host whose address is assigned at launch needs, and what the wizard chooses by default. A
    # site that must bind explicitly supplies a list instead, and the all-addresses flag is
    # cleared for it.
    listen_addresses: null

  # The product's command line, which is how the role asks the product about itself. Hardcoded
  # rather than read from Add/Remove Programs because the path cannot vary: the vendor stub
  # swallows the documented relocation switches (measured 2026-08-18 for the sibling product), so
  # every silent install lands here (measured 2026-08-22). Deriving it would suggest a flexibility
  # that does not exist.
  cli_path: 'C:\Program Files (x86)\Admin Arsenal\PDQ Inventory\PDQInventory.exe'

  # The background service executable, which is what the firewall exception is written for. Same
  # fixed location as the command line above, and fixed for the same reason.
  service_path: 'C:\Program Files (x86)\Admin Arsenal\PDQ Inventory\PDQInventoryService.exe'

  # The pinned custom variables to import, keyed by each application's Add/Remove Programs identity
  # (<Publisher>_<DisplayName>, Title Case, special characters spelled out) with the value being its
  # version. Supplied by the playbook, which hands the SAME map to both products. The declaration
  # is COMPLETE: the import task creates or updates what differs and proves each reads back, and
  # the removal task deletes every custom variable this map does not name, proving each removal
  # from a fresh export. Empty -- the default -- declares that the product holds NO custom
  # variables, which on a fresh install is already true, so the disk role plus this role alone
  # still converges.
  variables: {}

  # Every preference the console shows, organised as its Preferences pages are: a map of PAGES,
  # each holding that page's settings under readable labels. The reader tunes what they can SEE;
  # the role owns where each value actually lives -- most flow through the product's own command
  # line into its database, the four event-log severities are machine registry values, and the
  # per-user alerts/interface preferences are seeded into the Default profile (and the connection
  # account's own, where the product has never written) so consoles start as declared. Values are
  # the product's own measured defaults (ExportSettings, v20.1.8.0, 2026-08-22) -- which, for the
  # settings the vendor publishes guidance on, ARE its best practices: automatic backups on, ten
  # compressed backups kept. Settings the vendor gives no published guidance on stay at the
  # measured default rather than an invented preference. Declared in full so a vendor moving one
  # shows up as a reported change instead of silent drift. A playbook overrides keys; loader merges.
  #
  # One location follows a declared-or-derived rule: the database backup location and the verbose
  # audit log directory are null by default, meaning the role places them beside the database on
  # its dedicated drive; declaring a path overrides that. Not offered at all: the two nested
  # families the export cannot round-trip as scalars (the backup schedule triggers and the Active
  # Directory container list), left to the product's own defaults.
  preferences:
    # Per-user auto-update alerts: written to the signed-in user's hive, seeded for new profiles.
    alerts:
      auto_update_check_enabled: true
      show_webcast_alerts: true
      # null leaves the product's own channel; the value the console writes is Release or Beta.
      release_channel: null
    # disable_splash_screen and color_theme are per-user (seeded like the alerts above);
    # show_collection_item_counts is a database setting applied through the command line.
    interface:
      # Dark for every profile built from the Default one, and for the connection account where
      # the product has never written its own. The console stores the choice as a per-user string,
      # so it is seeded rather than set through the command line like the settings above.
      #
      # A value the console does not recognise is IGNORED rather than rejected -- it simply opens
      # on its own default -- so confirm the console is actually dark after a first sign-in rather
      # than trusting this line.
      color_theme: 'Dark'
      disable_splash_screen: false
      show_collection_item_counts: true
    # The scanner's database backups: on, ten kept, compressed -- the vendor's own recommendation.
    database:
      enable_automatic_backups: true
      backups_to_keep: 10
      compress_backups: true
      # null means: beside the database, on its dedicated drive (<drive>:\<directory>\Backups).
      # Declare a path only to send backups somewhere else.
      backup_location: null
    # Active Directory sync, off by default; the container list it would target is not offered.
    active_directory:
      create_ad_collections: true
      create_group_collections: true
      delete_mode: 'ImportOnly'
      sync_interval: '01:00:00'
      enable_sync: false
      sync_disabled: false
    scanning:
      ping_before_scan: false
      wake_on_lan: false
      cleanup_log_days: 14
      max_stored_scan_output_size: 268435456
    # Unlike PDQ Deploy, the Inventory console exposes no machine-wide service-manager TCP control
    # (measured 2026-08-22: absent from Inventory's settings surface). In the co-located all-in-one
    # the Deploy role owns that one machine-wide value, so Inventory neither sets nor offers it.
    performance:
      total_concurrent_targets: 32
      scan_timeout_minutes: 10
      wmi_timeout_seconds: 90
    logging:
      # The four severities that reach the Windows Application event log are machine registry
      # values (Logging\PDQ Inventory), written directly.
      record_error: true
      record_warning: true
      record_informational: true
      record_debug: false
      # Off by deliberate choice -- data-egress hardening, NOT the product default (true) and not a
      # PDQ recommendation; this deployment minimises what leaves the host.
      send_anonymous_exception_data: false
      audit_keep_days: 30
      verbose_log_to_file: true
      # null means: beside the database, on its dedicated drive (<drive>:\<directory>\Logs) --
      # the same rule as the backup location, because logs grow like backups do. Declare a path
      # only to send them somewhere else.
      verbose_log_directory: null
      archive_log_every: 'Monday'
      archived_logs_to_keep: 4
      use_logging_configuration_file: false
      logging_configuration_file: ''
    # The console's link to a co-located PDQ Deploy: how long deployment history is kept.
    pdq_deploy:
      cleanup_history: false
      cleanup_history_days: 180
    # Heartbeat polling that keeps the online/offline state current.
    heartbeat:
      auto_heartbeat_enabled: true
      heartbeat_interval_seconds: 300
    mail_server:
      enable_ssl: false
      smtp_server: ''
      sender_address: ''
      smtp_user: ''
      oauth2_client_id: ''
      oauth2_tenant_id: ''
      oauth2_redirect_uri: ''
      oauth2_provider: 'Microsoft'
      oauth2_sender: ''
      graph_client_id: ''
      graph_tenant_id: ''
      graph_cloud: 'Azure Public Cloud'
      graph_sender: ''
    printing:
      header_text: ''
      header_alignment: 'Center'
      footer_text: ''
      footer_alignment: 'Center'
      margin_left: 20
      margin_right: 20
      margin_top: 20
      margin_bottom: 20
      in_color: true
    proxy_server:
      use_system_proxy: true
      host_name: ''
      port: 8080
      username: ''
    # Console remote-control launch points; irrelevant to a headless server but declared in full.
    remote_control:
      rdp_full_screen: false
      rdp_height: 768
      rdp_width: 1024
      rdp_port: 3389
      vnc_display_number: 0
      vnc_viewer_path: ''
    # Where the product stages its agent on a target during a scan.
    target_service:
      unc_path: 'ADMIN$\AdminArsenal'
      local_path_of_shared_directory: ''
    # Auto-installing the .NET the scanner needs on targets that lack it.
    software_deployment:
      install_dotnet_automatically: false
      dotnet_installer_path: ''
      dotnet_install_timeout: '00:30:00'
    # Telemetry off, and the first-run consent dialog with it. The two are separate: the first
    # switch is the collection, the second is whether the console still owes the user the dialog
    # that asks about it. Left true, a fresh console opens on that dialog and waits for someone to
    # dismiss it -- on a server nobody signs into, it simply sits there.
    usage_data:
      collect_usage_data: false
      alert_first_time_analytics_dialog: false

  #region ------ [ Installer layout ] -------------------------------------------------------- #

  # The application repository is laid out <vendor>/<application>/<version>/<file>, using the
  # product's real names -- so older builds stay addressable for rollback rather than being
  # overwritten in place. The literal token <version> is replaced with installer.version at fetch
  # time, which is why the playbook supplies only a version and a digest. A repository laid out
  # differently overrides this whole path, with or without the token.
  installer:
    path: 'PDQ.com/PDQ Inventory/<version>/PDQ_Inventory_x86-x64.exe'

  #endregion --- [ Installer layout ] -------------------------------------------------------- #

  #region ------ [ Background service user ] ------------------------------------------------- #

  # Deploy and Inventory are co-located and share ONE Background Service User, so the name is
  # product identity rather than a deployment choice. Its password IS deployment-specific, so the
  # playbook supplies the value after resolving and validating it on the controller.
  #
  # RENAMING does not retire the old account: present converges what is declared and removes
  # nothing, so the previous name survives as a member of Administrators. Retirement is a removal,
  # and removals belong to state=absent -- rename in two steps.
  service_account:
    name: 'svc-pdq'
    password: ''

  #endregion --- [ Background service user ] ------------------------------------------------- #

  #region ------ [ Product licence ] --------------------------------------------------------- #

  # The licence and the email it was issued to are deployment-specific secret values. The
  # playbook resolves and validates them on the controller before this role uses them.
  license_key: ''
  license_email: ''

  #endregion --- [ Product licence ] --------------------------------------------------------- #

  # The product creates its database here the first time the service starts, so the role sets the
  # path before that happens and never has to stop, copy and restart. The DRIVE comes from the
  # playbook -- this role consumes a letter, it does not provision the disk. The folder is not
  # decoration: an ACL belongs on a directory, where it can be set without touching the volume
  # root and the permissions Windows grants there by default. Inventory has no package repository
  # -- it is a scanner, not a deployer -- so no share is published.
  database:
    directory: 'PDQ Inventory'

  #endregion --- [ Product identity ] -------------------------------------------------------- #

  #region ------ [ Declared collections ] ---------------------------------------------------- #
  # The definition files this role expects to find in files/collections/, named so that a missing
  # one is caught. The declaration is COMPLETE at the top level of the collection tree: a
  # top-level collection the product holds that neither this list nor the two vendor-owned sets
  # below account for is removed. Naming them twice is the point: the files say what the
  # collection IS, this list says what must be there, and a converge where they disagree stops
  # instead of deleting. An EMPTY list is how a caller states that this repository owns no
  # collections. Ownership stops at the top level on purpose: something hand-added INSIDE a
  # declared or built-in tree is left standing, stated here so nobody reads the prune as deeper
  # than it is.
  # The collections the PRODUCT ships and owns. They are top-level and typed DynamicCollection,
  # exactly like the ones this repository declares, and nothing in the database distinguishes
  # them: LibraryCollectionId is null for both, and several are created at install time so their
  # age does not separate them either (measured 2026-08-28 on a converged 20.1.8.0 host). Listing
  # them is therefore the only way the prune can tell the product's own furniture from drift.
  # A name here must never also appear in `collections` -- the remover refuses that overlap.
  built_in_collections:
    - 'Allow Scan'
    - 'Internet Explorer'
    - 'Memory'
    - 'Microsoft .NET Framework 4.7.2+'
    - 'Microsoft Office'
    - 'Non-Standard Shares'
    - 'Online Systems'
    - 'PowerShell'
    - 'Reboot Required'
    - 'Reboot Timeline'
    - 'Requires .NET to Scan'
    - 'Servers'
    - 'Systems with Smart Card Readers'
    - 'Workstations'

  collections:
    - 'Chrome Below Pinned Version.xml'
    - 'Microsoft Corporation_ Microsoft OpenJDK 11.xml'
    - 'Microsoft Corporation_ Microsoft OpenJDK 17.xml'
    - 'Microsoft Corporation_ Microsoft OpenJDK 21.xml'
    - 'Microsoft Corporation_ Microsoft OpenJDK 25.xml'
    - 'Microsoft Corporation_ PowerShell 7.xml'
    - 'Mozilla_ Mozilla Firefox ESR.xml'
    - 'NodeJS Foundation_ Node.JS 21.xml'
    - 'NodeJS Foundation_ Node.JS 22.xml'
    - 'NodeJS Foundation_ Node.JS 24.xml'
    - 'NodeJS Foundation_ Node.JS 25.xml'
    - 'Prometheus Community_ Windows Exporter.xml'
    - 'Python Software Foundation_ Python 3.10.xml'
    - 'Python Software Foundation_ Python 3.11.xml'
    - 'Python Software Foundation_ Python 3.12.xml'
    - 'Python Software Foundation_ Python 3.13.xml'
    - 'Python Software Foundation_ Python 3.14.xml'

  #endregion --- [ Declared collections ] ---------------------------------------------------- #
