# =========================================================================================== #
# File: '{{ role_path }}/meta/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Role metadata for pdq_inventory. Description-only (style guide 8): NOT an enforcing argument
# spec. The role's tasks/validate.yml enforces its merged-config guards.
#
# REQUIRED INPUTS — declared empty in defaults and supplied by the playbook.
#
# These are deployment-specific: the installer bucket carries an account id, while licence and
# account values change with every site. Concrete defaults would ship one site's values as if they
# were universally safe, so the playbook states them where a reader can see what is installed.
#
#   pdq_inventory.installer.bucket  S3 bucket holding the installer (the application repository).
#   pdq_inventory.installer.path    Object key of the PDQ Inventory installer.
#   pdq_inventory.installer.version Four-part product version the installer delivers; the role
#                                   compares it against the installed console to stay idempotent.
#   pdq_inventory.installer.sha256  Lowercase 64-character digest of that object. Verified on the
#                                   GUEST immediately before execution — the copy that actually runs.
#   pdq_inventory.license_key       Decoded licence value, verified by its controller-side lookup.
#   pdq_inventory.license_email       Address the licence was issued to, resolved by the same lookup.
#   pdq_inventory.service_account.password  Shared service-account password resolved by lookup.
#   pdq_inventory.database.drive    Drive letter the dedicated database volume is mounted at on the
#                                   guest; the role consumes the letter, it does not provision the disk.
# The playbook resolves secret values on the CONTROLLER. The guest is never given cloud credentials.
# =========================================================================================== #
---
galaxy_info:
  role_name: 'pdq_inventory'
  namespace: 'nwarila_platform'
  author: 'nwarila-platform'
  description: >-
    PDQ Inventory installation for Windows Server. Fetches the pinned installer from S3 through the
    controller, verifies its digest on the guest before executing it, and installs silently.
    Idempotent on the install marker the vendor removes at uninstall, paired with the installed
    console version. Applies the pinned licence and proves Enterprise mode as part of the converge.
  license: 'MIT'
  min_ansible_version: '2.17'
  platforms:
    - name: 'Windows'
      versions:
        - '2025'
  galaxy_tags: ['windows', 'pdq', 'inventory', 'software', 'audit']

dependencies: []
