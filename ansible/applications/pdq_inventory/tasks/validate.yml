# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Validates load-bearing PDQ Inventory configuration after the v3 loader merge, on the CONTROLLER,
# before anything touches the guest. The artifact inputs are supplied by the playbook rather than
# defaulted, so this is where a missing or malformed one is caught — in a second, rather than
# mid-converge at the cost of an instance.
#
# meta/main.yml describes these inputs; this file is what enforces them.
#
# =========================================================================================== #
---
- name: 'VALIDATE | Require The Inputs Every State Uses'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.arp.display_name | default('') | length > 0
      - pdq_inventory_running.installer.version | default('') is match('^[0-9]+(\\.[0-9]+){3}$')
      - pdq_inventory_running.install.staging_dir is match('^[A-Za-z]:\\\\')
    fail_msg: >-
      Refusing to continue: arp.display_name, a four-part installer.version, and an absolute,
      drive-letter-rooted Windows install.staging_dir are required for every state. See
      meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require The Artifact Source And Deployment Inputs'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.installer.bucket | default('') | length > 0
      - pdq_inventory_running.installer.path | default('') | length > 0
      - pdq_inventory_running.installer.sha256 | default('') is match('^[0-9a-f]{64}$')
      # The service account logs on as '.\name' -- Windows' own spelling for a local account --
      # and its password cannot be empty, because the role sets it on every converge.
      - pdq_inventory_running.service_account.username | default('') is match('^\.\\\\[^\\\\]+$')
      - pdq_inventory_running.service_account.password | default('') | length > 0
      # The previous contract spelled these differently, and the merge keeps an old key beside
      # the new default rather than replacing it -- so a declaration in the old shape would pass
      # and be silently ignored. Refused by name instead.
      - pdq_inventory_running.service_account.name is not defined
      - pdq_inventory_running.credential is not defined
      - pdq_inventory_running.database.drive | default('') is match('^[A-Za-z]$')
    fail_msg: >-
      Refusing to deploy: a required input is missing or malformed. The playbook must supply the
      installer (bucket, path, four-part version, lowercase 64-char sha256); the service-account
      name; and one drive letter for the database. Secret values are resolved and validated by the
      controller lookup before the role runs. The installer is verified against its pinned digest
      before use. See meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require The Product Identity Probes'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.service_name | default('') | length > 0
      - pdq_inventory_running.rbac_enabled is boolean
      - pdq_inventory_running.preferences.logging.record_error is boolean
      - pdq_inventory_running.preferences.logging.record_warning is boolean
      - pdq_inventory_running.preferences.logging.record_informational is boolean
      - pdq_inventory_running.preferences.logging.record_debug is boolean
      - pdq_inventory_running.preferences.interface.disable_splash_screen is boolean
      - pdq_inventory_running.preferences.alerts.auto_update_check_enabled is boolean
      - pdq_inventory_running.preferences.alerts.show_webcast_alerts is boolean
      - pdq_inventory_running.server.port | int > 0
      - pdq_inventory_running.server.port | int < 65536
      - pdq_inventory_running.server.listen_addresses is none
        or (pdq_inventory_running.server.listen_addresses is sequence
            and pdq_inventory_running.server.listen_addresses is not string)
      - pdq_inventory_running.cli_path | default('') is match('^[A-Za-z]:\\\\')
      - pdq_inventory_running.service_path | default('') is match('^[A-Za-z]:\\\\')
      - pdq_inventory_running.preferences is mapping
      - pdq_inventory_running.preferences | dict2items | rejectattr('value', 'mapping')
        | list | length == 0
      - pdq_inventory_running.variables is mapping
      - pdq_inventory_running.variables | dict2items | rejectattr('value', 'string')
        | list | length == 0
      - pdq_inventory_running.install.timeout_seconds | int > 0
      - pdq_inventory_running.database.directory | default('') is match('^[^\\\\/:]+$')
      - (pdq_inventory_running.server.listen_addresses or [])
        | reject('match', '.+') | list | length == 0
      - pdq_inventory_running.console_users is sequence
      - pdq_inventory_running.console_users is not string
    fail_msg: >-
      Refusing to deploy: an identity, layout, or preference input is missing or malformed. The
      product's display and service names, its command-line and service paths, the install timeout,
      the database directory name, and the server port must all be present and well formed.
      Preferences must be a map of pages; its logging-severity and per-user seed booleans must hold
      the shapes the role writes; the pinned variables must be a map of string values; and
      console_users must be a list of names. See meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require Credentials The Product Can Settle On'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __credentials__: "{{ pdq_inventory_running.credentials | default([], true) }}"
    __usernames__: "{{ __credentials__ | map(attribute='username') | select('defined') | list }}"
  ansible.builtin.assert:
    that:
      - __credentials__ is sequence
      - __credentials__ is not string
      # The product keys a credential on its username and holds no separate name, so an entry
      # without one names no account -- and two entries naming the SAME account are two writes to
      # one row, where the second silently wins.
      - __credentials__ | rejectattr('username', 'defined') | list | length == 0
      - __usernames__ | reject('match', '.+') | list | length == 0
      # Compared exactly: the product has held 'TCN\\x' and 'tcn\\x' as two rows, and the default
      # comparison would fold them into one and refuse a declaration the product accepts.
      - __usernames__ | length == __usernames__ | unique(case_sensitive=true) | list | length
      # Each entry carries the secret that opens its account -- the product would store an empty
      # one -- and says whether it is the default as a boolean, because the script reads a
      # string 'false' as true.
      - __credentials__ | map(attribute='password', default='') | reject('match', '.+') | list
        | length == 0
      - __credentials__ | selectattr('is_default', 'defined') | map(attribute='is_default')
        | reject('boolean') | list | length == 0
      # EXACTLY one entry claims the default when any are declared. Two would take the flag from
      # each other on every converge and never settle; none would leave whichever the product
      # wrote last holding it, which is the write order deciding rather than the declaration.
      - __credentials__ | length == 0 or
        (__credentials__ | selectattr('is_default', 'defined') | selectattr('is_default')
         | list | length == 1)
    fail_msg: >-
      Refusing to deploy: the declared credentials are not something the product can settle on.
      Each entry must name a username and carry a non-empty password, and no two may name the same
      account -- the product keys a credential on its username and holds no separate name, so a
      repeat is a second write to the same row. is_default, where stated, is a boolean, and when
      any credential is declared exactly one claims it: the product marks whichever credential was
      written last as its default, so two claimants would take the flag from each other on every
      converge and none would leave write order deciding.
    quiet: true

- name: 'VALIDATE | Require A Directory Sync Delete Mode The Product Recognises'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.preferences.active_directory.delete_mode | default('')
        in ['ImportOnly', 'MixedSync', 'FullSync']
    fail_msg: >-
      Refusing to deploy: preferences.active_directory.delete_mode is
      '{{ pdq_inventory_running.preferences.active_directory.delete_mode | default('') }}', which
      the product does not recognise. It takes exactly one of ImportOnly (add computers the
      directory holds, never remove), MixedSync, or FullSync (make the product match the directory,
      removing what the directory no longer holds). The three names are the product's own, spelled
      as its ADSyncDeleteMode enumeration spells them; a value it does not recognise is ignored
      rather than rejected, so the console would sync on a mode nobody chose.
    quiet: true

- name: 'VALIDATE | Require A Directory Sync Declaration The Product Can Act On'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __sync__: "{{ pdq_inventory_running.directory_sync | default({}, true) }}"
    __containers__: "{{ __sync__.containers | default([], true) }}"
    __credentials__: "{{ pdq_inventory_running.credentials | default([], true) }}"
    __usernames__: "{{ __credentials__ | map(attribute='username') | select('defined') | list }}"
    # The declared entry the containers bind through, if this run declares it at all.
    __credential__: >-
      {{ __credentials__ | selectattr('username', 'defined')
         | selectattr('username', 'equalto', __sync__.bind_username | default('', true))
         | first | default({}, true) }}
  ansible.builtin.assert:
    that:
      # A container list needs somewhere to bind and something to bind as; without both the
      # product would hold containers it can never read.
      - __containers__ | length == 0 or
        (__sync__.realm | default('') | length > 0 and
         __sync__.bind_username | default('') | length > 0)
      # The bind account must be AMONG the declared credentials: the role hands the script that
      # list and nothing else holds the secret it reads the directory with, so a bind the product
      # already holds but this declaration does not is still one the script cannot perform.
      - __containers__ | length == 0 or
        (__sync__.bind_username | default('', true)) in __usernames__
      # And that entry must be ORDINARY. The role reads the directory with the password from this
      # entry, and a LAPS credential resolves to some target's local administrator -- an account no
      # directory has heard of -- so the bind would fail on every run.
      - __credential__ | length == 0 or
        __containers__ | length == 0 or
        __credential__.laps_user | default('') | length == 0
      # A container binding as a different account NAMES it, and the name must be one of the
      # declared credentials -- the role hands the script that list and nothing else holds the
      # secret. It must be ordinary too, for the reason above.
      - __containers__ | selectattr('bind_username', 'defined') | map(attribute='bind_username')
        | reject('in', __usernames__) | list | length == 0
      - __credentials__ | selectattr('laps_user', 'defined') | rejectattr('laps_user', 'equalto', '')
        | map(attribute='username') | list
        | select('in', __containers__ | selectattr('bind_username', 'defined') | map(attribute='bind_username') | list)
        | list | length == 0
      # No password is ever stated here. The product points a container at a credential row by
      # id, and this declaration points at one by name; a password beside the name would be a
      # second copy of a secret that already lives in the credential it names.
      - __sync__.bind_password is not defined
      - __containers__ | selectattr('bind_password', 'defined') | list | length == 0
      # Every container is a distinguished name plus the two flags the product stores. The flags
      # are booleans, because the script reads a string 'false' as true; so is insecure.
      - __containers__ | rejectattr('distinguished_name', 'defined') | list | length == 0
      - __containers__ | map(attribute='distinguished_name') | map('trim') | reject('match', '.+')
        | list | length == 0
      - __containers__ | rejectattr('include', 'defined') | list | length == 0
      - __containers__ | rejectattr('subtree', 'defined') | list | length == 0
      - __containers__ | map(attribute='include') | reject('boolean') | list | length == 0
      - __containers__ | map(attribute='subtree') | reject('boolean') | list | length == 0
      - __sync__.insecure is not defined or __sync__.insecure is boolean
      # One row per distinguished name. Two entries naming the same one would each write the
      # row on alternate runs and never settle.
      - __containers__ | map(attribute='distinguished_name') | list | length ==
        __containers__ | map(attribute='distinguished_name') | unique(case_sensitive=true) | list
        | length
      # A container may sync from a directory other than the one the declaration names, and then
      # its realm must actually name one.
      - __containers__ | selectattr('realm', 'defined') | map(attribute='realm') | map('trim')
        | reject('match', '.+') | list | length == 0
      # The script frames its read-back with '|' and lines; a name carrying either could never
      # read back equal and would report a change forever.
      - (__containers__ | map(attribute='distinguished_name') | list
         + [__sync__.realm | default('', true)]
         + (__containers__ | selectattr('realm', 'defined') | map(attribute='realm') | list))
        | select('search', '[|\r\n]') | list | length == 0
      # FullSync deletes every computer outside an Include container (vendor documentation). A
      # declaration that names containers but includes none of them empties the database on the
      # first sync. An EMPTY declaration is not caught here because it cannot be told from a
      # deployment that has never had containers; the script never starts a sync for it, and
      # withdrawing the last container is documented as a change of delete_mode first.
      - __containers__ | length == 0 or
        (pdq_inventory_running.preferences.active_directory.delete_mode | default('') != 'FullSync') or
        (__containers__ | selectattr('include', 'defined') | selectattr('include') | list | length > 0)
    fail_msg: >-
      Refusing to deploy: the directory sync declaration is one the product cannot act on.
      Containers require a realm and a bind username; each container requires a distinguished_name
      no other container repeats and boolean include and subtree flags, and a container naming its
      own realm must name a non-empty one; no name may carry a pipe or a line break. Every bind
      account -- the declaration's and any container's own -- is NAMED, never restated: it must be
      one of the declared credentials and must not be a LAPS one, because the script is handed that
      list and resolves the secret by name, and a LAPS credential resolves to a target's local
      administrator instead of a directory account. A bind_password anywhere in the declaration is
      refused: the secret lives in the credential the name points at. With delete_mode FullSync at
      least one container must be included: FullSync removes every computer that is not inside an
      Include container, so a list of exclusions alone would empty the database on the first sync.
    quiet: true
