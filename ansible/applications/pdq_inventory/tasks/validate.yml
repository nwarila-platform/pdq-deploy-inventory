# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Validates load-bearing PDQ Inventory configuration after the v3 loader merge.
#
# =========================================================================================== #
---
- name: 'BEGIN | Assert PDQ Inventory Background Service User Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.service_account.name | default('') | string | trim) | length > 0
    fail_msg: >-
      pdq_inventory.service_account.name is REQUIRED. Declare service_account.name in the
      pdq_inventory override dict.
    quiet: true

- name: 'BEGIN | Assert PDQ Inventory Artifact Bucket Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.inventory_installer.artifact_bucket | default(none)) is string
      - >-
        (config.inventory_installer.artifact_bucket | default('', true) | string | trim)
        | length > 0
    fail_msg: >-
      pdq_inventory.inventory_installer.artifact_bucket is REQUIRED. Declare it in the
      pdq_inventory override dict.
    quiet: true

- name: 'BEGIN | Assert PDQ Inventory License Valid'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __inventory_license_start_marker__: '--- START LICENSE ---'
    __inventory_license_end_marker__: '--- END LICENSE ---'
    __inventory_license_crlf__: "\r\n"
    __inventory_license_cr__: "\r"
    __inventory_license_lf__: "\n"
    __inventory_license_lines__: >-
      {{
        (config.license | default('', true) | string)
        .replace(__inventory_license_crlf__, __inventory_license_lf__)
        .replace(__inventory_license_cr__, __inventory_license_lf__)
        .split(__inventory_license_lf__)
      }}
    __inventory_license_valid__: >-
      {{
        (config.license | default(none)) is string
        and (__inventory_license_lines__
        | select('equalto', __inventory_license_start_marker__) | list | length) == 1
        and (__inventory_license_lines__
        | select('equalto', __inventory_license_end_marker__) | list | length) == 1
        and (__inventory_license_lines__ + [__inventory_license_end_marker__]
        ).index(__inventory_license_end_marker__)
        > (__inventory_license_lines__ + [__inventory_license_start_marker__]
        ).index(__inventory_license_start_marker__) + 1
        and ((__inventory_license_lines__ | list)[
          (((__inventory_license_lines__ | list)
          + [__inventory_license_start_marker__]).index(
          __inventory_license_start_marker__) | int) + 1:
          (((__inventory_license_lines__ | list)
          + [__inventory_license_end_marker__]).index(
          __inventory_license_end_marker__) | int)
        ] | join('') | trim | length) > 0
      }}
  ansible.builtin.assert:
    that:
      - __inventory_license_valid__
    fail_msg: >-
      pdq_inventory.license is required and must be a string containing exactly one whole-line
      --- START LICENSE --- marker, non-blank body content, and exactly one later whole-line
      --- END LICENSE --- marker.
    quiet: true
