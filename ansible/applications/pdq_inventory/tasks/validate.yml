# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Validates load-bearing PDQ Inventory configuration after the v3 loader merge, on the CONTROLLER,
# before anything touches the guest. The artifact inputs are supplied by the playbook rather than
# defaulted, so this is where a missing or malformed one is caught — in a second, rather than
# mid-converge at the cost of an instance.
#
# meta/main.yml describes these inputs; this file is what enforces them.
#
# =========================================================================================== #
---
- name: 'VALIDATE | Require The Inputs Every State Uses'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.arp.display_name | default('') | length > 0
      - pdq_inventory_running.installer.version | default('') is match('^[0-9]+(\\.[0-9]+){3}$')
      - pdq_inventory_running.install.staging_dir is match('^[A-Za-z]:\\\\')
    fail_msg: >-
      Refusing to continue: arp.display_name, a four-part installer.version, and an absolute,
      drive-letter-rooted Windows install.staging_dir are required for every state. See
      meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require The Artifact Source And Deployment Inputs'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.installer.bucket | default('') | length > 0
      - pdq_inventory_running.installer.path | default('') | length > 0
      - pdq_inventory_running.installer.sha256 | default('') is match('^[0-9a-f]{64}$')
      - pdq_inventory_running.service_account.name | default('') | length > 0
      - pdq_inventory_running.database.drive | default('') is match('^[A-Za-z]$')
    fail_msg: >-
      Refusing to deploy: a required input is missing or malformed. The playbook must supply the
      installer (bucket, path, four-part version, lowercase 64-char sha256); the service-account
      name; and one drive letter for the database. Secret values are resolved and validated by the
      controller lookup before the role runs. The installer is verified against its pinned digest
      before use. See meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require The Product Identity Probes'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.service_name | default('') | length > 0
      - pdq_inventory_running.rbac_enabled is boolean
      - pdq_inventory_running.preferences.logging.record_error is boolean
      - pdq_inventory_running.preferences.logging.record_warning is boolean
      - pdq_inventory_running.preferences.logging.record_informational is boolean
      - pdq_inventory_running.preferences.logging.record_debug is boolean
      - pdq_inventory_running.preferences.interface.disable_splash_screen is boolean
      - pdq_inventory_running.preferences.alerts.auto_update_check_enabled is boolean
      - pdq_inventory_running.preferences.alerts.show_webcast_alerts is boolean
      - pdq_inventory_running.server.port | int > 0
      - pdq_inventory_running.server.port | int < 65536
      - pdq_inventory_running.server.listen_addresses is none
        or (pdq_inventory_running.server.listen_addresses is sequence
            and pdq_inventory_running.server.listen_addresses is not string)
      - pdq_inventory_running.cli_path | default('') is match('^[A-Za-z]:\\\\')
      - pdq_inventory_running.service_path | default('') is match('^[A-Za-z]:\\\\')
      - pdq_inventory_running.preferences is mapping
      - pdq_inventory_running.preferences | dict2items | rejectattr('value', 'mapping')
        | list | length == 0
      - pdq_inventory_running.variables is mapping
      - pdq_inventory_running.variables | dict2items | rejectattr('value', 'string')
        | list | length == 0
      - pdq_inventory_running.install.timeout_seconds | int > 0
      - pdq_inventory_running.database.directory | default('') is match('^[^\\\\/:]+$')
      - (pdq_inventory_running.server.listen_addresses or [])
        | reject('match', '.+') | list | length == 0
      - pdq_inventory_running.console_users is sequence
      - pdq_inventory_running.console_users is not string
    fail_msg: >-
      Refusing to deploy: an identity, layout, or preference input is missing or malformed. The
      product's display and service names, its command-line and service paths, the install timeout,
      the database directory name, and the server port must all be present and well formed.
      Preferences must be a map of pages; its logging-severity and per-user seed booleans must hold
      the shapes the role writes; the pinned variables must be a map of string values; and
      console_users must be a list of names. See meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require Credentials The Product Can Settle On'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __credentials__: "{{ pdq_inventory_running.credentials | default({}, true) }}"
  ansible.builtin.assert:
    that:
      - __credentials__ is mapping
      # The product keys a credential on its username, which is why the declaration does too: an
      # empty key names no account, and two entries cannot name the same one.
      - __credentials__ | list | reject('match', '.+') | list | length == 0
      # At most one entry may claim the default. Two would take the flag from each other on every
      # converge and never settle, reporting a change the pipeline could not stop making.
      - __credentials__ | dict2items | map(attribute='value')
        | selectattr('is_default', 'defined') | selectattr('is_default') | list | length <= 1
    fail_msg: >-
      Refusing to deploy: the declared credentials are not something the product can settle on.
      They are a map keyed by the account each one opens, so a key must name an account. At most
      one entry may claim is_default, because the product marks whichever credential was written
      last as its default: two claimants would take the flag from each other on every converge and
      report a change forever.
    quiet: true

- name: 'VALIDATE | Require A Directory Sync Delete Mode The Product Recognises'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - pdq_inventory_running.preferences.active_directory.delete_mode | default('')
        in ['ImportOnly', 'MixedSync', 'FullSync']
    fail_msg: >-
      Refusing to deploy: preferences.active_directory.delete_mode is
      '{{ pdq_inventory_running.preferences.active_directory.delete_mode | default('') }}', which
      the product does not recognise. It takes exactly one of ImportOnly (add computers the
      directory holds, never remove), MixedSync, or FullSync (make the product match the directory,
      removing what the directory no longer holds). The three names are the product's own, spelled
      as its ADSyncDeleteMode enumeration spells them; a value it does not recognise is ignored
      rather than rejected, so the console would sync on a mode nobody chose.
    quiet: true

- name: 'VALIDATE | Require A Directory Sync Declaration The Product Can Act On'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __sync__: "{{ pdq_inventory_running.directory_sync | default({}, true) }}"
    __containers__: "{{ __sync__.containers | default([], true) }}"
    __credentials__: "{{ pdq_inventory_running.credentials | default({}, true) }}"
    # The declared entry the containers bind through, if this run declares it at all.
    __credential__: "{{ __credentials__[__sync__.bind_username | default('', true)] | default({}, true) }}"
  ansible.builtin.assert:
    that:
      # A container list needs somewhere to bind and something to bind as; without all three the
      # product would hold containers it can never read.
      - __containers__ | length == 0 or
        (__sync__.realm | default('') | length > 0 and
         __sync__.bind_username | default('') | length > 0 and
         __sync__.bind_password | default('') | length > 0)
      # The bind account must be AMONG the declared credentials, or the product would bind through
      # a row this run never wrote and the sync would run as somebody else. Declaring none at all
      # is left alone deliberately -- the defaults say that keeps whatever the product holds, and
      # the sync script fails clearly and by name if what it holds cannot bind.
      - __containers__ | length == 0 or
        __credentials__ | length == 0 or
        (__sync__.bind_username | default('', true)) in __credentials__
      # And that entry must carry the same secret and be ORDINARY: the playbook reads the directory
      # with the declared bind values while the product binds through its stored row, so a pair
      # that disagrees converges and then syncs as somebody else -- and a LAPS credential resolves
      # to some target's local administrator, an account no directory has heard of.
      - __credential__ | length == 0 or
        __containers__ | length == 0 or
        (__credential__.password == (__sync__.bind_password | default('')) and
         (__credential__.laps_user | default('') | length == 0))
      # Every container is a distinguished name plus the two flags the product stores.
      - __containers__ | rejectattr('distinguished_name', 'defined') | list | length == 0
      - __containers__ | selectattr('distinguished_name', 'eq', '') | list | length == 0
      # FullSync deletes every computer outside an Include container. A declaration that names
      # containers but includes none of them empties the database on the first sync.
      - __containers__ | length == 0 or
        (pdq_inventory_running.preferences.active_directory.delete_mode | default('') != 'FullSync') or
        (__containers__ | selectattr('include', 'defined') | selectattr('include') | list | length > 0)
    fail_msg: >-
      Refusing to deploy: the directory sync declaration is one the product cannot act on.
      Containers require a realm, a bind username and a bind password, and each container requires
      a distinguished_name. When credentials are declared alongside them, the bind account must be
      one of them, carrying the same password and no laps_user: the product binds through the
      credential row it stores while this playbook reads the directory with the declared bind
      values, and a LAPS credential resolves to a target's local administrator instead of a
      directory account. With delete_mode FullSync at least one container must be included:
      FullSync removes every computer that is not inside an Include container, so a list of
      exclusions alone would empty the database on the first sync.
    quiet: true
