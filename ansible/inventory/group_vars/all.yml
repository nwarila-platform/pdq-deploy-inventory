---
# What every play in this deployment needs to agree on, and cannot agree on any other way: a play's
# vars are visible only to that play.
#
# This directory's base, which every OU in every play is written relative to. Named once here
# because three plays need the same one -- the play that files the server, the play that files the
# target, and the play that tells PDQ which containers to sync -- and a play's vars reach none of
# the others. Moving the deployment to another directory is this one edit.
domain_base_dn: 'DC=tcn,DC=trinitytechnicalservices,DC=com'

# The same directory by its DNS name, which is what a join and a directory bind are addressed to.
domain_realm: 'tcn.trinitytechnicalservices.com'

# The account that joins both hosts to the directory, and its password -- resolved on the controller
# at the moment of use and verified against its digest, so a replaced object fails at the read
# rather than at the join. Both plays that build a host need it, so the object and its digest are
# stated here once and a rotation is one edit.
domain_join_user: "svc-domainjoin@{{ domain_realm }}"
domain_join_password: >-
  {{ lookup('secret',
            's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/svc-domainjoin-password.txt',
            '07493ed779c2962bff0b5e19cfa00b8cdb95defcf477f6b5bac36ddef55087ae') }}
