---
# What every play in this deployment needs to agree on, and cannot agree on any other way: a play's
# vars are visible only to that play.
#
# This directory's base, which every OU in every play is written relative to. Named once here
# because three plays need the same one -- the play that files the server, the play that files the
# target, and the play that tells PDQ which containers to sync -- and a play's vars reach none of
# the others. Moving the deployment to another directory is this one edit.
domain_base_dn: 'DC=tcn,DC=trinitytechnicalservices,DC=com'
