# =========================================================================================== #
# File: 'ansible/inventory/vmware.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# DEV inventory for the current PDQ target.
#
# Auth: SSH key supplied by the controller's persistent ssh-agent; no key path or password
# belongs in this file.
#
# The pdq_servers group contains the PDQ dev host (pdq-dev), with its own static IP
# 192.168.0.182 and generated MAC. The windows-wsus and PDQ dev targets may run at the same time.
# The role formats/relabels the 3 attached blank data disks to PDQDEPLOY/PDQINVENTORY/PDQSHARE.
# The controller group declares localhost for delegated POSIX tasks and pins the playbook Python.
#
# =========================================================================================== #
---
all:
  children:
    pdq_servers:
      hosts:
        pdq-dev:
          ansible_host: '192.168.0.182'   # own static IP and generated MAC
      vars:
        ansible_user: 'administrator'
        ansible_connection: 'ssh'
        ansible_shell_type: 'powershell'
    controller:
      hosts:
        localhost:
          ansible_connection: 'local'
          ansible_shell_type: 'sh'
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
