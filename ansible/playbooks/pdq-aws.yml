# =========================================================================================== #
# File: 'ansible/playbooks/pdq-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Brings the EPHEMERAL EC2 instance from "the API says it exists" to a domain-joined host with
# its data disks provisioned. The PDQ Deploy and Inventory roles follow, one product at a time.
#
# Runs from the COMPOSED tree only: the workflow overlays this repository onto the pinned
# ansible-framework and runs this against a dynamic EC2 inventory filtered to one run.
#
# The role order in the second play is the design. Each one is a precondition for the next: the
# host must answer before it can be repaired, be repaired before a module runs, be on the network
# before it can resolve a realm, be in the realm before it is a host worth provisioning, and have
# its volumes lettered before a product is told to put a database on one.
#
# gather_facts and become are absent throughout because the framework's ansible.cfg makes
# gathering explicit and escalation off. Both matter here: implicit gathering would run a module
# over the shell os_bootstrap has not yet fixed, and the products escalate per task to the
# background service user rather than running the whole play as somebody.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The inventory already filters to this run's instance by its framework-set tags. This guards the
# two states that filter cannot cover: an empty result, where nothing launched or nothing tagged,
# and an invocation that never said which account it is deploying into.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    - name: 'INVENTORY | Require At Least One Filtered Host'
      ansible.builtin.assert:
        that: groups['pdq_servers'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'pdq_servers' inventory group is empty. The dynamic EC2
          inventory found no running instance tagged for this run -- a zero-host inventory is not a
          successful deployment proof.
        quiet: true

    # Account-derived values are passed EXPLICITLY on the invocation, never read from the
    # environment by a role, so the play and the deploy identity cannot disagree.
    - name: 'INVENTORY | Require The AWS Deployment Identity'
      ansible.builtin.assert:
        that:
          - aws_account_id is defined
          - aws_account_id is match('^[0-9]{12}$')
          - aws_region is defined
          - aws_region is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          aws_account_id and aws_region must be provided as extra-vars. The aws-deploy workflow
          passes them from its own environment (the same values the OIDC role ARN and region
          use); a local run must pass both explicitly.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Configure The Guest ] -------------------------------------------------- #

- name: 'PLAY | Configure The Guest (ephemeral AWS)'
  hosts: 'pdq_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    # Waits for the connection itself, never a port: a TCP connect cannot speak for a connection
    # reaching its target through a proxy or a tunnel, and this inventory can select those. It
    # then waits out EC2Launch, detecting the platform itself rather than being told.
    - role: 'host_readiness'
    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OS Bootstrap ] ---------------------------------------------------- #
    # Flips OpenSSH's DefaultShell to PowerShell and proves the session is elevated. Every module
    # after it depends on that. Pass it NO vars: role params outrank the connection scoping it
    # relies on, and a stray one silently re-breaks the pre-flip stage.
    - role: 'os_bootstrap'
    #endregion --- [ Roles: OS Bootstrap ] ---------------------------------------------------- #

    #region ------ [ Roles: Remote Client ] --------------------------------------------------- #
    # Site policy: the role defaults every value remote_client needs, so this play states none.
    # 'aws_account_id' is an extra-var -- only the pipeline knows which account it deploys into.
    # Skipped when the products are being removed: an uninstall is not a reason to rebuild a
    # tunnel the host is about to stop needing.
    - role: 'remote_client'
      when: (state | default('present') | string | lower | trim) != 'absent'
    #endregion --- [ Roles: Remote Client ] --------------------------------------------------- #

    #region ------ [ Roles: Domain Member ] --------------------------------------------------- #
    # Wraps the platform's join mechanism and defaults the site's realm, account and secret. Only
    # two things are this repository's to say: the account it deploys into, and where a PDQ server
    # is filed -- its own OU, not the deployment servers'.
    - role: 'domain_member'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        domain_member:
          password: { bucket: "{{ aws_account_id }}-ansible" }
          computer_ou: 'OU=PDQ,OU=Domain Servers,DC=tcn,DC=trinitytechnicalservices,DC=com'
    #endregion --- [ Roles: Domain Member ] --------------------------------------------------- #

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # `function` names each EBS volume's Function tag from terraform/aws.tfvars, and the role
    # resolves it to the attached disk itself -- a volume id only exists after apply. The letters
    # are the contract this play publishes to the products below: Inventory's database on D,
    # Deploy's on E, and the shared package repository on F.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'PDQINVENTORY'
              drive_letter: 'D'
              label: 'PDQINVENTORY'
              allocation_unit: 65536
            - function: 'PDQDEPLOY'
              drive_letter: 'E'
              label: 'PDQDEPLOY'
              allocation_unit: 65536
            - function: 'PDQREPO'
              drive_letter: 'F'
              label: 'PDQREPO'
              allocation_unit: 65536
    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Configure The Guest ] -------------------------------------------------- #

#region ------ [ Play: PDQ Deploy And Inventory ] --------------------------------------------- #
# One all-in-one Central Server: both products co-located, in the same operating mode, under one
# background service user. They are separate roles because each is separately installable, not
# because they are separately deployable.

- name: 'PLAY | PDQ Deploy And Inventory (all-in-one Central Server, ephemeral AWS)'
  hosts: 'pdq_servers'
  any_errors_fatal: true
  vars:
    # The pinned application versions, defined ONCE here and handed to BOTH products below (they
    # share one custom-variable model). The names are the product's own: each is spelled exactly
    # as the fleet's variable export spells it -- <Publisher>_<Product>, words joined by dashes --
    # so a name here, a name in a package or collection definition, and a name in the console
    # are the same string, and each value is the version to pin. The map is the COMPLETE set:
    # only a name that is absent, or whose value differs, is written, each is proved to read
    # back, and a custom variable this map does not name is removed on the next converge --
    # proven from the product's own export.
    #
    # Taken from the fleet's export of 2026-08-25 (PDQ Inventory 19.5.0.0).
    pdq_variables:
      Adobe-Systems-Inc_Adobe-Acrobat-Reader-DC: '25.1.20997.0'
      Adobe-Systems-Inc_Adobe-Connect: '2025.9.15.64'
      Amazon-Com-Inc_Amazon-Cloudwatch-Agent: '1.4.37920'
      Amazon-Web-Services_AWS-Command-Line-Interface-v2: '2.34.6.0'
      Amazon-Web-Services_Amazon-EC2Launch: '2.4.0.0'
      Amazon-Web-Services_Amazon-SSM-Agent: '3.3.3797.0'
      Amazon-Web-Services_aws-cfn-bootstrap: '2.0.34'
      Anaconda-Inc_Anaconda3: '2025.12-1'
      Devolutions-Inc_Remote-Desktop-Manager: '2026.1.18.0'
      Google-LLC_Google-Chrome: '147.0.7727.56'
      Igor-Pavlov_7-Zip: '26.00.00.0'
      Martin-Prikryl_WinSCP: '6.5.6'
      Microsoft-Corporation_Microsoft-Edge: '147.0.3912.60'
      Microsoft-Corporation_Microsoft-NetBanner: '2.3.181'
      Microsoft-Corporation_Microsoft-ODBC-Driver-17: '17.10.6.1'
      Microsoft-Corporation_Microsoft-ODBC-Driver-18: '18.6.1.1'
      Microsoft-Corporation_Microsoft-Office-LTSC-Professional-Plus-2021: '16.0.14334.20570'
      Microsoft-Corporation_Microsoft-Office-Professional-Plus-2019: '16.0.10417.20108'
      Microsoft-Corporation_Microsoft-OpenJDK-11: '11.0.30.7'
      Microsoft-Corporation_Microsoft-OpenJDK-17: '17.0.18.8'
      Microsoft-Corporation_Microsoft-OpenJDK-21: '21.0.10.7'
      Microsoft-Corporation_Microsoft-OpenJDK-25: '25.0.2.10'
      Microsoft-Corporation_Microsoft-Project-Professional-2019: '16.0.10417.20108'
      Microsoft-Corporation_Microsoft-Project-Professional-2021: '16.0.14334.20570'
      Microsoft-Corporation_Microsoft-Visual-C-v14: '14.50.35719.0'
      Microsoft-Corporation_Microsoft-Visual-Studio-Code: '1.115.0'
      Microsoft-Corporation_Microsoft-Windows-Desktop-Runtime: '10.0.5.50000'
      Microsoft-Corporation_PowerShell-7: '7.6.0.0'
      Microsoft-Corporation_Windows-Print-Services-Extension: '14182.0.0.0'
      Mozilla_Mozilla-Firefox-ESR: '140.9.1'
      Node.js-Foundation_Node.js-21: '21.7.3'
      Node.js-Foundation_Node.js-22: '22.22.2'
      Node.js-Foundation_Node.js-24: '24.14.1'
      Node.js-Foundation_Node.js-25: '25.9.0'
      Notepad-Team_Notepad: '8.9.3'
      PDQ-com_PDQ-Deploy: '19.7.6.0'
      PDQ-com_PDQ-Inventory: '19.7.6.0'
      Prometheus-Community_Windows-Exporter: '0.31.6'
      Python-Software-Foundation_Python-3.10: '3.10.11150.0'
      Python-Software-Foundation_Python-3.11: '3.11.9150.0'
      Python-Software-Foundation_Python-3.12: '3.12.7150.0'
      Python-Software-Foundation_Python-3.13: '3.13.11150.0'
      Python-Software-Foundation_Python-3.14: '3.14.2150.0'
      Simon-Tatham_PuTTY: '0.83.0.0'
      Splunk-Inc_UniversalForwarder: '9.4.8.0'
      The-Git-Development-Community_Git: '2.53.0.2'
      Wazuh-Inc_Wazuh-Agent: '4.14.4'

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:


    #region ------ [ Roles: PDQ Deploy ] ------------------------------------------------------ #
    - role: 'pdq_deploy'
      vars:
        pdq_deploy:

          # The pinned application versions, defined once in the play vars above and shared with
          # pdq_inventory: both products import the SAME map into their own variable stores.
          variables: "{{ pdq_variables }}"

          # What is actually being installed, stated where a reader can see it. The digest is
          # verified on the GUEST immediately before the installer executes, so a changed object
          # with an unchanged pin stops the deployment.
          # Each artifact names its own bucket: executables live in the application repository,
          # licences stay beside the other deployment material. Both carry the account id, so they
          # are composed here rather than defaulted in the role.
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '20.1.8.0'
            sha256: '856dbe3dd4544d4b9ae1f382ee51f2a5f25f41714c462fa4afcff9743cc85eb9'

          # The password itself never appears here: only the object that holds it. Fetched as a
          # string and used to create the account; never on disk.
          service_account:
            bucket: "{{ aws_account_id }}-ansible"
            object: 'applications/pdq/svc-pdq-password.txt'

          # The licence itself never appears here: only the object that holds it, in the -ansible
          # bucket beside the other deployment material (NOT the installer's -apprepo bucket). It is
          # fetched as a string and written straight to the registry, touching no disk on either
          # machine.
          license:
            bucket: "{{ aws_account_id }}-ansible"
            object: 'applications/pdq/pdq-deploy-license.lic'
            sha256: '4fc848aabff6ff6ecb1c09c9017d40da306bd3c9dd2d075b9082e03608dce58c'
            # The address the licence was issued to. Mandatory: the role registers it with the
            # product (killing the first-console popup) and fails if it differs from the E-Mail
            # attribute inside the licence blob itself.
            email: 'nicholas.warila@gmail.com'

          # The database grows without bound, so it goes on the volume provisioned for it rather
          # than the system disk. Only the letter belongs here: which disk this host dedicates to
          # PDQ is a property of the host, and the folder beneath it is the role's business.
          database:
            drive: 'E'

          # The repository is shared out over the network, so it gets its own volume: package
          # files are written by administrators and read by every deployment.
          #
          # Its contents come from the application repository bucket -- the same bucket the
          # installer above is fetched from, because an installer PDQ deploys and an installer PDQ
          # runs are the same kind of object. The role writes a sync script carrying these two
          # values so an administrator can pull new content down without a deployment.
          repository:
            drive: 'F'
            bucket: "{{ aws_account_id }}-apprepo"
            region: "{{ aws_region }}"

          # The server answers consoles on the address this host actually holds, rather than on
          # everything it happens to be attached to. It comes from the inventory because the
          # address is assigned at launch and differs on every rebuild. The PUBLIC address is not
          # usable here: AWS translates it, so the interface only ever sees the private one, and
          # binding to an address the host does not own fails at service start.
          server:
            listen_addresses: [ "{{ aws_private_ip_address }}" ]

    #endregion --- [ Roles: PDQ Deploy ] ------------------------------------------------------ #

    #region ------ [ Roles: PDQ Inventory ] --------------------------------------------------- #
    - role: 'pdq_inventory'
      vars:
        pdq_inventory:

          # The pinned application versions, defined once in the play vars above and shared with
          # pdq_deploy: both products import the SAME map into their own variable stores.
          variables: "{{ pdq_variables }}"

          # Inventory ships its own installer from the application repository, verified on the
          # GUEST against this digest immediately before it runs. Same layout as Deploy: the role
          # composes <vendor>/<application>/<version>/<file> from this version, so only a version
          # and a digest belong here.
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '20.1.8.0'
            sha256: '48a486f3682cc01218993e72a8006163616166dd5f0fdcd1fab36724710fdbbf'

          # The ONE Background Service User both products share. The password never appears here:
          # only the object that holds it, the same object Deploy uses.
          service_account:
            bucket: "{{ aws_account_id }}-ansible"
            object: 'applications/pdq/svc-pdq-password.txt'

          # Inventory has its OWN licence, distinct from Deploy's, in the -ansible bucket beside
          # the other deployment material. Fetched as a string and written straight to the
          # registry. The email is the address the licence was issued to: the role records it with
          # the product (killing the first-console popup) and fails if it differs from the E-Mail
          # inside the licence blob itself.
          license:
            bucket: "{{ aws_account_id }}-ansible"
            object: 'applications/pdq/pdq-inventory-license.lic'
            sha256: '2c6ef523580c2cfb4ee9c423ca2ae204091544e97322d2dd95cdfd6a99d7c2a5'
            email: 'nicholas.warila@gmail.com'

          # Inventory's database grows without bound, so it goes on its own volume (D) rather than
          # the system disk. Only the letter belongs here; the folder beneath it is the role's
          # business. Inventory publishes no repository -- it is a scanner, not a deployer.
          database:
            drive: 'D'

          # The server answers consoles on the private address this host actually holds, assigned
          # at launch. The public address is not usable: AWS translates it, so the interface only
          # ever sees the private one, and binding to an address the host does not own fails at
          # service start.
          server:
            listen_addresses: [ "{{ aws_private_ip_address }}" ]

    #endregion --- [ Roles: PDQ Inventory ] --------------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: PDQ Deploy And Inventory ] ------------------------------------------- #
