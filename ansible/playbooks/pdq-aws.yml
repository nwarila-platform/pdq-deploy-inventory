# =========================================================================================== #
# File: 'ansible/playbooks/pdq-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Provisions the declared Windows data disk on the EPHEMERAL EC2 instance, then applies the PDQ
# Deploy role. Runs from the COMPOSED tree only — in CI, .github/workflows/aws-deploy.yml
# overlays this repository's roles into the pinned ansible-framework checkout and executes this
# playbook against an exact JSON inventory built from Terraform output and verified against live
# EC2 tags, reached by instance id over SSH-in-SSM — zero inbound.
#
# Three plays, in a required order: prove the inventory is the instance this run created, wait
# for that instance to become reachable, then configure it.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# terraform apply returns when the API accepts the request, so nothing downstream has yet proven
# the inventory describes THIS run's instance. Refuse before touching a host, not after.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  gather_facts: false
  become: false

  vars:
    __pdq_inventory_hosts__: "{{ groups['pdq_servers'] | default([]) }}"
    __expected_repository_id__: "{{ lookup('ansible.builtin.env', 'GITHUB_REPOSITORY_ID') | trim }}"
    __expected_run_id__: "{{ lookup('ansible.builtin.env', 'GITHUB_RUN_ID') | trim }}"
    __expected_region__: "{{ aws_region | default('') | trim }}"

  tasks:
    - name: 'INVENTORY | Require One Host And An Immutable Repository Identity'
      ansible.builtin.assert:
        that:
          - __pdq_inventory_hosts__ | length == 1
          - __expected_repository_id__ is match('^[0-9]+$')
          - __expected_run_id__ is match('^[0-9]+$')
          - __expected_region__ is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          Refusing to configure: expected exactly one running Function=pdq instance and a
          numeric GITHUB_REPOSITORY_ID and GITHUB_RUN_ID, but inventory
          hosts={{ __pdq_inventory_hosts__ }}, repository_id='{{ __expected_repository_id__ }}',
          run_id='{{ __expected_run_id__ }}', region='{{ __expected_region__ }}'. A zero-host
          inventory is not a successful deployment proof.
        quiet: true

    - name: 'INVENTORY | Select The Sole Terraform Instance'
      ansible.builtin.set_fact:
        __pdq_inventory_host__: "{{ __pdq_inventory_hosts__ | first }}"

    - name: 'INVENTORY | Assert Instance, Platform, Region, And Ownership Tags'
      vars:
        __selected__: "{{ hostvars[__pdq_inventory_host__] }}"
        __selected_tags__: "{{ __selected__.ec2_tags | default({}) }}"
      ansible.builtin.assert:
        that:
          - __selected__.ec2_instance_id is match('^i-[0-9a-f]+$')
          - __pdq_inventory_host__ == __selected__.ec2_instance_id
          - (__selected__.ec2_platform | default('') | lower) == 'windows'
          - (__selected__.ec2_state.name | default('')) == 'running'
          - (__selected_tags__.Function | default('')) == 'pdq'
          - (__selected_tags__['RepositoryId'] | default('') | string) == __expected_repository_id__
          - (__selected__.ec2_placement.availability_zone | default('')).startswith(__expected_region__)
          - (__selected_tags__['RunId'] | default('') | string) == __expected_run_id__
        fail_msg: >-
          Refusing to configure {{ __pdq_inventory_host__ }}: it is not the one running Windows
          instance owned by repository id {{ __expected_repository_id__ }} in
          {{ __expected_region__ }}, or its tags do not contain current run id
          '{{ __expected_run_id__ }}'. tags={{ __selected_tags__ }}.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Windows Readiness ] ---------------------------------------------------- #
# The instance answers the EC2 API seconds after creation and accepts SSH minutes later: it must
# finish sysprep and EC2Launch before sshd starts and the launch key is installed.
#
# THE PHASE ORDER IS THE POINT. Phase one polls the SSM agent through the control-plane API,
# which opens no tunnel. Only then does phase two probe SSH. Probing SSH from the start defeats
# itself — every attempt during sysprep is doomed and each leaves a server-side session the
# runner cannot close, so by the time sshd listens it is already past MaxStartups (ten pending
# unauthenticated connections) and drops exactly the connections being retried. Measured here:
# twenty-nine sessions survived a run whose instance was already terminated.

- name: 'PLAY | Wait For Windows Readiness (SSM agent, sshd, EC2Launch)'
  hosts: 'pdq_servers'
  gather_facts: false
  become: false
  any_errors_fatal: true

  vars:
    __aws_region__: "{{ aws_region | default('us-east-1') }}"

  tasks:
    # One API call, no session: safe to poll freely while the guest boots.
    - name: 'READY | Wait For The SSM Agent To Register'
      delegate_to: 'localhost'
      ansible.builtin.command:
        argv:
          - 'aws'
          - 'ssm'
          - 'describe-instance-information'
          - '--region'
          - "{{ __aws_region__ }}"
          - '--filters'
          - "Key=InstanceIds,Values={{ ansible_host }}"
          - '--query'
          - "length(InstanceInformationList[?PingStatus=='Online'])"
          - '--output'
          - 'text'
      register: '__ssm_online__'
      retries: 40
      delay: 15
      until: __ssm_online__.stdout | trim == '1'
      changed_when: false

    # Asked over the agent's existing channel, so this opens no session either.
    - name: 'READY | Wait For sshd To Listen (asked over the agent, no tunnel)'
      delegate_to: 'localhost'
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          command_id="$(aws ssm send-command --region '{{ __aws_region__ }}' \
            --instance-ids '{{ ansible_host }}' \
            --document-name AWS-RunPowerShellScript \
            --parameters 'commands=["(Get-NetTCPConnection -LocalPort 22 -State Listen -ErrorAction SilentlyContinue | Measure-Object).Count"]' \
            --query Command.CommandId --output text)" || exit 1
          for _ in $(seq 1 20); do
            status="$(aws ssm get-command-invocation --region '{{ __aws_region__ }}' \
              --command-id "${command_id}" --instance-id '{{ ansible_host }}' \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "${status}" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation --region '{{ __aws_region__ }}' \
            --command-id "${command_id}" --instance-id '{{ ansible_host }}' \
            --query StandardOutputContent --output text 2>/dev/null | tr -d '[:space:]'
        executable: '/bin/bash'
      register: '__sshd_listening__'
      retries: 40
      delay: 15
      until: __sshd_listening__.stdout | default('') | trim is match('^[1-9]')
      changed_when: false

    # Small retry budget on purpose: each attempt costs a session only the API can close.
    - name: 'READY | Confirm The SSM-SSH Path End To End'
      delegate_to: 'localhost'
      ansible.builtin.command:
        cmd: >-
          ssh {{ ansible_ssh_common_args }} -i {{ ansible_ssh_private_key_file }}
          -o BatchMode=yes -o ConnectTimeout=15
          {{ ansible_user }}@{{ ansible_host }} exit
      register: '__ssh_ready__'
      retries: 5
      delay: 15
      until: __ssh_ready__.rc == 0
      failed_when: __ssh_ready__.rc != 0
      changed_when: false

    - name: 'READY | Wait For EC2Launch Provisioning To Complete'
      ansible.builtin.raw: '"C:\Program Files\Amazon\EC2Launch\EC2Launch.exe" status -b'
      changed_when: false

#endregion --- [ Play: Windows Readiness ] ---------------------------------------------------- #

#region ------ [ Play: PDQ Deploy ] ----------------------------------------------------------- #

- name: 'PLAY | PDQ Deploy (all-in-one Central Server, ephemeral AWS)'
  hosts: 'pdq_servers'
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    ENV: "{{ env }}"
    pdq_disk_layout:
      data:
        function: 'PDQDATA'
        drive_letter: 'E'
        label: 'PDQDATA'
        allocation_unit: 65536

  #region ------ [ Pre-Tasks ] ---------------------------------------------------------------- #
  pre_tasks:

    # Account-derived values are passed EXPLICITLY on the invocation, never read from the
    # environment by a role, so the play and the deploy identity cannot disagree.
    - name: 'PRE | Assert the AWS deployment identity was provided'
      ansible.builtin.assert:
        that:
          - aws_account_id is defined
          - aws_account_id is match('^[0-9]{12}$')
          - aws_region is defined
          - aws_region is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          aws_account_id and aws_region must be provided as extra-vars. The aws-deploy workflow
          passes them from its own environment (the same values the OIDC role ARN and region
          use); a local run must pass both explicitly.
        quiet: true

  #endregion --- [ Pre-Tasks ] ---------------------------------------------------------------- #

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # Guest disk provisioning is delegated to the composed framework role — this repository
    # never duplicates it. `function` names the EBS volume's Function tag (declared in
    # terraform/aws.tfvars) and the role resolves it to the attached disk itself, because a
    # volume id only exists after apply.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: "{{ pdq_disk_layout.data.function }}"
              drive_letter: "{{ pdq_disk_layout.data.drive_letter }}"
              label: "{{ pdq_disk_layout.data.label }}"
              allocation_unit: "{{ pdq_disk_layout.data.allocation_unit }}"
    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #

    #region ------ [ Roles: PDQ Deploy ] ------------------------------------------------------ #
    - role: 'pdq_deploy'
      vars:
        pdq_deploy:
          # The bucket carries the account id, so it is composed here rather than defaulted in
          # the role — a role default holding one account's bucket is not a default.
          artifact_bucket: "{{ aws_account_id }}-ansible"

          # What is actually being installed, stated where a reader can see it. The digest is
          # verified on the GUEST immediately before the installer executes, so a changed object
          # with an unchanged pin stops the deployment.
          installer:
            path: 'applications/pdq/Deploy_20.1.8.0.exe'
            version: '20.1.8.0'
            sha256: '856dbe3dd4544d4b9ae1f382ee51f2a5f25f41714c462fa4afcff9743cc85eb9'
    #endregion --- [ Roles: PDQ Deploy ] ------------------------------------------------------ #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: PDQ Deploy ] ----------------------------------------------------------- #
