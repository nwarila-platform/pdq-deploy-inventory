# =========================================================================================== #
# File: 'ansible/playbooks/pdq-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Provisions the declared Windows data disks on the EPHEMERAL EC2 instance, then applies the PDQ
# Deploy role. Runs from the COMPOSED tree only — in CI, .github/workflows/aws-deploy.yml
# overlays this repository's roles into the pinned ansible-framework checkout and executes this
# playbook against a dynamic EC2 inventory filtered to this run and verified against live EC2
# tags, reached by direct SSH to the instance's public IPv4.
#
# Three plays, in a required order: prove the inventory is the instance this run created, wait
# for that instance to become reachable, then configure it.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# terraform apply returns when the API accepts the request, so nothing downstream has yet proven
# the inventory describes THIS run's instance. Refuse before touching a host, not after.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  gather_facts: false
  become: false

  vars:
    __pdq_inventory_hosts__: "{{ groups['pdq_servers'] | default([]) }}"
    __expected_repository_id__: "{{ lookup('ansible.builtin.env', 'GITHUB_REPOSITORY_ID') | trim }}"
    __expected_run_id__: "{{ lookup('ansible.builtin.env', 'GITHUB_RUN_ID') | trim }}"
    __expected_region__: "{{ aws_region | default('') | trim }}"

  tasks:
    - name: 'INVENTORY | Require One Host And An Immutable Repository Identity'
      ansible.builtin.assert:
        that:
          - __pdq_inventory_hosts__ | length == 1
          - __expected_repository_id__ is match('^[0-9]+$')
          - __expected_run_id__ is match('^[0-9]+$')
          - __expected_region__ is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          Refusing to configure: expected exactly one running Function=pdq instance and a
          numeric GITHUB_REPOSITORY_ID and GITHUB_RUN_ID, but inventory
          hosts={{ __pdq_inventory_hosts__ }}, repository_id='{{ __expected_repository_id__ }}',
          run_id='{{ __expected_run_id__ }}', region='{{ __expected_region__ }}'. A zero-host
          inventory is not a successful deployment proof.
        quiet: true

    - name: 'INVENTORY | Select The Sole Terraform Instance'
      ansible.builtin.set_fact:
        cacheable: false
        __pdq_inventory_host__: "{{ __pdq_inventory_hosts__ | first }}"

    - name: 'INVENTORY | Assert Instance, Platform, Region, And Ownership Tags'
      vars:
        __selected__: "{{ hostvars[__pdq_inventory_host__] }}"
        __selected_tags__: "{{ __selected__.aws_tags | default({}) }}"
      ansible.builtin.assert:
        that:
          - __selected__.aws_instance_id is match('^i-[0-9a-f]+$')
          - __pdq_inventory_host__ == __selected__.aws_instance_id
          - (__selected__.aws_platform | default('') | lower) == 'windows'
          - (__selected__.aws_state.name | default('')) == 'running'
          - (__selected_tags__.Function | default('')) == 'pdq'
          - (__selected_tags__['RepositoryId'] | default('') | string) == __expected_repository_id__
          - (__selected__.aws_placement.availability_zone | default('')).startswith(__expected_region__)
          - (__selected_tags__['RunId'] | default('') | string) == __expected_run_id__
        fail_msg: >-
          Refusing to configure {{ __pdq_inventory_host__ }}: it is not the one running Windows
          instance owned by repository id {{ __expected_repository_id__ }} in
          {{ __expected_region__ }}, or its tags do not contain current run id
          '{{ __expected_run_id__ }}'. tags={{ __selected_tags__ }}.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Windows Readiness ] ---------------------------------------------------- #
# The instance answers the EC2 API seconds after creation and accepts SSH minutes later: it must
# finish sysprep and EC2Launch before sshd starts and the launch key is installed.
#
# Poll the TCP port without opening SSH sessions while sysprep and EC2Launch start sshd, then use
# a bounded authenticated probe before running anything on the guest.

- name: 'PLAY | Wait For Windows Readiness (direct SSH, EC2Launch)'
  hosts: 'pdq_servers'
  gather_facts: false
  become: false
  any_errors_fatal: true

  tasks:
    - name: 'READY | Wait For The Direct SSH Port'
      delegate_to: 'localhost'

      ansible.builtin.wait_for:
        active_connection_states: [ 'ESTABLISHED', 'FIN_WAIT1', 'FIN_WAIT2', 'SYN_RECV', 'SYN_SENT', 'TIME_WAIT' ]
        connect_timeout: 5
        delay: 0
        host: "{{ ansible_host }}"
        port: 22
        sleep: 15
        state: 'started'
        timeout: 900

    - name: 'READY | Confirm The Direct SSH Path End To End'
      changed_when: false
      delay: 15
      delegate_to: 'localhost'
      failed_when: __ssh_ready__.rc != 0
      register: '__ssh_ready__'
      retries: 20
      until: __ssh_ready__.rc == 0

      ansible.builtin.command:
        cmd: >-
          ssh {{ ansible_ssh_common_args }} -i {{ ansible_ssh_private_key_file }}
          -o BatchMode=yes -o ConnectTimeout=15
          {{ ansible_user }}@{{ ansible_host }} exit
        expand_argument_vars: true
        stdin_add_newline: true
        strip_empty_ends: true

    - name: 'READY | Wait For EC2Launch Provisioning To Complete'
      changed_when: false

      ansible.builtin.raw: '"C:\Program Files\Amazon\EC2Launch\EC2Launch.exe" status -b'

#endregion --- [ Play: Windows Readiness ] ---------------------------------------------------- #

#region ------ [ Play: PDQ Deploy ] ----------------------------------------------------------- #

- name: 'PLAY | PDQ Deploy (all-in-one Central Server, ephemeral AWS)'
  hosts: 'pdq_servers'
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    ENV: "{{ env }}"
    # One volume per concern, matching terraform/aws.tfvars by Function tag. The letters are the
    # contract this play publishes to the roles below: Inventory's database on D, Deploy's on E,
    # and the shared package repository on F.
    pdq_disk_layout:
      - function: 'PDQINVENTORY'
        drive_letter: 'D'
        label: 'PDQINVENTORY'
        allocation_unit: 65536
      - function: 'PDQDEPLOY'
        drive_letter: 'E'
        label: 'PDQDEPLOY'
        allocation_unit: 65536
      - function: 'PDQREPO'
        drive_letter: 'F'
        label: 'PDQREPO'
        allocation_unit: 65536

  #region ------ [ Pre-Tasks ] ---------------------------------------------------------------- #
  pre_tasks:

    # Account-derived values are passed EXPLICITLY on the invocation, never read from the
    # environment by a role, so the play and the deploy identity cannot disagree.
    - name: 'PRE | Assert the AWS deployment identity was provided'
      ansible.builtin.assert:
        that:
          - aws_account_id is defined
          - aws_account_id is match('^[0-9]{12}$')
          - aws_region is defined
          - aws_region is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          aws_account_id and aws_region must be provided as extra-vars. The aws-deploy workflow
          passes them from its own environment (the same values the OIDC role ARN and region
          use); a local run must pass both explicitly.
        quiet: true

  #endregion --- [ Pre-Tasks ] ---------------------------------------------------------------- #

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # Guest disk provisioning is delegated to the composed framework role — this repository
    # never duplicates it. `function` names each EBS volume's Function tag (declared in
    # terraform/aws.tfvars) and the role resolves it to the attached disk itself, because a
    # volume id only exists after apply. The layout is passed through whole: adding a volume is
    # a change in two files, not three.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks: "{{ pdq_disk_layout }}"
    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #

    #region ------ [ Roles: PDQ Deploy ] ------------------------------------------------------ #
    - role: 'pdq_deploy'
      vars:
        pdq_deploy:

          # What is actually being installed, stated where a reader can see it. The digest is
          # verified on the GUEST immediately before the installer executes, so a changed object
          # with an unchanged pin stops the deployment.
          # Each artifact names its own bucket: executables live in the application repository,
          # licences stay beside the other deployment material. Both carry the account id, so they
          # are composed here rather than defaulted in the role.
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '20.1.8.0'
            sha256: '856dbe3dd4544d4b9ae1f382ee51f2a5f25f41714c462fa4afcff9743cc85eb9'

          # The licence itself never appears here: only the object that holds it, in the same
          # bucket the installer comes from. It is fetched as a string and written straight to the
          # registry, so it touches no disk on either machine.
          # The password itself never appears here: only the object that holds it and the digest
          # that pins it. Fetched as a string and used to create the account; never on disk.
          service_account:
            bucket: "{{ aws_account_id }}-ansible"
            object: 'applications/pdq/svc-pdq-password.txt'
            sha256: 'd522139ebd26b7729f781d88aa9b41fcf189c6e59719ab3c46be32cd003ea729'

          license:
            bucket: "{{ aws_account_id }}-ansible"
            object: 'applications/pdq/pdq-deploy-license.lic'
            sha256: '4fc848aabff6ff6ecb1c09c9017d40da306bd3c9dd2d075b9082e03608dce58c'
            # The address the licence was issued to. Mandatory: the role registers it with the
            # product (killing the first-console popup) and fails if it differs from the E-Mail
            # attribute inside the licence blob itself.
            email: 'nicholas.warila@gmail.com'

          # The database grows without bound, so it goes on the volume provisioned for it rather
          # than the system disk. Only the letter belongs here: which disk this host dedicates to
          # PDQ is a property of the host, and the folder beneath it is the role's business.
          database:
            drive: 'E'

          # The repository is shared out over the network, so it gets its own volume: package
          # files are written by administrators and read by every deployment.
          repository:
            drive: 'F'

          # New console users start with the operator's measured preferences: no splash, no
          # update nagging, the dark theme. Existing profiles keep whatever they saved.
          console_default:
            disable_splash_screen: true
            auto_update_check: false
            show_webcast_alerts: false
            color_theme: 'Win11Dark'

          # OFF for now. Console users and the roles they would be granted are not modelled by
          # this deployment yet, and enabling access control before there are roles to grant
          # leaves a console nobody is authorised to use. Revisit once console users are managed.
          rbac_enabled: false

          # The server answers consoles on the address this host actually holds, rather than on
          # everything it happens to be attached to. It comes from the inventory because the
          # address is assigned at launch and differs on every rebuild. The PUBLIC address is not
          # usable here: AWS translates it, so the interface only ever sees the private one, and
          # binding to an address the host does not own fails at service start.
          server:
            listen_addresses: [ "{{ aws_private_ip_address }}" ]

          # EVERYTHING off the product default, deliberately: every severity, and every
          # settable name, so a fresh install visibly differs on every console page. One
          # exception: the audit log's custom-config LOADER stays at its default (off), because
          # enabling it against a file that does not exist risks the product's own logging; its
          # path is still set and visible. Settings are named by the script's parameters, not
          # the product's dotted spelling.
          event_log:
            error: false
            warning: false
            information: false
            debug: true

          settings:
            # Analytics
            AnalyticsAlertFirstTimeAnalyticsDialog: false
            AnalyticsCollectAnalyticsUsage: true
            # Package library
            PackageLibraryAutoDeployDefaultApprovalMode: 'Manual'
            PackageLibraryAutoDeployDefaultDelayedApprovalTimeSpan: '3.00:00:00'
            PackageLibraryAutoDeployDefaultIsEnabled: false
            PackageLibraryAutoDownloadArchiveCopiesToKeep: 9
            PackageLibraryAutoDownloadArchiveIsArchiving: true
            # Database backup
            DatabaseDatabaseBackupCompress: false
            DatabaseDatabaseBackupIsEnabled: false
            DatabaseDatabaseBackupKeep: 15
            # Deployments
            DeploymentCleanupDays: 45
            DeploymentComputerTimeout: 120
            DeploymentRunAs: 'LocalSystem'
            DeploymentScanAfterDeployment: false
            # Offline targets
            DeploymentOfflineIsRetryEnabled: true
            DeploymentOfflineRetryInterval: '02:30:00'
            DeploymentOfflineRetryMaxTries: 24
            DeploymentOfflineTryWol: true
            DeploymentOfflineUsePing: true
            # Logging and audit
            LoggingSentryCanSendAnonymousExceptionData: false
            LoggingAuditLogArchiveSchedule: 'Friday'
            LoggingAuditLogCustomConfigPath: 'E:\PDQ Deploy\audit-log.config'
            LoggingAuditLogDaysRecordsKept: 45
            LoggingAuditLogNumArchivedFiles: 8
            LoggingAuditLogVerboseFileDirectory: 'E:\PDQ Deploy\Logs'
            LoggingAuditLogWriteVerboseFile: false
            # Mail server
            MailServerEnableSSL: true
            MailServerHost: 'smtp.example.test'
            MailServerSender: 'pdq-sender@example.test'
            MailServerUser: 'pdq-mailer@example.test'
            MailServerOAuth2ClientId: 'demo-oauth-client-id'
            MailServerOAuth2TenantId: 'demo-oauth-tenant-id'
            MailServerOAuth2RedirectUri: 'https://localhost/demo-redirect'
            MailServerOAuth2Provider: 'Google'
            MailServerOAuth2Sender: 'oauth-sender@example.test'
            MailServerMSGraphAPIClientId: 'demo-graph-client-id'
            MailServerMSGraphAPITenantId: 'demo-graph-tenant-id'
            MailServerMSGraphAPICloudHostUrl: 'Azure US Government'
            MailServerMSGraphAPISender: 'graph-sender@example.test'
            # Performance
            PerformanceBandwidthLimitPercent: 75
            PerformanceCopyMode: 'Pull'
            PerformanceMaxDeploymentThreads: 16
            PerformanceMaxServerThreads: 64
            PerformanceCredentialBatchSize: 300
            PerformanceIntegrationMessageTimeoutSeconds: 60
            # Printing
            PrintingFooterAlignment: 'Left'
            PrintingFooterText: 'FOOTER-CHECK'
            PrintingHeaderAlignment: 'Right'
            PrintingHeaderText: 'HEADER-CHECK'
            PrintingInColor: false
            PrintingMarginBottom: 25
            PrintingMarginLeft: 25
            PrintingMarginRight: 25
            PrintingMarginTop: 25
            # Proxy
            ProxyHostName: 'proxy.example.test'
            ProxyPort: 8888
            ProxyUserName: 'proxy-user'
            ProxyUseSystemHost: false
            # Repository
            RepositoryEnableUnusedFilesWarning: false
            RepositoryExclusions: '*.tmp;*.partial'
            # Spiceworks
            SpiceworksHostName: 'spiceworks.example.test'
            SpiceworksIsEnabled: false
            SpiceworksPort: 8443
            SpiceworksSyncInterval: '06:00:00'
            SpiceworksUserName: 'spice-user'
            SpiceworksUseSSL: false
            # Target service
            TargetServiceRemoteDirectory: 'ADMIN$\PDQService'
            TargetServiceSharePath: 'C$\PDQStage'

    #endregion --- [ Roles: PDQ Deploy ] ------------------------------------------------------ #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: PDQ Deploy ] ----------------------------------------------------------- #
