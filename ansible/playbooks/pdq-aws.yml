# =========================================================================================== #
# File: 'ansible/playbooks/pdq-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Brings the ephemeral EC2 instances from "the API says they exist" to domain-joined hosts, then
# provisions the server's data disks and configures both products in dependency order.
#
# The inventory decides how each host is reached; this play's ordered credential sets decide
# who logs on. A new image uses its image identity first, then the automation identity after
# the join.
#
# Runs from the composed tree: the workflow overlays this repository onto the pinned framework
# and uses its configuration, role search path, connection defaults, and explicit fact gathering.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The inventory already filters to this run's instance by its framework-set tags. This guards the
# two states that filter cannot cover: an empty result, where nothing launched or nothing tagged,
# and an invocation that never said which account it is deploying into.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    - name: 'INVENTORY | Require At Least One Filtered Host'
      ansible.builtin.assert:
        that: groups['pdq_servers'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'pdq_servers' inventory group is empty. The dynamic EC2
          inventory found no running instance tagged for this run -- a zero-host inventory is not a
          successful deployment proof.
        quiet: true

    # A deployment with no target proves nothing that matters: every scan, deployment and LAPS
    # read needs a machine that is not the PDQ server itself.
    - name: 'INVENTORY | Require The Scan Target'
      ansible.builtin.assert:
        that: groups['domain_workstations'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'domain_workstations' inventory group is empty. The
          deployment builds a target so that scanning and deployment can be proved against
          something other than the console host.
        quiet: true

    # Account-derived values are passed EXPLICITLY on the invocation, never read from the
    # environment by a role, so the play and the deploy identity cannot disagree.
    - name: 'INVENTORY | Require The AWS Deployment Identity'
      ansible.builtin.assert:
        that:
          - aws_account_id is defined
          - aws_account_id is match('^[0-9]{12}$')
          - aws_region is defined
          - aws_region is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          aws_account_id and aws_region must be provided as extra-vars. The aws-deploy workflow
          passes them from its own environment (the same values the OIDC role ARN and region
          use); a local run must pass both explicitly.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Configure The Hosts ] -------------------------------------------------- #

- name: 'PLAY | Configure The Hosts (ephemeral AWS)'
  hosts: 'pdq_servers:domain_workstations'
  any_errors_fatal: true
  vars:
    <<: &domain_directory
      domain_base_dn: 'DC=tcn,DC=trinitytechnicalservices,DC=com'
      domain_realm: 'tcn.trinitytechnicalservices.com'
    domain_join_user: "svc-domainjoin@{{ domain_realm }}"
    domain_join_password: "{{ lookup('secret',\n          's3://' ~ aws_account_id ~ \
      '-ansible/host_roles/domain_member/svc-domainjoin-password.txt',\n          \
      '07493ed779c2962bff0b5e19cfa00b8cdb95defcf477f6b5bac36ddef55087ae') }}"
    domain_automation_user: 'tcn\jenkins_runner'
    domain_automation_password: "{{ lookup('secret',\n          's3://' ~ aws_account_id ~ \
      '-ansible/host_roles/domain_member/jenkins_runner-password.txt',\n          \
      '088a652ed843f0fa702a23d1f3ebe2e62c187c4c07f563e12c174e1d17945b03') }}"
    domain_automation_private_key: "{{ lookup('secret',\n          's3://' ~ aws_account_id ~ \
      '-ansible/host_roles/domain_member/jenkins_runner-ssh-private-key',\n          \
      'be4cb9ba3d7835827b2c3677c8cf1df3aafee8a3698537c040cd6f986049d5b7') }}"
    domain_automation_public_key: "{{ lookup('secret',\n          's3://' ~ aws_account_id ~ \
      '-ansible/host_roles/domain_member/jenkins_runner-ssh-public-key',\n          \
      'ad00b8b65b2d19f31595d4b62eaa79bccd05842d67cbe9b5c3d1ce4095f59281') }}"
    ssh_trusted_principals:
      - user: "{{ domain_automation_user }}"
        public_key: "{{ domain_automation_public_key }}"
    launch_key_file: "{{ lookup('ansible.builtin.env', 'CI_PRIVATE_KEY') \
      | default('~/.ssh/nwarila-ec2-key', true) | expanduser }}"
    connection_sets:
      ssh:
        - name: 'domain-automation'
          connection: 'ssh'
          user: "{{ domain_automation_user }}"
          private_key: "{{ domain_automation_private_key }}"
        - name: 'image-administrator'
          connection: 'ssh'
          user: 'Administrator'
          private_key_file: "{{ launch_key_file }}"
      winrm:
        - name: 'domain-automation'
          connection: 'winrm'
          user: "{{ domain_automation_user }}"
          password: "{{ domain_automation_password }}"
          transport: 'ntlm'
        - name: 'image-administrator'
          connection: 'winrm'
          user: 'Administrator'
          password: "{{ __launch_password__.stdout }}"
          transport: 'ntlm'
    credential_resolver_candidates: "{{ connection_sets[connection_transport] }}"
    credential_resolver_require_elevated: true
    identity_wait_rounds: 60
    identity_wait_pause_seconds: 10
    # OU=Test is under OU=Domain Servers, whose Inventory container scans with svc-pdq-ms.
    # Policy 8992C makes svc-pdq-ms a local administrator there (measured 2026-09-27).
    domain_computer_ou: >-
      {{ 'OU=PDQ' if inventory_hostname in groups['pdq_servers'] else 'OU=Test' }},OU=Domain
      Servers,{{ domain_base_dn }}
    domain_membership:
      realm: "{{ domain_realm }}"
      user: "{{ domain_join_user }}"
      password: "{{ domain_join_password }}"
      computer_ou: "{{ domain_computer_ou }}"
      registration_address: "{{ aws_private_ip_address }}"

  #region ------ [ Pre Tasks ] ---------------------------------------------------------------- #
  pre_tasks:
    - name: 'BEGIN | Record The Transport The Inventory Declares'
      tags: ['always']
      ansible.builtin.set_fact:
        cacheable: false
        connection_transport: "{{ ansible_connection }}"

    - name: 'BEGIN | Wait For The Launch Password Data'
      changed_when: false
      check_mode: false
      delegate_to: 'localhost'
      tags: ['always']
      when: connection_transport == 'winrm'
      ansible.builtin.command:
        argv: ['aws', 'ec2', 'wait', 'password-data-available',
               '--instance-id', "{{ aws_instance_id }}", '--region', "{{ aws_region }}"]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    - name: 'BEGIN | Decrypt The Launch Password'
      no_log: true
      tags: ['always']
      when: connection_transport == 'winrm'
      block:
        - name: 'BEGIN | Read The Decrypted Launch Password'
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'
          register: '__launch_password__'
          ansible.builtin.command:
            argv: ['aws', 'ec2', 'get-password-data', '--instance-id', "{{ aws_instance_id }}",
                   '--priv-launch-key', "{{ launch_key_file }}", '--region', "{{ aws_region }}",
                   '--query', 'PasswordData', '--output', 'text']
            expand_argument_vars: false
            stdin_add_newline: true
            strip_empty_ends: true

    - name: 'BEGIN | Validate The Credential Sets'
      tags: ['always']
      ansible.builtin.include_role:
        allow_duplicates: true
        apply: {tags: ['always']}
        defaults_from: 'main'
        name: 'credential_resolver'
        public: false
        rescuable: true
        rolespec_validate: true
        tasks_from: 'validate'

    # measured: 2026-09-26 -- a fresh host first answered at round 11 (resolver case 3b).
    - name: 'BEGIN | Wait Until The Host Answers As One Of Its Sets'
      become: false
      changed_when: false
      check_mode: false
      ignore_errors: true
      ignore_unreachable: true
      loop: >-
        {{ range(identity_wait_rounds | int)
           | product(range(credential_resolver_candidates | length)) | list }}
      loop_control:
        break_when:
          - __identity_first_answer__ is not unreachable
          - __identity_first_answer__ is not failed
        label: "round {{ item.0 + 1 }}: {{ credential_resolver_candidates[item.1].name }}"
        pause: "{{ identity_wait_pause_seconds | int }}"
      register: '__identity_first_answer__'
      tags: ['always']
      vars:
        __identity_set__: "{{ credential_resolver_candidates[item.1] }}"
        ansible_become: false
        ansible_connection: "{{ __identity_set__.connection }}"
        ansible_control_path: 'none'
        ansible_password: null
        ansible_port: "{{ __identity_set__.port | default(None) }}"
        ansible_private_key: "{{ __identity_set__.private_key | default(None) }}"
        ansible_private_key_file: >-
          {{ __identity_set__.private_key_file | default(None) }}
        ansible_ssh_password: "{{ __identity_set__.password | default(None) }}"
        ansible_ssh_use_tty: false
        ansible_user: "{{ __identity_set__.user }}"
        ansible_winrm_message_encryption: >-
          {{ None if __identity_set__.connection != 'winrm'
             else 'always' if (__identity_set__.port | default(5986) | int) == 5985
             else 'auto' }}
        ansible_winrm_password: "{{ __identity_set__.password | default(None) }}"
        ansible_winrm_scheme: >-
          {{ None if __identity_set__.connection != 'winrm'
             else 'http' if (__identity_set__.port | default(5986) | int) == 5985
             else 'https' }}
        ansible_winrm_transport: "{{ __identity_set__.transport | default(None) }}"
      ansible.builtin.raw: 'echo ready'

    - name: 'BEGIN | Require An Answer From One Of The Sets'
      tags: ['always']
      ansible.builtin.assert:
        that:
          - (__identity_first_answer__.results | last) is not unreachable
          - (__identity_first_answer__.results | last) is not failed
        fail_msg: >-
          No credential set answered in {{ identity_wait_rounds }} rounds of
          {{ credential_resolver_candidates | length }} sets, {{ identity_wait_pause_seconds }}
          seconds between attempts; each attempt's answer is in the task above.
        quiet: true
        success_msg: 'A credential set answered.'

    - name: 'BEGIN | Resolve The Connection Identity'
      tags: ['always']
      ansible.builtin.include_role:
        allow_duplicates: true
        apply: {tags: ['always']}
        defaults_from: 'main'
        name: 'credential_resolver'
        public: false
        rescuable: true
        rolespec_validate: true
        tasks_from: 'main'

  #endregion --- [ Pre Tasks ] ---------------------------------------------------------------- #

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:
    # Waits for the selected connection rather than a port, then waits out EC2Launch after
    # detecting the platform (measured 2026-09-27).
    - role: 'host_readiness'

    # Windows SSH needs its DefaultShell repaired before modules run (measured 2026-09-26).
    # Role parameters would outrank the connection scoping that protects the pre-repair stage.
    - role: 'os_bootstrap'

    # Removing the products does not justify rebuilding the tunnel they are about to stop using.
    - role: 'remote_client'
      when: (state | default('present') | string | lower | trim) != 'absent'

    # The join schedules its restart without waiting; the tasks below adopt the new identity.
    - role: 'domain_member'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        domain_member: "{{ domain_membership | combine({'restart_wait': false}) }}"

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

  #region ------ [ Tasks ] -------------------------------------------------------------------- #
  tasks:
    - name: 'PROCESS | Expect The Automation Identity After The Restart'
      no_log: true
      tags: ['always']
      vars:
        __identity_set__: "{{ connection_sets[connection_transport][0] }}"
      when: __domain_member_boot_time__ is defined
      block:
        - name: 'PROCESS | Publish The Automation Identity'
          ansible.builtin.set_fact:
            cacheable: false
            ansible_connection: "{{ __identity_set__.connection }}"
            ansible_password: null
            ansible_port: "{{ __identity_set__.port | default(None) }}"
            ansible_private_key: "{{ __identity_set__.private_key | default(None) }}"
            ansible_private_key_file: >-
              {{ __identity_set__.private_key_file | default(None) }}
            ansible_ssh_password: "{{ __identity_set__.password | default(None) }}"
            ansible_user: "{{ __identity_set__.user }}"
            ansible_winrm_message_encryption: >-
              {{ None if __identity_set__.connection != 'winrm'
                 else 'always' if (__identity_set__.port | default(5986) | int) == 5985
                 else 'auto' }}
            ansible_winrm_password: "{{ __identity_set__.password | default(None) }}"
            ansible_winrm_scheme: >-
              {{ None if __identity_set__.connection != 'winrm'
                 else 'http' if (__identity_set__.port | default(5986) | int) == 5985
                 else 'https' }}
            ansible_winrm_transport: "{{ __identity_set__.transport | default(None) }}"

    # measured: 8df5615 -- the join restart is scheduled 5 s out; the old boot may answer first.
    - name: 'PROCESS | Wait Until The Automation Identity Is Elevated On The New Boot'
      become: false
      changed_when: false
      check_mode: false
      ignore_errors: true
      ignore_unreachable: true
      loop: "{{ range(identity_wait_rounds | int) | list }}"
      loop_control:
        break_when:
          - >-
            __identity_post_join__ is skipped
            or (__identity_post_join__ is not unreachable
                and __identity_post_join__ is not failed
                and __identity_post_join__.stdout is search('S-1-16-12288')
                and (__identity_post_join__.stdout_lines | last | default('0') | int)
                    > (__domain_member_boot_time__ | int))
        label: "attempt {{ item + 1 }}"
        pause: "{{ identity_wait_pause_seconds | int }}"
      register: '__identity_post_join__'
      tags: ['always']
      vars:
        ansible_become: false
        ansible_control_path: 'none'
        ansible_ssh_use_tty: false
      when:
        - __domain_member_boot_time__ is defined
        - connection_transport == 'ssh'
      ansible.builtin.raw: >-
        powershell -NoProfile -NonInteractive -Command "whoami /groups /fo csv /nh;
        (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToFileTimeUtc()"

    - name: 'PROCESS | Require An Answer From The Automation Identity'
      tags: ['always']
      when:
        - __domain_member_boot_time__ is defined
        - connection_transport == 'ssh'
      ansible.builtin.assert:
        that:
          - (__identity_post_join__.results | last) is not unreachable
          - (__identity_post_join__.results | last) is not failed
          - (__identity_post_join__.results | last).stdout is search('S-1-16-12288')
          - >-
            ((__identity_post_join__.results | last).stdout_lines | last | default('0') | int)
            > (__domain_member_boot_time__ | int)
        fail_msg: >-
          After {{ identity_wait_rounds }} attempts {{ identity_wait_pause_seconds }} seconds
          apart the automation identity never answered over SSH with a High-integrity token on
          a boot newer than the join's restart; the last attempt's answer is in the task above.
        quiet: true
        success_msg: 'The automation identity is elevated on the new boot.'

    # measured: 8df5615 -- the join restart is scheduled 5 s out; delay skips the old boot.
    - name: 'PROCESS | Wait Until The Automation Identity Logs On After The Restart'
      tags: ['always']
      when:
        - __domain_member_boot_time__ is defined
        - connection_transport == 'winrm'
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        delay: 60
        sleep: "{{ identity_wait_pause_seconds | int }}"
        timeout: "{{ (identity_wait_rounds | int) * (identity_wait_pause_seconds | int) }}"

    - name: 'PROCESS | Resolve The Automation Identity On The New Boot'
      tags: ['always']
      vars:
        credential_resolver_boot_time_after: "{{ __domain_member_boot_time__ }}"
        credential_resolver_candidates: ["{{ connection_sets[connection_transport][0] }}"]
      when: __domain_member_boot_time__ is defined
      ansible.builtin.include_role:
        allow_duplicates: true
        apply: {tags: ['always']}
        defaults_from: 'main'
        name: 'credential_resolver'
        public: false
        rescuable: true
        rolespec_validate: true
        tasks_from: 'main'

    - name: 'PROCESS | Confirm The Host Is Ready On The New Boot'
      when: __domain_member_boot_time__ is defined
      ansible.builtin.include_role:
        allow_duplicates: true
        defaults_from: 'main'
        name: 'host_readiness'
        public: false
        rescuable: true
        rolespec_validate: true
        tasks_from: 'main'

    - name: 'PROCESS | Confirm The Join On The New Boot'
      vars:
        domain_member: "{{ domain_membership }}"
      when: __domain_member_boot_time__ is defined
      ansible.builtin.include_role:
        allow_duplicates: true
        defaults_from: 'main'
        handlers_from: 'main'
        name: 'domain_member'
        public: false
        rescuable: true
        rolespec_validate: true
        tasks_from: 'main'
        vars_from: 'main'

  #endregion --- [ Tasks ] -------------------------------------------------------------------- #

  #region ------ [ Post Tasks ] --------------------------------------------------------------- #
  post_tasks:
    # Function names map the EBS tags to the attached disks; the letters are the contract handed
    # to the products below for their databases and shared repository.
    - name: 'PROCESS | Provision The Data Disks'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'PDQINVENTORY'
              drive_letter: 'D'
              label: 'PDQINVENTORY'
              allocation_unit: 65536
            - function: 'PDQDEPLOY'
              drive_letter: 'E'
              label: 'PDQDEPLOY'
              allocation_unit: 65536
            - function: 'PDQREPO'
              drive_letter: 'F'
              label: 'PDQREPO'
              allocation_unit: 65536
      when: inventory_hostname in groups['pdq_servers']
      ansible.builtin.include_role:
        allow_duplicates: true
        defaults_from: 'main'
        name: 'windows_disk_manager'
        public: false
        rescuable: true
        rolespec_validate: true
        tasks_from: 'main'
        vars_from: 'main'

    # This bed's Windows image had nine disabled SMB rules (measured 2026-09-09). Limit ADMIN$
    # access to the console's address after the join applies the domain firewall profile.
    - name: 'PROCESS | Let The Console Reach This Target Over SMB'
      when: inventory_hostname in groups['domain_workstations']
      community.windows.win_firewall_rule:
        action: 'allow'
        description: >-
          Inbound SMB from the PDQ console, which reaches ADMIN$ to copy a package and start its
          runner
        direction: 'in'
        enabled: true
        localport: '445'
        name: 'PDQ managed target (SMB-In)'
        profiles: [ 'domain', 'private', 'public' ]
        protocol: 'tcp'
        remoteip: "{{ hostvars[groups['pdq_servers'] | first].aws_private_ip_address }}"
        state: 'present'

  #endregion --- [ Post Tasks ] --------------------------------------------------------------- #

#endregion --- [ Play: Configure The Hosts ] -------------------------------------------------- #

#region ------ [ Play: PDQ Deploy And Inventory ] --------------------------------------------- #
# One all-in-one Central Server: both products co-located, in the same operating mode, under one
# background service user. They are separate roles because each is separately installable, not
# because they are separately deployable.
#
# INVENTORY CONVERGES FIRST, and the order is a dependency rather than a preference. A Deploy
# package can gate a step on an Inventory COLLECTION; the condition travels by the collection's
# NAME but a deployment evaluates it by the id THIS console minted, so the package import resolves
# the name and writes that id. A collection that does not exist yet resolves to nothing, and the
# import stops rather than leaving a package that fails every deployment before its first step.
#
# Nothing runs the other way. Inventory's one reference into Deploy's volume -- the .NET installer
# it hands a target that lacks the framework -- is a path it STORES; the file is read at scan
# time, long after both roles have converged, so it does not have to be there when the path is.

- name: 'PLAY | PDQ Deploy And Inventory (all-in-one Central Server, ephemeral AWS)'
  hosts: 'pdq_servers'
  any_errors_fatal: true
  # The products are the slow half of a converge and the only half a host does not need to exist.
  # Tagged so a run can build the hosts alone -- domain membership, the tunnel, the disks -- when
  # what is under test is the ground the products stand on rather than the products.
  tags: ['products']
  vars:
    <<: *domain_directory
    # Deploy's repository volume, named ONCE here because both products need it: Deploy fills it
    # from the application repository, and Inventory reads the .NET installer back out of it.
    pdq_repository_directory: 'PDQ Repository'
    pdq_repository_drive: 'F'

    # Where every PDQ secret lives: one object per account, named after the account it opens.
    pdq_secret_prefix: "s3://{{ aws_account_id }}-ansible/applications/pdq"

    # The application repository both products read from. Stated once: it carries an account id,
    # so it is the kind of value that changes with the environment and nothing else.
    pdq_repository_bucket: "{{ aws_account_id }}-apprepo"


    # The pinned application values, defined ONCE here and handed to BOTH products below (they
    # share one custom-variable model). Version names use the fleet's <Publisher>_<Product> shape,
    # with words joined by dashes. A name here, in a package or collection definition, and in the
    # console is the same string. Every value is a repository version.
    # The map is the COMPLETE set:
    # only a name that is absent, or whose value differs, is written, each is proved to read
    # back, and a custom variable this map does not name is removed on the next converge --
    # proven from the product's own export.
    #
    # A version value is the version THE REPOSITORY HOLDS, not the newest a vendor has published.
    # The application repository is curated to mirror Add/Remove Programs, so one number serves
    # both readers: a package's install path resolves <publisher>/<application>/<version>/ against
    # the repository, and a compliance collection compares the same number to what a machine
    # reports. Pinning a version the repository does not carry breaks the first while looking
    # correct to the second.
    #
    # Reconciled against the bucket 2026-09-09. Five still name a version the repository does not
    # carry -- SSM Agent, Visual C++ v14, Windows Desktop Runtime, Firefox ESR and Git -- because
    # there the BUCKET is behind and the fix is to publish the artifact, not to lower the pin.
    # Twelve name software the repository does not carry at all, including the four Node.js majors:
    # the bucket files every Node.js build under one application, which one Add/Remove Programs
    # identity cannot express as four pins.
    pdq_variables:
      Adobe-Systems-Inc_Adobe-Acrobat-Reader-DC: '26.1.21789.0'
      Adobe-Systems-Inc_Adobe-Connect: '2026.3.125'
      Amazon-Web-Services_Amazon-CloudWatch-Agent: '1.4.37928.0'
      Amazon-Web-Services_AWS-Command-Line-Interface-v2: '2.36.31.0'
      Amazon-Web-Services_Amazon-EC2Launch: '2.5.2.0'
      Amazon-Web-Services_Amazon-SSM-Agent: '3.3.5226.0'
      Amazon-Web-Services_aws-cfn-bootstrap: '2.0.40.0'
      Anaconda-Inc_Anaconda3: '2025.12.2.0'
      Devolutions-Inc_Remote-Desktop-Manager: '2026.2.18.0'
      # Chrome Extended trails Stable numerically. Its pinned build's MSI ProductCode is INLINE
      # in the collection and the Install and Repair packages; move all three with the version.
      # The collection uses !Contains, not "ends with": nested negation does not correlate to one
      # application row and would miss a rogue registration beside a good one.
      Google-LLC_Google-Chrome: '152.0.7977.130'
      Igor-Pavlov_7-Zip: '26.02.00.0'
      Martin-Prikryl_WinSCP: '6.5.6.0'
      Microsoft-Corporation_Microsoft-Edge: '152.0.4191.53'
      Microsoft-Corporation_Microsoft-ODBC-Driver-17: '17.11.1.1'
      Microsoft-Corporation_Microsoft-ODBC-Driver-18: '18.6.2.1'
      Microsoft-Corporation_Microsoft-Office-LTSC-Professional-Plus-2021: '16.0.14334.20848'
      Microsoft-Corporation_Microsoft-Office-Professional-Plus-2019: '16.0.10417.20197'
      Microsoft-Corporation_Microsoft-OpenJDK-11: '11.0.32.101'
      Microsoft-Corporation_Microsoft-OpenJDK-17: '17.0.20.101'
      Microsoft-Corporation_Microsoft-OpenJDK-21: '21.0.12.101'
      Microsoft-Corporation_Microsoft-OpenJDK-25: '25.0.4.101'
      Microsoft-Corporation_Microsoft-Project-Professional-2019: '16.0.10417.20197'
      Microsoft-Corporation_Microsoft-Project-Professional-2021: '16.0.14334.20848'
      Microsoft-Corporation_Microsoft-Visual-C-v14: '14.51.36247.0'
      Microsoft-Corporation_Microsoft-Visual-Studio-Code: '1.136.0.0'
      Microsoft-Corporation_Microsoft-Windows-Desktop-Runtime: '10.0.11.50000'
      Microsoft-Corporation_PowerShell-7: '7.6.5.0'
      Mozilla_Mozilla-Firefox-ESR: '153.1.0'
      Node.js-Foundation_Node.js-21: '21.7.3'
      Node.js-Foundation_Node.js-22: '22.23.2'
      Node.js-Foundation_Node.js-24: '24.20.0'
      Node.js-Foundation_Node.js-25: '25.9.0'
      Notepad-Team_Notepad: '8.9.8.0'
      PDQ-com_PDQ-Deploy: '20.1.8.0'
      PDQ-com_PDQ-Inventory: '20.1.8.0'
      Prometheus-Community_Windows-Exporter: '0.31.8.0'
      Python-Software-Foundation_Python-3.10: '3.10.11150.0'
      Python-Software-Foundation_Python-3.11: '3.11.9150.0'
      Python-Software-Foundation_Python-3.12: '3.12.10150.0'
      Python-Software-Foundation_Python-3.13: '3.13.15150.0'
      Python-Software-Foundation_Python-3.14: '3.14.7150.0'
      Simon-Tatham_PuTTY: '0.85.0.0'
      Splunk-Inc_UniversalForwarder: '10.4.2.0'
      The-Git-Development-Community_Git: '2.55.0.5'
      Wazuh-Inc_Wazuh-Agent: '4.14.7'

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: PDQ Inventory ] --------------------------------------------------- #
    - role: 'pdq_inventory'
      vars:
        pdq_inventory:

          # The pinned application values, defined once in the play vars above and shared with
          # pdq_deploy: both products import the SAME map into their own variable stores.
          variables: "{{ pdq_variables }}"

          # WHERE the product syncs computers from. The realm and the containers are this
          # deployment's directory, not a product default, so they are named here; each bind
          # account is a name into the credential list below, and the role resolves its secret
          # there.
          #
          # All three top-level OUs, subtrees included: every computer the directory holds. It
          # matters because preferences.active_directory.delete_mode is FullSync, which deletes
          # every computer that is not inside an Include container -- a narrower list would remove
          # the rest from the database on the first sync.
          #
          # insecure: the directory answers nothing on 636 and refuses an anonymous bind, both
          # measured, so the read is plain LDAP on 389. Said here, in the open, rather than left
          # to a default that quietly downgrades.
          # Each class account is both the bind and scan identity for its OU. The local service
          # account is the default fallback for anything outside those OUs and for the console
          # itself; Deploy asks Inventory for a target's credential at deployment time.
          credentials:
            - username: 'tcn\svc-pdq-ws'
              password: "{{ lookup('secret', pdq_secret_prefix ~ '/svc-pdq-ws-password.txt') }}"
              description: 'Workstation class target authentication'
            - username: 'tcn\svc-pdq-ms'
              password: "{{ lookup('secret', pdq_secret_prefix ~ '/svc-pdq-ms-password.txt') }}"
              description: 'Member server class target authentication'
            - username: 'tcn\svc-pdq-dc'
              password: "{{ lookup('secret', pdq_secret_prefix ~ '/svc-pdq-dc-password.txt') }}"
              description: 'Domain controller class target authentication'
            - username: '.\svc-pdq'
              password: "{{ lookup('secret', pdq_secret_prefix ~ '/svc-pdq-password.txt') }}"
              description: 'Local fallback and console authentication'
              is_default: true

          directory_sync:
            realm: "{{ domain_realm }}"
            bind_username: 'tcn\svc-pdq-ms'
            insecure: true
            containers:
              - distinguished_name: "OU=Domain Servers,{{ domain_base_dn }}"
                bind_username: 'tcn\svc-pdq-ms'
                subtree: true
                include: true
              - distinguished_name: "OU=Domain Workstations,{{ domain_base_dn }}"
                bind_username: 'tcn\svc-pdq-ws'
                subtree: true
                include: true
              - distinguished_name: "OU=Domain Controllers,{{ domain_base_dn }}"
                bind_username: 'tcn\svc-pdq-dc'
                subtree: true
                include: true

          # The scanner needs .NET on a target before it can inventory it, and installs it on a
          # target that lacks it. The installer is the copy the repository sync placed on this
          # host -- the same object the console would otherwise be pointed at by hand. The path
          # names the object as the bucket lays it out: <publisher>/<application>/<version>/<file>.
          preferences:
            software_deployment:
              install_dotnet_automatically: true
              dotnet_installer_path: >-
                {{ pdq_repository_drive }}:\{{ pdq_repository_directory }}\Microsoft
                Corporation\.NET Framework\4.7.2\Microsoft-Corporation_NET-Framework_4.7.2_x86-x64.exe

          # Inventory ships its own installer from the application repository, verified on the
          # GUEST against this digest immediately before it runs. Same layout as Deploy: the role
          # composes <vendor>/<application>/<version>/<file> from this version, so only a version
          # and a digest belong here.
          installer:
            bucket: "{{ pdq_repository_bucket }}"
            version: '20.1.8.0'
            sha256: '48a486f3682cc01218993e72a8006163616166dd5f0fdcd1fab36724710fdbbf'

          # The ONE Background Service User both products share, declared exactly as Deploy
          # declares it: the account, and the password that opens it.
          service_account:
            password: "{{ lookup('secret', pdq_secret_prefix ~ '/svc-pdq-password.txt') }}"

          # Inventory has its OWN licence, distinct from Deploy's. The lookup verifies the stored
          # bytes against the pinned digest before passing the decoded value to the role. The
          # shared email is recorded with the product to prevent the first-console popup.
          license_key: >-
            {{ lookup('secret', pdq_secret_prefix ~ '/pdq-inventory-license-key.lic',
                      '2c3a3a3eba1f5692bad2581aafbed738ebf2fc48b1a1c9c201448d29d9caa70e') }}
          license_email: >-
            {{ lookup('secret', pdq_secret_prefix ~ '/pdq-inventory-license-email.txt') }}

          # Inventory's database grows without bound, so it goes on its own volume (D) rather than
          # the system disk. Only the letter belongs here; the folder beneath it is the role's
          # business. Inventory publishes no repository -- it is a scanner, not a deployer.
          database:
            drive: 'D'

          # The server answers consoles on the private address this host actually holds, assigned
          # at launch. The public address is not usable: AWS translates it, so the interface only
          # ever sees the private one, and binding to an address the host does not own fails at
          # service start.
          server:
            listen_addresses: [ "{{ aws_private_ip_address }}" ]

    #endregion --- [ Roles: PDQ Inventory ] --------------------------------------------------- #

    #region ------ [ Roles: PDQ Deploy ] ------------------------------------------------------ #
    - role: 'pdq_deploy'
      vars:
        pdq_deploy:

          # The pinned application values, defined once in the play vars above and shared with
          # pdq_inventory: both products import the SAME map into their own variable stores.
          variables: "{{ pdq_variables }}"

          # What is actually being installed, stated where a reader can see it. The digest is
          # verified on the GUEST immediately before the installer executes, so a changed object
          # with an unchanged pin stops the deployment.
          # Each artifact names its own bucket: executables live in the application repository,
          # licences stay beside the other deployment material. Both carry the account id, so they
          # are composed here rather than defaulted in the role.
          installer:
            bucket: "{{ pdq_repository_bucket }}"
            version: '20.1.8.0'
            sha256: '856dbe3dd4544d4b9ae1f382ee51f2a5f25f41714c462fa4afcff9743cc85eb9'

          # The Windows account the background service runs as, declared the way every account
          # here is: the account, and the password that opens it. '.\' is how Windows
          # spells "local to this machine". Both products share this ONE service identity. This
          # declaration configures service logon only; Inventory separately declares the same
          # local account as its fallback credential, while Deploy's credential store is empty.
          service_account:
            password: "{{ lookup('secret', pdq_secret_prefix ~ '/svc-pdq-password.txt') }}"

          # The licence lookup verifies the stored bytes against the pinned digest before passing
          # the decoded value to the role. The licence and its shared registration email are never
          # written to disk.
          license_key: >-
            {{ lookup('secret', pdq_secret_prefix ~ '/pdq-deploy-license-key.lic',
                      'b0564515695a9d78f9bd0f18ee01107ae1c0462ee3982da1ef6305f7bf77da68') }}
          license_email: >-
            {{ lookup('secret', pdq_secret_prefix ~ '/pdq-deploy-license-email.txt') }}

          # Deploy holds no target credential of its own. A deployment asks Inventory for the
          # target's scan credential, which Inventory assigns from the target's OU sync container.
          credentials: []

          # The database grows without bound, so it goes on the volume provisioned for it rather
          # than the system disk. Only the letter belongs here: which disk this host dedicates to
          # PDQ is a property of the host, and the folder beneath it is the role's business.
          database:
            drive: 'E'

          # The repository is shared out over the network, so it gets its own volume: package
          # files are written by administrators and read by every deployment.
          #
          # Its contents come from the application repository bucket -- the same bucket the
          # installer above is fetched from, because an installer PDQ deploys and an installer PDQ
          # runs are the same kind of object. The role writes a sync script carrying these two
          # values so an administrator can pull new content down without a deployment.
          repository:
            drive: "{{ pdq_repository_drive }}"
            directory: "{{ pdq_repository_directory }}"
            bucket: "{{ pdq_repository_bucket }}"
            region: "{{ aws_region }}"

          # The server answers consoles on the address this host actually holds, rather than on
          # everything it happens to be attached to. It comes from the inventory because the
          # address is assigned at launch and differs on every rebuild. The PUBLIC address is not
          # usable here: AWS translates it, so the interface only ever sees the private one, and
          # binding to an address the host does not own fails at service start.
          server:
            listen_addresses: [ "{{ aws_private_ip_address }}" ]

    #endregion --- [ Roles: PDQ Deploy ] ------------------------------------------------------ #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: PDQ Deploy And Inventory ] ------------------------------------------- #
