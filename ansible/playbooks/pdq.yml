# =========================================================================================== #
# File: 'ansible/playbooks/pdq.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Deploys the PDQ Deploy & Inventory all-in-one server (Central Server) to the 'pdq_servers'
# inventory group. Runs from the COMPOSED tree only — scripts/compose-and-run.sh overlays the
# roles into a pinned ansible-framework checkout and executes this playbook with the framework
# chassis. windows_disk_manager provisions the 3 data disks; the two application roles configure
# their independently owned PDQ prerequisites on top of them.
#
# Windows-over-SSH notes: the framework v3 loader is not yet Windows-aware; every workaround
# below is tagged TD-001 and tracked in docs/TECH-DEBT.md. Remove them when the framework ships
# loader v3.1 Windows support and .framework-pin is bumped.
#
# =========================================================================================== #
---
- name: 'PLAY | PDQ Deploy & Inventory (all-in-one Central Server)'
  hosts: 'pdq_servers'
  # TD-001: playbook-level gathering routes to the Windows setup module; with facts already
  # present, the loader skips its own ansible.builtin.setup call.
  gather_facts: true
  # TD-001: framework chassis ansible.cfg sets become=sudo (POSIX-only). The admin account over
  # SSH already holds an elevated token on Windows.
  become: false

  vars:
    # Platform convention: 'env' is the operator-facing extra-var; 'ENV' is the play-var the
    # loader validates (mirrors the wazuh/wsus central playbooks).
    ENV: "{{ env }}"  # noqa var-naming[pattern] -- loader contract uses uppercase ENV
    # Composed from the account the pre-task resolves at run time, so no account literal is
    # committed. Mapped into each consuming role namespace rather than restated per role.
    pdq_artifact_bucket: "{{ __pdq_caller__.account }}-ansible"
    pdq_apprepo_bucket: "{{ __pdq_caller__.account }}-apprepo"
    windows_disk_manager:
      # TD-001: disable the loader's POSIX temp-dir; the role owns its Windows operations.
      # NOTE: a `-e '{"windows_disk_manager":{...}}'` override REPLACES this whole mapping, so a
      # proof override must re-state temp_dir: false + disks.
      temp_dir: false
      platform: 'vmware'
      # windows_disk_manager (framework role, .framework-pin >= 1abfec4) provisions these 3 disks
      # end-to-end: init GPT -> partition -> NTFS format, force:false (idempotent), skip-if-ours.
      # unique_id captured from the live pdq-dev VM 2026-07-27 (a full clone re-mints all eui.*);
      # parameterize on backport to a *-template repo. Disk identity lives only in this platform
      # role declaration; application roles consume the resulting drive letters.
      disks:
        - unique_id: 'eui.E838E9FEF13BD475000C2960C66494AE'  # 20 GiB -> E: PDQDEPLOY    (PDQ Deploy DB)
          drive_letter: 'E'
          label: 'PDQDEPLOY'
          allocation_unit: 4096
        - unique_id: 'eui.FF1BA2DA823ECF16000C2965289C10F5'  # 20 GiB -> F: PDQINVENTORY (PDQ Inventory DB)
          drive_letter: 'F'
          label: 'PDQINVENTORY'
          allocation_unit: 4096
        - unique_id: 'eui.B3DC2EC9CC388D4F000C2968B08CFF5F'  # 30 GiB -> G: PDQSHARE     (Deploy App Share)
          drive_letter: 'G'
          label: 'PDQSHARE'
          allocation_unit: 4096
    # Composition invariant: define the Background Service User once and map the whole value into
    # both application namespaces. Any whole-dictionary override must preserve this invariant.
    pdq_service_account:
      name: 'svc-pdq'
      password: "{{ pdq_service_account_password }}"
    pdq_inventory:
      temp_dir: false
      service_account: "{{ pdq_service_account }}"
      inventory_installer:
        artifact_bucket: "{{ pdq_artifact_bucket }}"
    pdq_deploy:
      temp_dir: false
      service_account: "{{ pdq_service_account }}"
      repository: { dir_name: 'AppRepo', share_name: 'AppRepo' }
      deploy_installer:
        artifact_bucket: "{{ pdq_apprepo_bucket }}"

  pre_tasks:
    # TD-001: the loader's 'INIT | Loading Installed Package Facts' task runs
    # ansible.builtin.package_facts (Python-only, no disable flag) and would hard-fail on Windows.
    # Seeding an empty dict satisfies its 'when' guard. Set the 'packages' fact directly; NEVER set
    # the name 'ansible_facts', because that shadows the live facts store.
    - name: 'PRE | Seed empty package facts (loader Windows gap)'
      when: ansible_facts.packages is not defined
      ansible.builtin.set_fact:
        packages: {}
        cacheable: true

    - name: 'PRE | Resolve the controller AWS account'
      amazon.aws.aws_caller_info:
      delegate_to: 'localhost'
      run_once: true
      register: __pdq_caller__

  roles:
    - role: 'windows_disk_manager'
    - role: 'pdq_inventory'
    - role: 'pdq_deploy'
